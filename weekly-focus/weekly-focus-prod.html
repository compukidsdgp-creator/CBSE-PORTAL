ifts backward","Equilibrium is reached faster but position does not change","The value of Kc increases"],"ans":2,"exp":"A catalyst lowers activation energy for BOTH directions equally. It speeds up reaching equilibrium but cannot change where the balance point lies."},{"q":"For an endothermic reaction at equilibrium, increasing temperature will:","opts":["Shift equilibrium backward","Shift equilibrium forward","Have no effect on equilibrium","Decrease the rate of reaction"],"ans":1,"exp":"An endothermic reaction absorbs heat. Increasing temperature is like adding heat — the system absorbs it by shifting forward."},{"q":"CO₂(g) + H₂O(l) ⇌ H₂CO₃(aq). Why does removing the bottle cap make the drink go flat?","opts":["Temperature increases when opened","Pressure decreases — equilibrium shifts to produce more CO₂ gas","The catalyst (bottle) is removed","Concentration of H₂O decreases"],"ans":1,"exp":"CO₂ was dissolved under high pressure (sealed bottle). Opening reduces pressure, so the system shifts to relieve pressure by releasing CO₂ as gas."}],"flipcards":[{"front":"What does Le Chatelier's Principle state?","back":"A system at equilibrium shifts to reduce any applied disturbance"},{"front":"Effect of catalyst on equilibrium position?","back":"NO change in position — only speeds up reaching equilibrium"},{"front":"In Haber Process, why use 450°C not higher?","back":"Reaction is exothermic — high temp reduces NH3 yield; 450°C is a rate-yield compromise"},{"front":"Pressure increase shifts equilibrium toward...?","back":"The side with FEWER moles of gas"},{"front":"Adding more reactant shifts equilibrium...?","back":"Forward (right) — to consume the extra reactant"},{"front":"Why does fizzy drink go flat faster when warm?","back":"Higher temp favours endothermic reverse reaction — CO₂ escapes from solution"}],"archive":[{"emoji":"📐","title":"Integration by Parts","meta":"Week 44 · Mathematics · Class 12"},{"emoji":"🧬","title":"DNA Replication","meta":"Week 43 · Biology · Class 12"},{"emoji":"⚡","title":"Kirchhoff's Laws","meta":"Week 42 · Physics · Class 12"},{"emoji":"📊","title":"Marketing Mix (4Ps)","meta":"Week 41 · Business Studies"}],"upcoming":[{"week":"W46","title":"Photoelectric Effect","subject":"Physics"},{"week":"W47","title":"Demand Elasticity","subject":"Economics"},{"week":"W48","title":"Determinants","subject":"Mathematics"},{"week":"W49","title":"Plant Hormones","subject":"Biology"}]};

var TOTAL = 5;
var completed = {};
var DATA = null;
var qIndex = 0, score = 0, answered = false;

/* Try fetch() first (GitHub Pages / HTTP server).
   If blocked (file:// protocol), fall back to inline data. */
(function(){
  if(typeof fetch === 'undefined'){
    DATA = INLINE_DATA; renderPage(); return;
  }
  fetch('weekly-focus.json')
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(data){ DATA=data; renderPage(); })
    .catch(function(){ DATA=INLINE_DATA; renderPage(); });
})();

function renderPage(){
  var d=DATA, m=d.meta;
  document.getElementById('weekPill').textContent='Week '+m.week+' · '+m.month;
  document.title='Weekly Focus — '+d.hero.title.substring(0,50);

  document.getElementById('heroSection').innerHTML=
    '<div class="hero">'+
    '<div class="hero-art">'+m.emoji+'</div>'+
    '<div class="hero-eyebrow">'+m.emoji+' '+m.subject+' · '+m.class+' · '+m.chapter+'</div>'+
    '<h1>'+d.hero.title+'</h1>'+
    '<p class="hero-hook">'+d.hero.hook+'</p>'+
    '<div class="hero-chips">'+
    '<span class="hchip">&#9201; '+m.read_time+'</span>'+
    '<span class="hchip">&#127919; '+m.stats+'</span>'+
    '<span class="hchip">&#128203; Board exam tips included</span>'+
    '</div></div>';

  document.getElementById('sectionsWrap').innerHTML=
    mkSection(1,'🤔 Start with a Question','A mystery that will make you think',mkHook())+
    mkSection(2,'💡 The Core Concept','Understand what is really happening',mkConcept())+
    mkSection(3,'📌 Board Exam Key Points','What CBSE specifically tests every year',mkKeyPoints())+
    mkSection(4,'⚡ Quick Quiz — Test Yourself',d.quiz.length+' questions · instant feedback',mkQuizShell())+
    mkSection(5,'🃏 Memory Flip Cards','Flip to test your recall before you go',mkFlipCards());

  document.getElementById('body1').classList.add('open');
  document.getElementById('trig1').classList.add('active');
  document.getElementById('bottomStrip').innerHTML=mkArchive()+mkUpcoming();
  initQuiz();
}

function mkSection(n,title,sub,body){
  return '<div class="section-block">'+
    '<button class="section-trigger" onclick="toggleSection(this,'+n+')" id="trig'+n+'">'+
    '<div class="step-num">'+n+'</div>'+
    '<div class="step-label"><div class="step-title">'+title+'</div><div class="step-sub">'+sub+'</div></div>'+
    '<span class="step-arrow">&#8250;</span></button>'+
    '<div class="section-body" id="body'+n+'">'+body+'</div></div>';
}

function mkHook(){
  var h=DATA.hook_section;
  return '<div class="hook-card"><div class="hook-icon">'+h.scenario_icon+'</div>'+
    '<div class="hook-text"><b>Think about this:</b> '+h.scenario+'</div></div>'+
    '<p class="bridge-text">'+h.bridge+'</p>'+
    '<p class="punchline">'+h.punchline+'</p>'+
    '<button class="btn-next" onclick="nextSection(2)">Got it — show me the concept →</button>';
}

function mkConcept(){
  var c=DATA.concept_section;
  var reveals=c.reveals.map(function(r){
    return '<div class="reveal-row">'+
      '<button class="reveal-btn" onclick="revealToggle(this)"><span>'+r.question+'</span><span>+</span></button>'+
      '<div class="reveal-content">'+r.answer+'</div></div>';
  }).join('');
  return '<div class="analogy"><div class="a-label">'+c.analogy_icon+' The Analogy</div><p>'+c.analogy+'</p></div>'+
    '<p class="principle-text">'+c.principle+'</p>'+
    '<p class="reveal-prompt">'+c.reveal_prompt+'</p>'+reveals+
    '<button class="btn-next" onclick="nextSection(3)">I understand — show me key points →</button>';
}

function mkKeyPoints(){
  var kp=DATA.keypoints_section;
  var pts=kp.points.map(function(p){
    return '<li class="kp-item"><div class="kp-dot"></div><div class="kp-text">'+p+'</div></li>';
  }).join('');
  var eqs=kp.exam_questions.map(function(e){
    return '<div class="exam-row"><span class="exam-mark">'+e.marks+'</span>'+e.question+'</div>';
  }).join('');
  return '<ul class="kp-list">'+pts+'</ul>'+
    '<div class="exam-card"><div class="exam-label">&#128203; Likely Exam Questions</div>'+
    '<div class="exam-items">'+eqs+'</div></div>'+
    '<button class="btn-next" onclick="nextSection(4)">Ready for the quiz →</button>';
}

function mkQuizShell(){
  return '<div class="quiz-wrap" id="quizWrap">'+
    '<div class="q-header"><span class="q-num" id="qNum">Question 1 of '+DATA.quiz.length+'</span>'+
    '<span class="q-score" id="qScore">Score: 0</span></div>'+
    '<div id="quizContainer"></div></div>'+
    '<div class="quiz-result" id="quizResult">'+
    '<div class="result-score" id="resultScore">0/'+DATA.quiz.length+'</div>'+
    '<div class="result-msg" id="resultMsg"></div>'+
    '<button class="retry-btn" onclick="initQuiz()">&#x21A9; Try again</button></div>';
}

function mkFlipCards(){
  var cards=DATA.flipcards.map(function(fc){
    return '<div class="flip-card" onclick="this.classList.toggle(\'flipped\')">'+
      '<div class="flip-inner">'+
      '<div class="flip-face flip-front">'+fc.front+'</div>'+
      '<div class="flip-face flip-back">'+fc.back+'</div>'+
      '</div></div>';
  }).join('');
  return '<p class="memory-intro">Read the front, recall the answer in your head, then flip to check.</p>'+
    '<div class="flip-grid">'+cards+'</div>';
}

function mkArchive(){
  var rows=DATA.archive.map(function(a){
    return '<div class="arc-row"><div class="arc-icon">'+a.emoji+'</div>'+
      '<div><div class="arc-title">'+a.title+'</div><div class="arc-sub">'+a.meta+'</div></div></div>';
  }).join('');
  return '<div class="strip-card"><h4>&#128218; Previous Focus Areas</h4>'+rows+'</div>';
}

function mkUpcoming(){
  var rows=DATA.upcoming.map(function(u){
    return '<div class="upcoming-row"><span class="up-week">'+u.week+'</span>'+
      '<div class="up-text"><span class="up-sub">'+u.title+'</span> · '+u.subject+'</div></div>';
  }).join('');
  return '<div class="strip-card"><h4>&#128467; Coming Up Next</h4>'+rows+
    '<div style="margin-top:14px;border-top:1px solid var(--border);padding-top:10px;font-size:12px;color:var(--fg2)">'+
    '&#128233; New focus every <b>Monday</b> — follow on Telegram</div></div>';
}

function toggleSection(btn,n){
  var body=document.getElementById('body'+n);
  var isOpen=body.classList.contains('open');
  for(var i=1;i<=TOTAL;i++){
    document.getElementById('body'+i).classList.remove('open');
    document.getElementById('trig'+i).classList.remove('active');
  }
  if(!isOpen){body.classList.add('open');btn.classList.add('active');updateProgress();}
}

function nextSection(n){
  completed[n-1]=true;
  document.getElementById('trig'+(n-1)).classList.add('done');
  document.getElementById('trig'+(n-1)).classList.remove('active');
  document.getElementById('body'+(n-1)).classList.remove('open');
  document.getElementById('trig'+n).classList.add('active');
  document.getElementById('body'+n).classList.add('open');
  document.getElementById('trig'+n).scrollIntoView({behavior:'smooth',block:'start'});
  if(n===4) initQuiz();
  updateProgress();
}

function updateProgress(){
  var count=Object.keys(completed).length;
  document.getElementById('progBar').style.width=Math.round((count/TOTAL)*100)+'%';
}

function revealToggle(btn){
  var content=btn.nextElementSibling;
  var isOpen=content.classList.contains('show');
  content.classList.toggle('show');
  btn.children[1].textContent=isOpen?'+':'−';
}

function initQuiz(){
  qIndex=0;score=0;answered=false;
  var wrap=document.getElementById('quizWrap');
  var result=document.getElementById('quizResult');
  if(wrap) wrap.style.display='block';
  if(result) result.classList.remove('show');
  renderQ();
}

function renderQ(){
  var q=DATA.quiz[qIndex];
  var el=document.getElementById('quizContainer');
  if(!q||!el) return;
  document.getElementById('qNum').textContent='Question '+(qIndex+1)+' of '+DATA.quiz.length;
  document.getElementById('qScore').textContent='Score: '+score;
  var letters=['A','B','C','D'];
  var opts=q.opts.map(function(o,i){
    return '<button class="q-opt" onclick="checkAns(this,'+i+')">'+
      '<span class="opt-letter">'+letters[i]+'</span>'+o+'</button>';
  }).join('');
  el.innerHTML='<div><div class="q-text">'+q.q+'</div><div class="q-opts">'+opts+'</div>'+
    '<div class="q-explain" id="qExp"></div></div>';
  answered=false;
}

function checkAns(btn,idx){
  if(answered) return;
  answered=true;
  var q=DATA.quiz[qIndex];
  var opts=btn.closest('.q-opts').querySelectorAll('.q-opt');
  for(var i=0;i<opts.length;i++) opts[i].disabled=true;
  if(idx===q.ans){btn.classList.add('correct');score++;}
  else{btn.classList.add('wrong');opts[q.ans].classList.add('correct');}
  var exp=document.getElementById('qExp');
  if(exp){
    exp.innerHTML='<strong>'+(idx===q.ans?'✅ Correct!':'❌ Not quite.')+'</strong> '+q.exp;
    exp.classList.add('show');
  }
  document.getElementById('qScore').textContent='Score: '+score;
  setTimeout(function(){
    qIndex++;
    if(qIndex<DATA.quiz.length) renderQ(); else showResult();
  },2200);
}

function showResult(){
  var wrap=document.getElementById('quizWrap');
  var res=document.getElementById('quizResult');
  if(wrap) wrap.style.display='none';
  if(!res) return;
  res.classList.add('show');
  document.getElementById('resultScore').textContent=score+'/'+DATA.quiz.length;
  var msgs=['Keep going - re-read the concept section!','Good start! Review the key points once more',
    'Great work! You have got this concept','Excellent! Almost there','Perfect score! You are exam-ready!'];
  document.getElementById('resultMsg').textContent=msgs[Math.min(score,msgs.length-1)];
  completed[4]=true;
  var t4=document.getElementById('trig4');
  if(t4) t4.classList.add('done');
  updateProgress();
}
</script>
</body>
</html>
