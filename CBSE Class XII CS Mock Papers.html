// ─── QUESTION PICKER ─────────────────────────────────────────────────────────
function pick(pool, offset, count) {
  const r = [];
  for(let i=0;i<count;i++) r.push(pool[(offset+i)%pool.length]);
  return r;
}

function buildPaper(n) {
  const o = n * 3;
  // 21 Sec-A questions: ~12 python output, ~6 SQL, ~3 network (rotate)
  const secA_py  = pick(pyMCQ,  o*2, 12);
  const secA_sql = pick(sqlMCQ, o,   6);
  const secA_net = pick(netMCQ, o,   3);
  return {
    title: `Practice Paper ${n+1}`,
    secA: { py: secA_py, sql: secA_sql, net: secA_net },
    secB: pick(secBpool, o, 7),
    secC: pick(secCpool, o, 3),
    secD: pick(secDpool, o, 4),
    secE: pick(secEpool, o, 2)
  };
}

const PAPERS = [];
for(let i=0;i<15;i++) PAPERS.push(buildPaper(i));

// ─── RENDER ──────────────────────────────────────────────────────────────────
let cur = 0;

function buildChips(){
  const c = document.getElementById('chips');
  for(let i=0;i<15;i++){
    const b = document.createElement('button');
    b.className='chip'+(i===0?' active':'');
    b.textContent=`Paper ${i+1}`;
    b.onclick=()=>sel(i);
    c.appendChild(b);
  }
}

function sel(i){
  cur=i;
  document.querySelectorAll('.chip').forEach((c,j)=>c.classList.toggle('active',j===i));
  render(PAPERS[i]);
  window.scrollTo({top:0,behavior:'smooth'});
}

function escH(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function qblock(num, text, opts, marks, code){
  const hasCode = text.includes('\n') || code;
  const mainText = hasCode ? text.split('\n')[0] : text;
  const codeLines = code || (hasCode ? text.split('\n').slice(1).join('\n') : '');
  return `<div class="qb">
    <div class="qh">
      <span class="qn">Q${num}.</span>
      <span class="qt">${escH(mainText)}</span>
      <span class="qm">${marks} Mark${marks>1?'s':''}</span>
    </div>
    ${codeLines ? `<div class="code-blk">${escH(codeLines)}</div>` : ''}
    ${opts ? `<div class="opts">${opts.map(o=>`<div class="opt">${escH(o)}</div>`).join('')}</div>` : ''}
  </div>`;
}

function longQ(num, text, marks){
  const lines = text.split('\n');
  const first = lines[0];
  const rest = lines.slice(1).join('\n');
  return `<div class="qb">
    <div class="qh">
      <span class="qn">Q${num}.</span>
      <span class="qt">${escH(first)}</span>
      <span class="qm">${marks} Marks</span>
    </div>
    ${rest ? `<div class="code-blk" style="font-family:inherit;font-size:.88rem">${escH(rest)}</div>` : ''}
  </div>`;
}

function acc(id, title, content){
  return `<div class="kacc">
    <button class="kbtn" onclick="tog(this,'kp${id}')">${escH(title)} <span class="karr">▼</span></button>
    <div class="kpanel" id="kp${id}">${content}</div>
  </div>`;
}

function krow(qnum, ans){
  return `<div class="kr"><span class="kq">Q${qnum}</span><span class="ka"><b>${escH(ans)}</b></span></div>`;
}

function krowLong(qnum, ans){
  return `<div class="kr" style="flex-direction:column;align-items:flex-start;margin-bottom:14px">
    <span class="kq" style="margin-bottom:4px">Q${qnum}</span>
    <span class="ka"><pre style="white-space:pre-wrap;font-family:inherit">${escH(ans)}</pre></span>
  </div>`;
}

function render(p){
  const allA = [...p.secA.py, ...p.secA.sql, ...p.secA.net];
  let qnum = 1;
  let html = `
  <div class="ph">
    <div class="board">Central Board of Secondary Education</div>
    <h1>COMPUTER SCIENCE (Code 083)</h1>
    <div class="sub">Class XII — Annual Board Examination 2026–27</div>
    <div class="ph-meta"><span>⏱ Time: 3 Hours</span><span>📝 Max Marks: 70</span><span>📋 ${p.title}</span></div>
  </div>
  <div class="instr">
    <strong>General Instructions</strong>
    <ol>
      <li>This question paper contains <b>37 questions</b>. All questions are compulsory.</li>
      <li>Internal choices are provided in some questions. Attempt only one choice.</li>
      <li><b>Section A</b> (Q1–21): 1 mark each = 21 marks</li>
      <li><b>Section B</b> (Q22–28): 2 marks each = 14 marks</li>
      <li><b>Section C</b> (Q29–31): 3 marks each = 9 marks</li>
      <li><b>Section D</b> (Q32–35): 4 marks each = 16 marks</li>
      <li><b>Section E</b> (Q36–37): 5 marks each = 10 marks</li>
      <li>All programming questions must be answered using Python only.</li>
      <li>For MCQs, write the text of the correct answer along with the option letter.</li>
    </ol>
  </div>
  <div class="body">
  <div class="sec-hd">Section A — Objective Type Questions &nbsp;|&nbsp; 21 × 1 = 21 Marks</div>`;

  // Sec A — first 12 Python output/MCQ
  for(let i=0;i<12;i++){
    const q = p.secA.py[i];
    const lines = q.q.split('\n');
    const first = lines[0];
    const code  = lines.length>1 ? lines.slice(1).join('\n') : '';
    html += qblock(qnum++, first, q.o||null, 1, code);
  }
  // Sec A — 6 SQL
  for(let i=0;i<6;i++){
    const q = p.secA.sql[i];
    const lines = q.q.split('\n');
    html += qblock(qnum++, lines[0], q.o||null, 1, lines.length>1?lines.slice(1).join('\n'):'');
  }
  // Sec A — 3 Network
  for(let i=0;i<3;i++){
    const q = p.secA.net[i];
    const lines = q.q.split('\n');
    html += qblock(qnum++, lines[0], q.o||null, 1, lines.length>1?lines.slice(1).join('\n'):'');
  }

  html += `<div class="sec-hd">Section B — Short Answer Questions &nbsp;|&nbsp; 7 × 2 = 14 Marks</div>`;
  for(let i=0;i<7;i++) html += longQ(qnum++, p.secB[i].q, 2);

  html += `<div class="sec-hd">Section C — Short Answer Questions &nbsp;|&nbsp; 3 × 3 = 9 Marks</div>`;
  for(let i=0;i<3;i++) html += longQ(qnum++, p.secC[i].q, 3);

  html += `<div class="sec-hd">Section D — Long Answer Questions &nbsp;|&nbsp; 4 × 4 = 16 Marks</div>`;
  for(let i=0;i<4;i++) html += longQ(qnum++, p.secD[i].q, 4);

  html += `<div class="sec-hd">Section E — Case-Based / Long Answer Questions &nbsp;|&nbsp; 2 × 5 = 10 Marks</div>`;
  for(let i=0;i<2;i++) html += longQ(qnum++, p.secE[i].q, 5);

  // ── ANSWER KEY ──────────────────────────────────────────────
  let kn = 1;
  const pyRows    = p.secA.py.map((q,i)=>krow(kn+i, q.a)).join('');
  kn+=12;
  const sqlRows   = p.secA.sql.map((q,i)=>krow(kn+i, q.a)).join('');
  kn+=6;
  const netRows   = p.secA.net.map((q,i)=>krow(kn+i, q.a)).join('');
  kn+=3;
  const bRows     = p.secB.map((q,i)=>krowLong(kn+i, q.a)).join(''); kn+=7;
  const cRows     = p.secC.map((q,i)=>krowLong(kn+i, q.a)).join(''); kn+=3;
  const dRows     = p.secD.map((q,i)=>krowLong(kn+i, q.a)).join(''); kn+=4;
  const eRows     = p.secE.map((q,i)=>krowLong(kn+i, q.a)).join('');

  html += `
  <div class="key-sec">
    <div class="key-hd">📋 Answer Key — ${p.title}</div>
    <p style="font-size:.78rem;color:var(--muted);text-align:center;margin-bottom:12px">Click any section to expand / collapse</p>
    ${acc('sa1','Section A — Q1–12: Python Output / MCQ Answers', pyRows)}
    ${acc('sa2','Section A — Q13–18: SQL MCQ Answers', sqlRows)}
    ${acc('sa3','Section A — Q19–21: Networking MCQ Answers', netRows)}
    ${acc('sb','Section B — Q22–28: Short Answer Keys (2 marks)', bRows)}
    ${acc('sc','Section C — Q29–31: Answer Keys (3 marks)', cRows)}
    ${acc('sd','Section D — Q32–35: Answer Keys (4 marks)', dRows)}
    ${acc('se','Section E — Q36–37: Answer Keys (5 marks)', eRows)}
  </div>
  </div>`;

  document.getElementById('area').innerHTML = html;
}

function tog(btn, id){
  btn.classList.toggle('open');
  const p = document.getElementById(id);
  if(p) p.classList.toggle('show');
}

buildChips();
render(PAPERS[0]);
</script>

(function(){
  function initTabHint(rowId){

    // Wrap in scroll-wrap div if not already wrapped
    if(!row.parentElement.classList.contains('tab-scroll-wrap')){
      var wrap = document.createElement('div');
      wrap.className = 'tab-scroll-wrap';
      row.parentNode.insertBefore(wrap, row);
      wrap.appendChild(row);
    }
    var wrap = row.parentElement;
    // Hide fade when scrolled to end
    row.addEventListener('scroll', function(){
      var atEnd = row.scrollLeft + row.clientWidth >= row.scrollWidth - 4;
      wrap.classList.toggle('at-end', atEnd);
    }, {passive:true});
    // One-time bounce nudge: scroll right 80px then back
    if(row.scrollWidth > row.clientWidth + 10){
      setTimeout(function(){
        row.scrollTo({left:row.scrollWidth, behavior:'smooth'});
        setTimeout(function(){
          row.scrollTo({left:0, behavior:'smooth'});
        }, 1800);
      }, 800);
    }
  }
  document.addEventListener('DOMContentLoaded', function(){
    initTabHint('mainTabs');   // resource pages
    initTabHint('toolTabs');   // resource pages second row
    initTabHint('tabs');       // practice paper pages
  });
})();
