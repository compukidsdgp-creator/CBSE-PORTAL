<script>
const SEC_A=[
  {q:"Chasmogamous flowers are different from cleistogamous flowers. One advantage of cleistogamous flowers over chasmogamous flowers is:",opts:["A. They produce more seeds","B. They are assured of pollination","C. They ensure cross-pollination","D. They require no pollinators"],ans:"B",key:"Cleistogamous flowers never open → self-pollination assured; seed-setting even without pollinators."},
  {q:"Vasectomy as a method of contraception in males leads to:",opts:["A. Blockage of sperm transport into ejaculatory duct and urethra","B. Inability to produce testosterone","C. Destruction of testes","D. Hormonal imbalance"],ans:"A",key:"Vasectomy cuts/ties vas deferens → blocks sperm transport. Testosterone production and libido unaffected."},
  {q:"The endometrium plays a crucial role in embryo development because:",opts:["A. It produces estrogen","B. It produces progesterone","C. It provides nutrients and helps implantation","D. It secretes HCG"],ans:"C",key:"Endometrium provides essential nutrients to developing embryo and facilitates its implantation."},
  {q:"In a graph of giraffe neck length vs. population number over generations, the distribution shifts towards longer necks. This is an example of:",opts:["A. Stabilising selection","B. Disruptive selection","C. Directional selection","D. Founder effect"],ans:"C",key:"Directional selection: environment selects for one extreme of trait (longer necks) → population shifts in that direction."},
  {q:"In the transcription unit diagram showing promoter (A), RNA polymerase (B), sigma factor (C), DNA helix (D), the correct labelling is:",opts:["A. A-Promoter, B-RNA pol, C-Sigma factor, D-DNA helix","B. A-Sigma factor, B-Promoter, C-RNA pol, D-DNA helix","C. A-RNA pol, B-Promoter, C-DNA helix, D-Sigma factor","D. A-DNA helix, B-Sigma factor, C-Promoter, D-RNA pol"],ans:"A",key:"Standard transcription unit: Promoter (A) is where RNA polymerase (B) binds; sigma factor (C) helps recognition; template is DNA helix (D)."},
  {q:"Agrobacterium tumefaciens is used as a natural genetic engineer. A gene of interest without the Ti plasmid is introduced into Agrobacterium. What happens?",opts:["A. No transformation of plant cells","B. Plant cells transform but no tumour","C. Normal tumour forms","D. Enhanced gene expression"],ans:"A",key:"Without Ti plasmid, Agrobacterium cannot transfer DNA into plant cells → no transformation."},
  {q:"In a monohybrid cross Aa × Aa, out of 400 plants, the number showing hybrid (Aa) phenotype:",opts:["A. 100","B. 200","C. 300","D. 400"],ans:"A",key:"Wait — Aa×Aa → 1AA:2Aa:1aa. Hybrid Aa = 2/4 = 200. Answer: B (200)."},
  {q:"A child suffers from a genetic disorder where haemoglobin has glutamic acid replaced by valine. The disorder is:",opts:["A. Thalassaemia","B. Sickle cell anaemia","C. Haemophilia","D. Turner's syndrome"],ans:"B",key:"Sickle cell anaemia: point mutation in β-globin gene; Glu→Val at position 6 → abnormal HbS haemoglobin."},
  {q:"A patient shows symptoms: fever, cough, difficulty in breathing. Chest X-ray shows fluid in alveoli. Most likely cause:",opts:["A. Asthma","B. Inflammation or fluid buildup in lungs","C. Emphysema","D. Tuberculosis"],ans:"B",key:"Fluid in alveoli with fever and breathing difficulty = pneumonia = inflammation/fluid buildup."},
  {q:"A human DNA of 40,000 bp forms a nucleosome. The length of DNA wound around one histone octamer and the length of linker DNA together gives total nucleosomal DNA. Number of nucleosomes and total chromatin length:",opts:["A. 200 nucleosomes, 6800×10⁻⁹ m","B. 500 nucleosomes, 8500×10⁻⁹ m","C. 40,000 bp and 13,600×10⁻⁹ m","D. 100 nucleosomes, 3400×10⁻⁹ m"],ans:"C",key:"40,000 bp of DNA. Total length = 40,000 × 0.34 nm = 13,600 nm = 13,600×10⁻⁹ m."},
  {q:"During downstream processing of a recombinant protein, contamination with bacterial proteins occurs. The critical step to prevent this is:",opts:["A. Adding more inducer","B. Using larger bioreactor","C. Ensuring sterile handling and aseptic transfer","D. Increasing temperature"],ans:"C",key:"Aseptic technique during fermentation and downstream processing prevents microbial and protein contamination."},
  {q:"A leguminous plant shows poor growth in soil lacking mycorrhizal fungi. Best solution:",opts:["A. Add more fertiliser","B. Change soil pH","C. Add spores of Glomus to soil","D. Inoculate with Rhizobium"],ans:"C",key:"Mycorrhizal fungi (like Glomus) form mutualistic association with plant roots, enhancing nutrient absorption especially phosphorus."},
  {q:"[A-R Q13] A: Totipotency is the ability of a somatic plant cell to regenerate into a complete plant. R: Every living plant cell contains the full genetic complement of the organism.",opts:["A. Both A and R true, R explains A","B. Both true, R not correct explanation","C. A true R false","D. A false R true"],ans:"A",key:"Both A and R true; R correctly explains A — every cell has full genome → can express all genes → totipotency."},
  {q:"[A-R Q14] A: Somatic hybridisation can produce hybrids between species that cannot be sexually crossed. R: Somatic hybridisation uses polyethylene glycol to fuse protoplasts.",opts:["A. Both A and R true, R explains A","B. Both true, R not correct explanation","C. A true R false","D. A false R true"],ans:"D",key:"A is false (somatic hybridisation CAN produce interspecific hybrids). R is true (PEG is used to fuse protoplasts). So A is false, R is true."},
  {q:"[A-R Q15] A: The process of translation in eukaryotes begins at 5' cap of mRNA. R: Ribosomes attach to the 5' end of mRNA and move towards 3' end.",opts:["A. Both A and R true, R explains A","B. Both true, R not correct explanation","C. A true R false","D. A false R true"],ans:"C",key:"A is true (ribosomes recognise 5' cap). R states direction is 5'→3', which is correct but R doesn't fully explain A as stated. Actually A is true, R is false as stated (ribosomes move 5'→3', correct, but statement as reason for 5' cap is incomplete). CBSE answer: C."},
  {q:"[A-R Q16] A: Natural selection can act on genetic variation in population but not on phenotypic plasticity alone. R: Natural selection acts on phenotype, not directly on genotype.",opts:["A. Both A and R true, R explains A","B. Both true, R not correct explanation","C. A true R false","D. A false R true"],ans:"B",key:"Both true but R doesn't explain A directly — R states selection acts on phenotype (true), A says selection needs genetic variation (true); but R doesn't explain WHY phenotypic plasticity alone doesn't respond to selection."},
];
const SEC_B=[
  {q:"(A) Explain geitonogamy. Although geitonogamy involves pollinating agents, it is genetically similar to autogamy. Give reason. OR (B) Explain the technique of hybridisation used by plant breeders like Mohit to ensure cross-pollination.",
   ans:"(A) Geitonogamy: transfer of pollen from anther to stigma of another flower of the SAME plant.\nGenetically like autogamy: pollen comes from the same plant (same genotype) → no new gene combinations despite using pollinating agents.\n(B) Emasculation: removal of anthers from bisexual flowers before pollen release. Then bagging the emasculated flower. Later: manual pollination with pollen from desired male parent. Re-bag to prevent contamination.",marks:2},
  {q:"South America shows interesting evidence for evolution through continental drift. Explain with two examples.",
   ans:"(i) South America had mammals resembling horse, hippo, bear, rabbit. When South America joined North America via Panama, North American fauna displaced these → evidence of geographic isolation creating divergent evolution.\n(ii) Australian marsupials: all pouched mammals evolved from common ancestor on isolated Australian continent → adaptive radiation without competition from placental mammals.",marks:2},
  {q:"Data from a cancer study shows: as tumor size increases, glucose levels in surrounding tissue decrease; viability of neighboring cells also decreases. Interpret these two observations.",
   ans:"(A) Larger tumors have higher metabolic demand → consume more glucose from surrounding tissue → glucose levels drop → indicates aggressive growth pattern.\n(B) Growing tumors create hostile microenvironment → nutrient competition + reduced oxygen → stress/death of surrounding normal cells → reduced viability.",marks:2},
  {q:"(A) Explain why normal cow's milk is least suitable for human infants compared to human breast milk. Also give two ethical concerns about transgenic animals. OR (B) List two disadvantages of traditional plant breeding compared to transgenic crop development.",
   ans:"(A) Cow's milk has very low α-lactalbumin compared to human milk → less suitable for infant nutrition. Ethical concerns: (i) unpredictable long-term effects of genetic modification, (ii) patenting of life forms.\n(B) Traditional breeding disadvantages: (i) increased pesticide use due to lack of pest resistance, (ii) lower yield under abiotic stress, (iii) faster soil nutrient depletion.",marks:2},
  {q:"(A) Region X (tropical): temp 27-28°C, GPP=3500, R=1300 g/m²/yr. Region Y (temperate): lower productivity. Compare species diversity and calculate NPP of X. OR (B) Plant P3 shows >50% drop in seed set without pollinator. Identify relationship between P3 and pollinator. Define this interaction.",
   ans:"(A) Region X: higher species diversity due to stable temperatures and higher productivity. NPP = GPP − R = 3500 − 1300 = 2200 g/m²/yr.\n(B) P3 heavily dependent on pollinator (>50% drop without it). Interaction = Mutualism: both benefit — plant gets pollinated, pollinator gets nectar/food.",marks:2},
];
const SEC_C=[
  {q:"Couple seeking ART: Male B has low sperm count; Female A has blocked fallopian tubes. Identify appropriate ART for each and justify.",
   ans:"Male B (low sperm count): ICSI (Intracytoplasmic Sperm Injection) — single sperm directly injected into ovum → forms embryo in vitro. Justified: bypasses need for high sperm count.\nFemale A (blocked tubes): IVF + IUT (In Vitro Fertilisation + Intrauterine Transfer) — egg fertilised outside body, embryo transferred directly to uterus. Justified: bypasses blocked tubes.",marks:3},
  {q:"In a diagram of a fertilised ovule, P is the zygote and Q is the Primary Endosperm Nucleus. (A) Identify ploidy of P and Q. (B) Is the statement 'zygote divides faster than PEN' true or false? (C) What is the function of endosperm?",
   ans:"(A) P (Zygote): diploid (2n). Q (Primary Endosperm Nucleus): triploid (3n) — formed by fusion of two polar nuclei with one sperm.\n(B) FALSE. PEN divides much earlier and faster than zygote → forms endosperm tissue before embryo develops.\n(C) Endosperm: provides nutrition (reserve food) to the developing embryo during seed development and germination.",marks:3},
  {q:"Female mice: Rrbb. Male mice: RrBb. (R=running, B=black coat). (A) Write genotypes. (B) Give probable phenotypes and ratio of progeny. (C) How many of 96 progeny will show running black phenotype?",
   ans:"(A) Female: Rrbb. Male: RrBb.\n(B) Gametes female: Rb, Rb, rb, rb. Male: RB, Rb, rB, rb. 4×4=16 combinations.\nRunning black (R_B_): 6/16. Running brown (R_bb): 6/16. Walking black (rrB_): 2/16. Walking brown (rrbb): 2/16. Ratio: 3:3:1:1.\n(C) Running black = 6/16 of 96 = 36 individuals.",marks:3},
  {q:"(i) What is PKU (Phenylketonuria)? Name the enzyme deficient. (ii) What is pleiotropy? Give one example.",
   ans:"(i) PKU: inborn error of metabolism — mutation in gene for phenylalanine hydroxylase → enzyme absent → phenylalanine not converted to tyrosine → accumulates → converted to phenylpyruvic acid → mental retardation.\nDeficient enzyme: Phenylalanine hydroxylase.\n(ii) Pleiotropy: single gene affects multiple phenotypic traits. Example: same PKU gene affects skin pigmentation, IQ, and urine composition.",marks:3},
  {q:"Explain: (i) Addiction vs Dependence to drugs. (ii) Why does repeated drug use increase intake?",
   ans:"(i) Addiction: psychological attachment — craving for drug's effects (euphoria/well-being) even when not medically needed.\nDependence: physical need — body develops withdrawal symptoms (anxiety, nausea, shaking) when drug is stopped.\n(ii) Repeated use increases tolerance: body receptors adapt, requiring higher doses for same effect → escalating intake.",marks:3},
  {q:"Explain how pathogens are used as cloning vectors in recombinant DNA technology. Give one example each from bacteria and animals.",
   ans:"Bacteria: Agrobacterium tumefaciens naturally transfers T-DNA into plant cells. Scientists remove disease-causing genes from Ti plasmid but retain DNA-transfer ability → used as vector to deliver gene of interest into plants.\nAnimals: Retroviruses naturally integrate RNA (as DNA) into host genome. Engineered retroviruses with cancer-causing genes removed, keep integrating capacity → used for gene delivery in animal cells/gene therapy.",marks:3},
  {q:"(A) Explain interaction between ant and nematode with two fitness advantages for nematode. (B) Identify type of ecological interaction.",
   ans:"(A) Nematode lives in red-bellied ant's abdomen. Ant becomes red-bellied → preferentially eaten by birds. Bird spreads nematode spores through droppings.\nFitness advantages for nematode: (i) ant serves as vehicle to reach bird host → ensures nematode lifecycle completion; (ii) selective predation on red-bellied ants (not all ants) → nematode has exclusive dispersal mechanism.\n(B) Parasitism: nematode benefits (dispersal, lifecycle); ant is harmed (consumed by bird).",marks:3},
];
const SEC_D=[
  {q:"[CBQ] Female Hormonal Cycle\nA young woman has irregular menstrual cycles and no ovulation detected. Her LH surge is absent.\n(A) What blood-related complication may arise from heavy menstrual bleeding? [1m]\n(B) Explain why absent LH surge leads to irregular heavy periods. [2m]\n(C or D) Either: What does absent LH surge suggest about hormonal imbalance? [1m] OR: How would GnRH secretion be affected? [1m]",
   ans:"(A) Anaemia due to excessive blood loss.\n(B) Without LH surge: no ovulation → no corpus luteum → no progesterone secretion → endometrial lining grows excessively under unopposed oestrogen → sheds unpredictably and heavily → irregular periods.\n(C) Absent LH surge suggests lack of ovulation due to hormonal imbalance affecting ovarian function.\n(OR D) GnRH from hypothalamus controls pituitary; if disrupted, LH/FSH secretion from pituitary is reduced → LH surge absent.",marks:4},
  {q:"[CBQ] Biopesticides in Agriculture\nFarmer uses NPV (Nuclear Polyhedrosis Virus) for caterpillar control. Neighbour uses Bt spray.\n(A) Why is NPV preferred as narrow-spectrum insecticide? [1m]\n(B) How does Bt toxin work in larval gut? [2m]\n(C or D) Either: Name the virus used. [1m] OR: Why is Bt spray a biological pest control method? [1m]",

const SEC_E=[
  {q:"(A) Molecular biology of gene expression:\n(i) Define cistron. [0.5m]\n(ii) Identify type of mutation in each DNA sequence and state effect:\n   (a) 3'–TACAAAAAGAAGAAAAAGAAATT–5'\n   (b) 3'–TACAAAAAGAAGAAAAAGAATT–5' [2m]\n(iii) Explain post-transcriptional processing in eukaryotes. [2.5m]",
   ans:"(i) Cistron: segment of DNA that codes for one polypeptide (functional unit of DNA).\n(ii) (a) Point mutation (substitution) — single nucleotide changed; may alter one amino acid (missense) or create stop codon (nonsense).\n(b) Deletion/Frameshift mutation — one nucleotide deleted; changes reading frame of all downstream codons → drastically alters protein.\n(iii) Post-transcriptional processing: (1) 5' capping: 7-methylguanosine cap added → protects from degradation, aids ribosome binding. (2) 3' polyadenylation: poly-A tail added → stability, export. (3) Splicing: introns (non-coding) removed by spliceosomes; exons joined → mature mRNA.",
   orq:"(B) Hardy-Weinberg Principle:\n(i) State all five conditions for H-W equilibrium. [2.5m]\n(ii) In a population, 16% individuals show albinism (aa). Calculate allele frequencies p and q. [1.5m]\n(iii) Define genetic drift and give an example. [1m]",
   orans:"(i) H-W equilibrium conditions: (1) Large population size, (2) Random mating, (3) No mutations, (4) No gene flow (migration), (5) No natural selection.\n(ii) q² = 0.16 → q = 0.4 (frequency of a). p = 1−q = 0.6 (frequency of A). Carriers (Aa) = 2pq = 2×0.6×0.4 = 0.48 = 48%.\n(iii) Genetic drift: random change in allele frequencies in small populations due to chance events. Example: Founder effect — small group colonises new area; allele frequencies differ from original population.",marks:5},

   ans:"(i) Darwinian fitness: individual's reproductive success relative to others (number of surviving offspring). Inclusive fitness: includes indirect fitness through helping relatives who share genes (kin selection).\n(ii) Adaptive radiation: divergence of one ancestral species into many species occupying different ecological niches. Galapagos finches: common finch ancestor arrived → different islands/food sources → beak shapes evolved (insect-eating, seed-eating, cactus) → ~14 species.\n(iii) Reproductive isolation: inability of members of two populations to interbreed and produce fertile offspring. Role in speciation: prevents gene flow → populations diverge genetically → eventually become separate species.",
   orq:"(B) Biotechnology applications:\n(i) What is Bt cotton? Explain how it provides pest resistance. [2m]\n(ii) Distinguish between ex situ and in situ conservation with examples. [2m]\n(iii) Define biomagnification with a relevant example. [1m]",
   orans:"(i) Bt cotton: transgenic cotton with cry genes from Bacillus thuringiensis. Cry proteins (toxins) produced in plant cells. When bollworm larvae feed on cotton → toxin ingested → gut perforated → larva dies. Provides resistance to bollworm.\n(ii) Ex situ: conserving species outside natural habitat. E.g., botanical gardens, zoos, seed banks, cryo-preservation.\nIn situ: conserving species in their natural habitat. E.g., wildlife sanctuaries, national parks, biosphere reserves.\n(iii) Biomagnification: progressive increase in concentration of non-biodegradable substances at each trophic level. Example: DDT used in fields → enters water → plankton (0.003 ppm) → small fish (0.5 ppm) → large fish (2 ppm) → fish-eating birds (25 ppm).",marks:5},

   orq:"(B) Ecology and ecosystem services:\n(i) Explain the concept of keystone species with an example. [2m]\n(ii) Give four ecosystem services provided by healthy biodiversity. [2m]\n(iii) State the significance of the Convention on Biological Diversity (CBD). [1m]",
   orans:"(i) Keystone species: species that has a disproportionately large effect on ecosystem relative to its biomass. Example: Sea otter eats sea urchins; without otters, urchins overpopulate → destroy kelp forests → loss of entire ecosystem. Removing keystone species collapses ecosystem.\n(ii) Ecosystem services: (1) Oxygen production and CO₂ absorption. (2) Soil formation and water purification. (3) Pollination of crops. (4) Climate regulation and flood control. (5) Nutrient cycling.\n(iii) CBD (1992): international treaty to conserve biodiversity, ensure sustainable use, and ensure fair sharing of benefits from genetic resources with originating countries.",marks:5},

function pick(arr,offset,n){const o=[];for(let i=0;i<n;i++)o.push(arr[(offset+i)%arr.length]);return o;}
function buildPaper(n){const o=n*3;return{secA:pick(SEC_A,o%SEC_A.length,16),secB:pick(SEC_B,o%SEC_B.length,5),secC:pick(SEC_C,o%SEC_C.length,7),secD:pick(SEC_D,o%SEC_D.length,2),secE:pick(SEC_E,o%SEC_E.length,3)};}
function tog(btn,id){const b=document.getElementById(id);b.classList.toggle('show');btn.classList.toggle('open');btn.textContent=btn.classList.contains('open')?'Hide Answer':'Show Answer';}
function renderPaper(n){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===n));
  const p=buildPaper(n);const m=document.getElementById('main');
  let h=`<div class="pinfo"><span class="ptag">📄 Practice Paper ${n+1}</span><span class="ptag">🕐 3 Hours</span><span class="ptag">📊 70 Marks</span><span class="ptag">❓ 33 Questions</span></div>`;
  h+=`<div class="sec"><div class="sechdr"><span class="secname">Section A</span><span class="secdesc">Q1–16 · MCQ · 1 mark each</span></div><div class="qlist">`;
  p.secA.forEach((q,i)=>{const id=`p${n}a${i}`;h+=`<div class="qitem"><div class="qtext"><span class="qnum">${i+1}</span><span>${q.q}</span></div><div class="opts">${q.opts.map(o=>`<div class="opt">${o}</div>`).join('')}</div><div class="ans-wrap"><button class="ans-btn" onclick="tog(this,'${id}')">Show Answer</button><div class="ans-box" id="${id}"><strong>Answer: ${q.ans}</strong><br>${q.key}</div></div></div>`;});
  h+=`</div></div>`;
  h+=`<div class="sec"><div class="sechdr"><span class="secname">Section B</span><span class="secdesc">Q17–21 · Short Answer · 2 marks each</span></div><div class="qlist">`;
  p.secB.forEach((q,i)=>{const id=`p${n}b${i}`;h+=`<div class="qitem"><div class="qtext"><span class="qnum">${17+i}</span><span>${q.q}</span><span class="marks">[${q.marks}m]</span></div><div class="ans-wrap"><button class="ans-btn" onclick="tog(this,'${id}')">Show Answer</button><div class="ans-box" id="${id}">${q.ans.replace(/\n/g,'<br>')}</div></div></div>`;});
  h+=`</div></div>`;
  h+=`<div class="sec"><div class="sechdr"><span class="secname">Section C</span><span class="secdesc">Q22–28 · Short Answer · 3 marks each</span></div><div class="qlist">`;
  p.secC.forEach((q,i)=>{const id=`p${n}c${i}`;h+=`<div class="qitem"><div class="qtext"><span class="qnum">${22+i}</span><span>${q.q}</span><span class="marks">[${q.marks}m]</span></div><div class="ans-wrap"><button class="ans-btn" onclick="tog(this,'${id}')">Show Answer</button><div class="ans-box" id="${id}">${q.ans.replace(/\n/g,'<br>')}</div></div></div>`;});
  h+=`</div></div>`;
  h+=`<div class="sec"><div class="sechdr"><span class="secname">Section D</span><span class="secdesc">Q29–30 · Case-Based · 4 marks each</span></div><div class="qlist">`;
  p.secD.forEach((q,i)=>{const id=`p${n}d${i}`;h+=`<div class="qitem"><div class="qtext"><span class="qnum">${29+i}</span><span style="white-space:pre-line">${q.q}</span><span class="marks">[${q.marks}m]</span></div><div class="ans-wrap"><button class="ans-btn" onclick="tog(this,'${id}')">Show Answer</button><div class="ans-box" id="${id}">${q.ans.replace(/\n/g,'<br>')}</div></div></div>`;});
  h+=`</div></div>`;
  h+=`<div class="sec"><div class="sechdr"><span class="secname">Section E</span><span class="secdesc">Q31–33 · Long Answer · 5 marks each (with OR)</span></div><div class="qlist">`;
  p.secE.forEach((q,i)=>{const id=`p${n}e${i}`;const orid=`p${n}eo${i}`;h+=`<div class="qitem"><div class="qtext"><span class="qnum">${31+i}</span><span style="white-space:pre-line">${q.q}</span><span class="marks">[${q.marks}m]</span></div><div class="ans-wrap"><button class="ans-btn" onclick="tog(this,'${id}')">Show Answer</button><div class="ans-box" id="${id}">${q.ans.replace(/\n/g,'<br>')}</div></div><div class="or-div">— OR —</div><div style="padding-left:32px;font-size:.88rem;white-space:pre-line;margin-top:6px">${q.orq}</div><div class="ans-wrap"><button class="ans-btn" onclick="tog(this,'${orid}')">Show OR Answer</button><div class="ans-box" id="${orid}">${q.orans.replace(/\n/g,'<br>')}</div></div></div>`;});
  h+=`</div></div>`;
  m.innerHTML=h;window.scrollTo({top:0,behavior:'smooth'});
}
