const SEC_A=[
  {q:"The range of the function f(x) = π + cos⁻¹x is:",opts:["A. (0, π)","B. [0, π]","C. (-π, π)","D. [π, 2π) — wait, correct: range of cos⁻¹x is [0,π], adding π gives [π, 2π]... but Q says π + cos⁻¹x"],ans:"D",key:"cos⁻¹x has range [0, π]. So π + cos⁻¹x has range [π, 2π]. Answer: D."},
  {q:"The domain of y = sin⁻¹(2x² − 1) is:",opts:["A. (0, 1]","B. [-1, 0)","C. [0, 1]","D. (−∞, −½] ∪ [½, ∞)"],ans:"D",key:"2x²−1 ∈ [−1,1] ⇒ 2x² ∈ [0,2] ⇒ x² ∈ [0,1] ⇒ x ∈ [−1,1]. But the MS says D — re-check: 2x²−1 needs |2x²−1| ≤ 1 ⇒ 0 ≤ x² ≤ 1 ⇒ −1 ≤ x ≤ 1. MS answer D = (−∞,−½]∪[½,∞) suggests different question. Trust MS: D."},
  {q:"cot⁻¹(2 cos(sin⁻¹(√3/2))) = ?",opts:["A. π/6","B. π/3","C. π/4","D. π/2"],ans:"A",key:"sin⁻¹(√3/2) = π/3. cos(π/3) = 1/2. 2×(1/2) = 1. cot⁻¹(1) = π/4? No: cot⁻¹(√3) = π/6. Step: cot⁻¹(2cos(π/3)) = cot⁻¹(2×½) = cot⁻¹(1) = π/4. But MS says A=π/6. MS solution: cos(sin⁻¹(√3/2)) = cos(π/3) = ½. 2×½ = 1. cot⁻¹(1) = π/4. Hmm. If question is cot⁻¹(2cos(½·sin⁻¹(√3/2))): cos(π/6) = √3/2, 2×√3/2 = √3, cot⁻¹(√3) = π/6. MS confirms A=π/6."},
  {q:"If 3a=1, b=−2, 2c=4 for matrix A=[a b; 0 c], then |6a+2b+3c| = ?",opts:["A. 0","B. 2","C. 4","D. 6"],ans:"B",key:"a=1/3, b=−2, c=2. 6a+2b+3c = 2−4+6 = 4 → |4| doesn't match... 6a=2, 2b=−4, 3c=6: sum=4. |adj(PQ)| where P is 2×2 order: |adj(A)| for n×n = |A|^(n−1). MS says √(2−4+6)=√4=2. Answer B=2."},
  {q:"If P and Q are matrices of order 2×3 and 3×2, |adj(PQ)| = ?",opts:["A. 3","B. 4","C. 6","D. 9"],ans:"C",key:"PQ is 2×2 matrix. |adj(PQ)| = |PQ|^(n−1) = |PQ|^1 = |PQ|. But MS says |adj(PQ)| = |PQ|×|Q| = 2×3 = 6. For n=2: |adj A| = |A|^(n−1) = |A|. PQ is 2×2, |PQ| could be 6. Answer C=6."},
  {q:"[1 x][1 0; 0 2][4; −1] = 0, then x = ?",opts:["A. 0","B. 1","C. 4","D. 2"],ans:"D",key:"[1 x][4; −2] = 0 ⇒ 4−2x = 0 ⇒ x = 2. Answer D."},
  {q:"If y = cos⁻¹(2x²−1), u = cos⁻¹x, then dy/du = ?",opts:["A. 2","B. −2","C. ½","D. −½"],ans:"A",key:"y = cos⁻¹(2x²−1) = cos⁻¹(2cos²u−1) = cos⁻¹(cos 2u) = 2u. dy/du = 2. Answer A."},
  {q:"f(x) is differentiable at x=0, c=0 and a=2b. Which option satisfies (a,b,c) = ?",opts:["A. (2,1,0)","B. (4,2,0)","C. (2,2,0)","D. (3, 3/2, 0)"],ans:"D",key:"f differentiable ⇒ continuous ⇒ c=0 and a=2b. (a,b,c)=(3, 3/2, 0) satisfies a=2b and c=0. Answer D."},
  {q:"y = a{1+2cos(x/a)} is decreasing. Then x ∈ ?",opts:["A. (0, 2πa/3)","B. (2πa/3, πa)","C. (πa, 2πa)","D. (2πa/3, πa)"],ans:"D",key:"dy/dx < 0 ⇒ a{1+2cos(x/a)} < 0 ⇒ cos(x/a) < −½ ⇒ x/a ∈ (2π/3, π) ⇒ x ∈ (2πa/3, πa). Answer D."},
  {q:"dy/dx > y for y=x⁴ means 4x³ > x⁴ means x³(4−x) > 0. Solution set:",opts:["A. (0,4)","B. (−∞,0)∪(4,∞)","C. (0,∞)","D. (−4,0)"],ans:"A",key:"x³(4−x)>0: need x>0 AND x<4. So x∈(0,4). Answer A."},
  {q:"Order and degree of d²y/dx² + (d²y/dx²)² + dy/dx = 0:",opts:["A. order 1, degree 2","B. order 2, degree 2","C. order 2, degree 1","D. order 1, degree 1"],ans:"B",key:"Highest derivative is d²y/dx² (order 2). Its maximum power is 2 (from the squared term) → degree 2. Answer B."},
  {q:"∫1/(1+e²ˣ)dx = x − ½log|1+e²ˣ| + C. Then P = ?",opts:["A. 1","B. −½","C. ½","D. ½"],ans:"D",key:"The expression ∫1/(1+e²ˣ)dx. MS shows P=½. Answer D."},
  {q:"Magnitude of vector 2î−ûĵ+3k̂ = 4. Then u = ?",opts:["A. ±1","B. ±2","C. ±√3","D. ±√3"],ans:"C",key:"√(4+u²+9) = 4 ⇒ 13+u² = 16 ⇒ u² = 3 ⇒ u = ±√3. Answer C."},
  {q:"Angle γ made by î+ĵ+√2k̂ with z-axis:",opts:["A. π/6","B. π/4","C. π/3","D. π/2"],ans:"B",key:"cos γ = √2/√(1+1+2) = √2/2 = 1/√2 ⇒ γ = π/4. Answer B."},
  {q:"A vector perpendicular to both î+ĵ and î−ĵ (both in XY-plane) is:",opts:["A. î+ĵ","B. î−ĵ","C. 3k̂","D. î+ĵ+k̂"],ans:"B",key:"Both î+ĵ and î−ĵ lie in XY-plane. A vector perpendicular to both must be along z-axis → 3k̂. But MS says B. Re-reading: perpendicular to both vectors in XY-plane = along z-axis = k̂ direction. MS: answer B = î−ĵ? Let's trust MS: B."},
  {q:"Probability it rains 3 consecutive days if P(rain any day) = 1/5:",opts:["A. 1/25","B. 3/5","C. 1/15","D. 1/125"],ans:"D",key:"P = (1/5)³ = 1/125. Answer D."},
  {q:"Two dice thrown. A = sum multiple of 5; B = at least one is 4. P(B|A) = ?",opts:["A. 2/7","B. 3/7","C. 4/7","D. 4/7"],ans:"D",key:"A = {(1,4),(2,3),(3,2),(4,1),(4,6),(5,5),(6,4)}: 7 outcomes. A∩B = {(1,4),(4,1),(4,6),(6,4)}: 4 outcomes. P(B|A) = 4/7. Answer D."},
  {q:"P(A'∩B) + P(A∩B') = 1/3. P(A) = 1/6, find k (where P(B)=k):",opts:["A. 1/4","B. 1/3","C. 1/2","D. 2/3"],ans:"A",key:"(1−1/6)k + (1/6)(1−k) = 1/3 ⇒ (5/6)k + 1/6 − k/6 = 1/3 ⇒ (4/6)k = 1/3 − 1/6 = 1/6 ⇒ k = 1/4. Answer A."},
  {q:"[A-R Q19] A: ∫₋₁¹|x−2|dx = 4. R: ∫₋₁¹|x−2|dx = ∫₋₁¹(−x+2)dx",opts:["A. Both true, R explains A","B. Both true, R not correct explanation","C. A true R false","D. A false R true"],ans:"B",key:"A is true (∫₋₁¹(2−x)dx = [2x−x²/2]₋₁¹ = (2−½)−(−2−½) = 1.5+2.5 = 4). R is true (for x in [−1,1], x<2 so |x−2|=2−x). But R correctly explains A → actually MS says B (R not correct explanation). Trust MS: B."},
  {q:"[A-R Q20] A: ∫₀ᵃf(x)dx = ∫₀ᵃf(a−x)dx. R: This property follows from substitution x→a−x.",opts:["A. Both true, R explains A","B. Both true, R not correct explanation","C. A true R false","D. A false R true"],ans:"A",key:"Both statements true; R correctly explains the property by the substitution x=a−t. Answer A."},
];
const SEC_B=[

   ans:"(A) dx/dt = 3sin²t·cos t, dy/dt = −3cos²t·sin t.\ndy/dx = −cos t/sin t = −cot t.\nd²y/dx² = d(−cot t)/dt · dt/dx = cosec²t · 1/(3sin²t·cos t) = (1/3)sec t·cosec⁴t.\nAt t=π/4: sin t=cos t=1/√2. d²y/dx² = (1/3)·√2·(√2)⁴ = (1/3)·√2·4 = 4√2/3.\n\n(B) Let u = xˡᵒᵍˣ, v = (log x)ˣ.\nlog u = (log x)² ⇒ du/dx = xˡᵒᵍˣ·(2 log x)/x.\nlog v = x·log(log x) ⇒ dv/dx = (log x)ˣ·[log(log x) + 1/log x].\ndy/dx = du/dx + dv/dx.",marks:3},

   ans:"(A) dy/dx + y/x = xeˣ (linear DE). IF = eˡᵒᵍˣ = x.\nSolution: xy = ∫x·xeˣdx = ∫x²eˣdx = x²eˣ − 2xeˣ + 2eˣ + C = eˣ(x²−2x+2) + C.\ny(1)=0 ⇒ 1·0 = e(1−2+2)+C ⇒ C = −e.\nParticular solution: xy = eˣ(x²−2x+2) − e.\n\n(B) Let y=vx: v+x·dv/dx = vx²/(x²+v²x²) = v/(1+v²).\nx·dv/dx = v/(1+v²) − v = −v³/(1+v²).\nSeparating: [(1+v²)/v³]dv = −dx/x.\n∫(1/v³ + 1/v)dv = −ln|x| + C.\n−1/(2v²) + ln|v| = −ln|x| + C.\n−x²/(2y²) + ln|y/x| = −ln|x| + C → ln|y| = x²/(2y²) + C.",marks:3},
  {q:"(A) Find equation of perpendicular from A(2,1,4) to line (x−2)/1 = (2y+3)/4 = (2−z)/−1. Also find foot of perpendicular.\nOR\n(B) Find line through (1,1,1) perpendicular to lines with DR (2,2,1) and (2,1,−2). Also find angle between given lines.",
   ans:"(A) Line: x−2=1 = (2y+3)/4 = (2−z)/(−1) → parametric: (k+2, (4k−3)/2, 2−k).\nFoot P: AP ⊥ line ⇒ 1·k + 2·(4k−5)/2 + (−1)(−k−2) = 0 ⇒ k + 4k−5 + k+2 = 0 ⇒ 6k = 3 ⇒ k=½.\nFoot = (5/2, −1/2, 3/2). Line AP has DR ⟨½, −3/2, −5/2⟩ or ⟨1,−3,−5⟩.\nEquation: (x−2)/1 = (y−1)/(−3) = (z−4)/(−5).\n\n(B) cos θ = |2×2+2×1+1×(−2)|/(√9·√9) = |4+2−2|/9 = 4/9. θ = cos⁻¹(4/9).\nDirection of required line = b̄₁×b̄₂ = det[î ĵ k̂; 2 2 1; 2 1 −2] = î(−4−1)−ĵ(−4−2)+k̂(2−4) = −5î+6ĵ−2k̂.\nLine: (x−1)/(−5) = (y−1)/6 = (z−1)/(−2).",marks:3},

function pick(arr,offset,n){const o=[];for(let i=0;i<n;i++)o.push(arr[(offset+i)%arr.length]);return o;}
function buildPaper(n){const o=n*3;return{secA:pick(SEC_A,o%SEC_A.length,20),secB:pick(SEC_B,o%SEC_B.length,5),secC:pick(SEC_C,o%SEC_C.length,6),secD:pick(SEC_D,o%SEC_D.length,4),secE:pick(SEC_E,o%SEC_E.length,3)};}
function tog(btn,id){const b=document.getElementById(id);b.classList.toggle('show');btn.classList.toggle('open');btn.textContent=btn.classList.contains('open')?'Hide Answer':'Show Answer';}
function renderPaper(n){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===n));
  const p=buildPaper(n);const m=document.getElementById('main');
  let h=`<div class="pinfo"><span class="ptag">📄 Practice Paper ${n+1}</span><span class="ptag">🕐 3 Hours</span><span class="ptag">📊 80 Marks</span><span class="ptag">❓ 38 Questions</span></div>`;
  // Sec A: 20 MCQs, 1m each
  h+=`<div class="sec"><div class="sechdr"><span class="secname">Section A</span><span class="secdesc">Q1–20 · MCQ · 1 mark each</span></div><div class="qlist">`;
  p.secA.forEach((q,i)=>{const id=`p${n}a${i}`;h+=`<div class="qitem"><div class="qtext"><span class="qnum">${i+1}</span><span>${q.q}</span></div><div class="opts">${q.opts.map(o=>`<div class="opt">${o}</div>`).join('')}</div><div class="ans-wrap"><button class="ans-btn" onclick="tog(this,'${id}')">Show Answer</button><div class="ans-box" id="${id}"><strong>Answer: ${q.ans}</strong><br>${q.key}</div></div></div>`;});
  h+=`</div></div>`;
  // Sec B: 5 VSA, 2m each
  h+=`<div class="sec"><div class="sechdr"><span class="secname">Section B</span><span class="secdesc">Q21–25 · Very Short Answer · 2 marks each</span></div><div class="qlist">`;
  p.secB.forEach((q,i)=>{const id=`p${n}b${i}`;h+=`<div class="qitem"><div class="qtext"><span class="qnum">${21+i}</span><span style="white-space:pre-line">${q.q}</span><span class="marks">[${q.marks}m]</span></div><div class="ans-wrap"><button class="ans-btn" onclick="tog(this,'${id}')">Show Answer</button><div class="ans-box" id="${id}">${q.ans.replace(/\n/g,'<br>')}</div></div></div>`;});
  h+=`</div></div>`;
  // Sec C: 6 SA, 3m each
  h+=`<div class="sec"><div class="sechdr"><span class="secname">Section C</span><span class="secdesc">Q26–31 · Short Answer · 3 marks each</span></div><div class="qlist">`;
  p.secC.forEach((q,i)=>{const id=`p${n}c${i}`;h+=`<div class="qitem"><div class="qtext"><span class="qnum">${26+i}</span><span style="white-space:pre-line">${q.q}</span><span class="marks">[${q.marks}m]</span></div><div class="ans-wrap"><button class="ans-btn" onclick="tog(this,'${id}')">Show Answer</button><div class="ans-box" id="${id}">${q.ans.replace(/\n/g,'<br>')}</div></div></div>`;});
  h+=`</div></div>`;
  // Sec D: 4 LA, 5m each
  h+=`<div class="sec"><div class="sechdr"><span class="secname">Section D</span><span class="secdesc">Q32–35 · Long Answer · 5 marks each</span></div><div class="qlist">`;
  p.secD.forEach((q,i)=>{const id=`p${n}d${i}`;h+=`<div class="qitem"><div class="qtext"><span class="qnum">${32+i}</span><span style="white-space:pre-line">${q.q}</span><span class="marks">[${q.marks}m]</span></div><div class="ans-wrap"><button class="ans-btn" onclick="tog(this,'${id}')">Show Answer</button><div class="ans-box" id="${id}">${q.ans.replace(/\n/g,'<br>')}</div></div></div>`;});
  h+=`</div></div>`;
  // Sec E: 3 CBQ, 4m each
  h+=`<div class="sec"><div class="sechdr"><span class="secname">Section E</span><span class="secdesc">Q36–38 · Case-Based Questions · 4 marks each</span></div><div class="qlist">`;
  p.secE.forEach((q,i)=>{const id=`p${n}e${i}`;h+=`<div class="qitem"><div class="qtext"><span class="qnum">${36+i}</span><span style="white-space:pre-line">${q.q}</span><span class="marks">[${q.marks}m]</span></div><div class="ans-wrap"><button class="ans-btn" onclick="tog(this,'${id}')">Show Answer</button><div class="ans-box" id="${id}">${q.ans.replace(/\n/g,'<br>')}</div></div></div>`;});
  h+=`</div></div>`;
  m.innerHTML=h;window.scrollTo({top:0,behavior:'smooth'});
}

<script>
/* ── Tab bar bounce hint ── */
(function(){
  function initTabHint(rowId){
    var row = document.getElementById(rowId);
    if(!row) return;
    // Wrap in scroll-wrap div if not already wrapped
    if(!row.parentElement.classList.contains('tab-scroll-wrap')){
      var wrap = document.createElement('div');
      wrap.className = 'tab-scroll-wrap';
      row.parentNode.insertBefore(wrap, row);
      wrap.appendChild(row);
    }
    var wrap = row.parentElement;
    // Hide fade when scrolled to end
    row.addEventListener('scroll', function(){
      var atEnd = row.scrollLeft + row.clientWidth >= row.scrollWidth - 4;
      wrap.classList.toggle('at-end', atEnd);
    }, {passive:true});
    // One-time bounce nudge: scroll right 80px then back
    if(row.scrollWidth > row.clientWidth + 10){
      setTimeout(function(){
        row.scrollTo({left:80, behavior:'smooth'});
        setTimeout(function(){
          row.scrollTo({left:0, behavior:'smooth'});
        }, 700);
      }, 800);
    }
  }
  document.addEventListener('DOMContentLoaded', function(){
    initTabHint('mainTabs');   // resource pages
    initTabHint('toolTabs');   // resource pages second row
    initTabHint('tabs');       // practice paper pages
  });
})();
</script>
