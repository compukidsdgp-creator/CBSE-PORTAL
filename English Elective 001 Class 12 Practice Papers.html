function pick(arr,offset,n){const o=[];for(let i=0;i<n;i++)o.push(arr[(offset+i)%arr.length]);return o;}

function buildPaper(n){
  const o=n*2;
  return{
    prose:PROSE_PASSAGES[o%PROSE_PASSAGES.length],
    poem:POEM_PASSAGES[o%POEM_PASSAGES.length],
    caseb:CASE_PASSAGES[o%CASE_PASSAGES.length],
    gram:GRAMMAR_QS[o%GRAMMAR_QS.length],
    essays:ESSAYS[o%ESSAYS.length],
    report:REPORTS[o%REPORTS.length],
    proseX:PROSE_EXTRACT[o%PROSE_EXTRACT.length],
    poemX:POEM_EXTRACT[o%POEM_EXTRACT.length],
    shorts:SHORT_ANS[o%SHORT_ANS.length],
    longs:LONG_ANS[o%LONG_ANS.length],
  };
}

function tog(btn,id){
  const b=document.getElementById(id);
  b.classList.toggle('show');
  btn.classList.toggle('open');
  btn.textContent=btn.classList.contains('open')?'Hide Answer':'Show Answer';
}

function ansBtn(id){return `<button class="ans-btn" onclick="tog(this,'${id}')">Show Answer</button>`;}

function renderPaper(p,idx){
  let h=`<div class="paper-header">
    <h2>Practice Paper ${idx+1}</h2>
    <div class="paper-meta">
      <span class="meta-tag">Code 001</span>
      <span class="meta-tag">80 Marks</span>
      <span class="meta-tag">3 Hours</span>
      <span class="meta-tag">All questions compulsory</span>
    </div>
  </div>`;

  const id=(q,s)=>`p${idx}-${s}-${q}`;

  // SECTION A — Reading
  h+=`<div class="section"><div class="section-title">SECTION A — Reading (20 Marks)</div>`;
  h+=`<div class="instr">Q1 is based on an unseen prose passage. Q2 on a poem. Q3 is case-based.</div>`;

  // Q1 prose
  h+=`<div class="question"><div class="q-header"><span class="q-num">Q1</span><span class="q-marks">12 × 1 = 12 M</span></div>
    <div class="q-text">Read the following passage and answer the questions:<br><br><em>${p.prose.title}</em><br>${p.prose.text}</div>`;
  p.prose.qs.forEach((q,i)=>{
    const qid=id(i,'q1');
    h+=`<div style="margin-top:.6rem"><div class="q-header"><span class="q-num">1.${i+1}</span></div>
    <div class="q-text">${q.q}</div>
    <div class="options">${q.opts.map(o=>`<div class="opt">${o}</div>`).join('')}</div>
    ${ansBtn(qid)}<div class="answer" id="${qid}"><p><strong>Answer: ${q.ans}</strong></p></div></div>`;
  });
  h+=`</div>`;

  // Q2 poem
  h+=`<div class="question"><div class="q-header"><span class="q-num">Q2</span><span class="q-marks">4 × 1 = 4 M</span></div>
    <div class="q-text">Read the following lines from the poem <em>'${p.poem.title}'</em> by ${p.poem.author}:<br><br><em>"${p.poem.lines}"</em></div>`;
  p.poem.qs.forEach((q,i)=>{
    const qid=id(i,'q2');
    h+=`<div style="margin-top:.6rem"><div class="q-header"><span class="q-num">2.${i+1}</span></div>
    <div class="q-text">${q.q}</div>
    <div class="options">${q.opts.map(o=>`<div class="opt">${o}</div>`).join('')}</div>
    ${ansBtn(qid)}<div class="answer" id="${qid}"><p><strong>Answer: ${q.ans}</strong></p></div></div>`;
  });
  h+=`</div>`;

  // Q3 case-based
  h+=`<div class="question"><div class="q-header"><span class="q-num">Q3</span><span class="q-marks">4 × 1 = 4 M</span></div>
    <div class="q-text">Read the following passage carefully:<br><br><strong>${p.caseb.title}</strong><br>${p.caseb.text}</div>`;
  p.caseb.qs.forEach((q,i)=>{
    const qid=id(i,'q3');
    h+=`<div style="margin-top:.6rem"><div class="q-header"><span class="q-num">3.${i+1}</span></div>
    <div class="q-text">${q.q}</div>
    <div class="options">${q.opts.map(o=>`<div class="opt">${o}</div>`).join('')}</div>
    ${ansBtn(qid)}<div class="answer" id="${qid}"><p><strong>Answer: ${q.ans}</strong></p></div></div>`;
  });
  h+=`</div></div>`;

  // SECTION B — Grammar & Writing
  h+=`<div class="section"><div class="section-title">SECTION B — Applied Grammar & Writing (28 Marks)</div>`;

  // Q4 sentence transformation
  h+=`<div class="question"><div class="q-header"><span class="q-num">Q4</span><span class="q-marks">8 × 1 = 8 M</span></div>
    <div class="q-text">${p.gram.instr}</div>`;
  p.gram.items.forEach((item,i)=>{
    const qid=id(i,'q4');
    h+=`<div style="margin-top:.6rem"><div class="q-header"><span class="q-num">4.${i+1}</span></div>
    <div class="q-text">${item.q}</div>
    ${ansBtn(qid)}<div class="answer" id="${qid}"><p><strong>${item.ans}</strong></p></div></div>`;
  });
  h+=`</div>`;

  // Q5 essays
  const essid=id(0,'q5');
  h+=`<div class="question"><div class="q-header"><span class="q-num">Q5</span><span class="q-marks">3 × 5 = 15 M</span></div>
    <div class="q-text">Write essays (350–400 words each) on any THREE of the following topics:</div>
    <ul class="options">${p.essays.map((e,i)=>`<li class="opt">5.${i+1} ${e}</li>`).join('')}</ul>
    ${ansBtn(essid)}<div class="answer" id="${essid}"><p><strong>Answer key (marking hints):</strong></p>
    <ul><li>Content & relevance: 2 marks</li><li>Organisation & coherence: 1 mark</li><li>Language accuracy: 1 mark</li><li>Vocabulary & expression: 1 mark</li></ul>
    <p>Each essay should have introduction, 3-4 body paragraphs and conclusion. Use facts, examples and personal opinion.</p></div></div>`;

  // Q6 report/article
  const repid=id(0,'q6');
  h+=`<div class="question"><div class="q-header"><span class="q-num">Q6</span><span class="q-marks">1 × 5 = 5 M</span></div>
    <div class="q-text"><strong>${p.report.type}:</strong> ${p.report.topic}</div>
    ${ansBtn(repid)}<div class="answer" id="${repid}"><p><strong>Format Guide (${p.report.type}):</strong></p>
    ${p.report.type==='Report'?'<ul><li><strong>Heading:</strong> Report on [Event] — 0.5m</li><li><strong>By-line:</strong> Submitted by — 0.5m</li><li><strong>Date & Venue</strong> — 0.5m</li><li><strong>Body:</strong> Introduction, highlights, observations, conclusion — 3m</li><li><strong>Language:</strong> Third person, past tense — 0.5m</li></ul>':'<ul><li><strong>Heading:</strong> Catchy, relevant — 0.5m</li><li><strong>By-line</strong> — 0.5m</li><li><strong>Body:</strong> Hook, development (3 paras), conclusion — 3m</li><li><strong>Language:</strong> Engaging, formal — 1m</li></ul>'}
    </div></div></div>`;

  // SECTION C — Literature
  h+=`<div class="section"><div class="section-title">SECTION C — Literature & Fiction (32 Marks)</div>`;

  // Q7(i) prose extract
  h+=`<div class="question"><div class="q-header"><span class="q-num">Q7(i)</span><span class="q-marks">6 M</span></div>
    <div class="q-text">Read the following extract from <em>'${p.proseX.from}'</em>:<br><br><em>"${p.proseX.lines}"</em></div>`;
  p.proseX.qs.forEach((q,i)=>{
    const qid=id(i,'q7i');
    h+=`<div style="margin-top:.6rem"><div class="q-header"><span class="q-num">a${i+1}</span><span class="q-marks">${q.marks}M</span></div>
    <div class="q-text">${q.q}</div>
    ${ansBtn(qid)}<div class="answer" id="${qid}"><p><strong>${q.ans}</strong></p></div></div>`;
  });
  h+=`</div>`;

  // Q7(ii) poem extract
  h+=`<div class="question"><div class="q-header"><span class="q-num">Q7(ii)</span><span class="q-marks">6 M</span></div>
    <div class="q-text">Read the following lines from <em>'${p.poemX.from}'</em> by ${p.poemX.author}:<br><br><em>"${p.poemX.lines}"</em></div>`;
  p.poemX.qs.forEach((q,i)=>{
    const qid=id(i,'q7ii');
    h+=`<div style="margin-top:.6rem"><div class="q-header"><span class="q-num">b${i+1}</span><span class="q-marks">${q.marks}M</span></div>
    <div class="q-text">${q.q}</div>
    ${ansBtn(qid)}<div class="answer" id="${qid}"><p><strong>${q.ans}</strong></p></div></div>`;
  });
  h+=`</div>`;

  // Q8-13 short/long
  let qNum=8;
  p.shorts.forEach(q=>{
      const qid=id(qNum,'short');
      h+=`<div class="question"><div class="q-header"><span class="q-num">Q${qNum}</span><span class="q-marks">${q.marks}M</span></div>
        <div class="q-text">${q.q}</div>
        ${ansBtn(qid)}<div class="answer" id="${qid}"><p>${q.ans}</p></div></div>`;
      qNum++;
  });

  p.longs.forEach(q=>{
      const qid=id(qNum,'long');
      h+=`<div class="question"><div class="q-header"><span class="q-num">Q${qNum}</span><span class="q-marks">${q.marks}M</span></div>
        <div class="q-text">${q.q}</div>
        ${ansBtn(qid)}<div class="answer" id="${qid}"><p>${q.ans}</p></div></div>`;
      qNum++;
  });

  h+=`</div>`;
  return h;
}

const N=15;
const tabsEl=document.getElementById('tabs');
const papersEl=document.getElementById('papers');
for(let i=0;i<N;i++){
  const t=document.createElement('button');
  t.className='tab'+(i===0?' active':'');
  t.textContent=`Paper ${i+1}`;
  t.onclick=(()=>{const n=i;return()=>show(n);})();
  tabsEl.appendChild(t);

  const d=document.createElement('div');
  d.className='paper'+(i===0?' active':'');
  d.id=`paper-${i}`;
  d.innerHTML=renderPaper(buildPaper(i),i);
  papersEl.appendChild(d);
}

function show(n){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===n));
  document.querySelectorAll('.paper').forEach((p,i)=>p.classList.toggle('active',i===n));
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ── Tab bar bounce hint ── */
(function(){
  function initTabHint(rowId){
    var row = document.getElementById(rowId);
    if(!row) return;
    // Wrap in scroll-wrap div if not already wrapped
    if(!row.parentElement.classList.contains('tab-scroll-wrap')){
      var wrap = document.createElement('div');
      wrap.className = 'tab-scroll-wrap';
      row.parentNode.insertBefore(wrap, row);
      wrap.appendChild(row);
    }
    var wrap = row.parentElement;
    // Hide fade when scrolled to end
    row.addEventListener('scroll', function(){
      var atEnd = row.scrollLeft + row.clientWidth >= row.scrollWidth - 4;
      wrap.classList.toggle('at-end', atEnd);
    }, {passive:true});
    // One-time bounce nudge: scroll right 80px then back
    if(row.scrollWidth > row.clientWidth + 10){
      setTimeout(function(){
        row.scrollTo({left:row.scrollWidth, behavior:'smooth'});
        setTimeout(function(){
          row.scrollTo({left:0, behavior:'smooth'});
        }, 1800);
      }, 800);
    }
  }
  document.addEventListener('DOMContentLoaded', function(){
    initTabHint('mainTabs');   // resource pages
    initTabHint('toolTabs');   // resource pages second row
    initTabHint('tabs');       // practice paper pages
  });
})();
</script>
