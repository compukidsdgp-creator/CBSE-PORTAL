<script>
const passages=[
  {title:"Reading Passage 1: The Power of Reading",text:`In an age of digital distractions, the habit of reading books is becoming increasingly rare, especially among young people. Yet reading remains one of the most powerful activities a human being can engage in. When we read, we do not merely receive information — we exercise the imagination, develop empathy, and strengthen the mind. A reader who encounters a character facing hardship learns, in a safe way, how to deal with adversity. A reader who explores different cultures and time periods through fiction develops a more nuanced understanding of the world. Moreover, reading improves vocabulary, concentration, and the ability to think critically. Studies have shown that students who read regularly perform better not only in language examinations but across all subjects. In a world where information is abundant but wisdom is scarce, books remain our most reliable guides.`,
   mcq:[
     {q:"According to the passage, what happens when we read?",opts:["A. We only receive information","B. We exercise imagination and develop empathy","C. We become distracted","D. We only improve vocabulary"],ans:"B. We exercise imagination and develop empathy — the passage says we 'do not merely receive information' but exercise imagination and develop empathy."},
     {q:"The phrase 'nuanced understanding' means:",opts:["A. Simple knowledge","B. Biased opinion","C. Subtle, detailed awareness","D. Confused thinking"],ans:"C. Subtle, detailed awareness — 'nuanced' means having many fine distinctions; a nuanced understanding is sophisticated and detailed."},
     {q:"Students who read regularly perform better:",opts:["A. Only in language exams","B. Only in science","C. Across all subjects","D. Only in creative writing"],ans:"C. Across all subjects — the passage states 'not only in language examinations but across all subjects.'"},
     {q:"What does the author contrast 'information' with at the end?",opts:["A. Books","B. Wisdom","C. Fiction","D. Vocabulary"],ans:"B. Wisdom — 'information is abundant but wisdom is scarce' — the author contrasts information with wisdom."},
   ],shortQ:"Give two benefits of reading mentioned in the passage.",shortA:"1. Reading improves vocabulary, concentration, and critical thinking ability.\n2. Reading develops empathy and a nuanced understanding of the world by exposing readers to different characters and cultures."},
  {title:"Reading Passage 2: Ocean Plastic Crisis",text:`Every minute, the equivalent of a truckload of plastic enters the world's oceans. This staggering statistic underscores a crisis that threatens marine ecosystems across the globe. Plastic does not biodegrade — instead, it breaks into tiny fragments called microplastics, which are now found in the deepest ocean trenches, in Arctic ice, and even in human blood. Marine animals mistake plastic debris for food. Sea turtles consume plastic bags thinking they are jellyfish. Seabirds feed plastic pieces to their chicks. The consequences ripple through entire food chains. What is particularly alarming is that once plastic enters the ocean, it is nearly impossible to remove it all. Prevention, therefore, is the only realistic solution. Governments must enforce strict regulations on single-use plastics. Industries must invest in sustainable alternatives. And individuals must rethink their everyday choices — every refusal of a plastic straw or bag is a small but meaningful act of ocean conservation.`,
   mcq:[
     {q:"What does 'biodegrade' mean in the context of the passage?",opts:["A. Float on water","B. Break down naturally over time","C. Turn into microplastics","D. Sink to the ocean floor"],ans:"B. Break down naturally over time — 'biodegrade' means to decompose naturally through bacteria/organisms. The passage says plastic does NOT biodegrade."},
     {q:"Why do sea turtles eat plastic bags?",opts:["A. They like the taste","B. They mistake them for jellyfish","C. They need plastic for nutrition","D. They are curious animals"],ans:"B. They mistake them for jellyfish — the passage explicitly states turtles consume plastic bags 'thinking they are jellyfish.'"},
     {q:"What does the author suggest is the 'only realistic solution'?",opts:["A. Cleaning the oceans","B. Using more plastic","C. Prevention","D. Building filters"],ans:"C. Prevention — the passage states 'once plastic enters the ocean, it is nearly impossible to remove it all. Prevention, therefore, is the only realistic solution.'"},
     {q:"The word 'staggering' as used in the passage means:",opts:["A. Small","B. Shocking and overwhelming","C. Steady","D. Declining"],ans:"B. Shocking and overwhelming — 'staggering statistic' means a figure so large or surprising that it shocks you."},
   ],shortQ:"What solutions does the author propose to address the ocean plastic crisis? Mention any two.",shortA:"1. Governments must enforce strict regulations on single-use plastics.\n2. Individuals must rethink everyday choices — refusing plastic straws, bags, etc., as small acts of ocean conservation.\n(Also: Industries investing in sustainable alternatives.)"},
  {title:"Reading Passage 3: Artificial Intelligence in Education",text:`Artificial intelligence is transforming education in ways that were unimaginable a decade ago. Adaptive learning platforms now tailor content to each student's pace and learning style, ensuring no child is left struggling without support. AI tutors are available twenty-four hours a day, providing immediate feedback on assignments and answering questions at any time of night. For students in remote areas with limited access to qualified teachers, this technology represents a genuine revolution. However, the rise of AI in classrooms is not without its concerns. Critics worry that students may become dependent on AI assistance, losing the ability to think independently or persist through difficulty. There is also the question of data privacy: AI systems collect enormous amounts of information about student behaviour and performance. Additionally, the human element — the mentor who inspires, the teacher who notices a struggling student and offers encouragement — cannot be replicated by any algorithm. The most effective educational future, therefore, will likely blend the efficiency of AI with the irreplaceable warmth of human teaching.`,
   mcq:[
     {q:"What is an 'adaptive learning platform'?",opts:["A. A platform that changes prices","B. A system that tailors content to each student","C. A physical classroom","D. A government school"],ans:"B. A system that tailors content to each student — the passage says it tailors 'content to each student's pace and learning style.'"},
     {q:"For which students is AI described as 'a genuine revolution'?",opts:["A. Students who dislike reading","B. Students in cities","C. Students in remote areas with limited teacher access","D. Students who prefer sports"],ans:"C. Students in remote areas with limited teacher access — the passage specifically says this for 'students in remote areas with limited access to qualified teachers.'"},
     {q:"What concern about AI does the passage mention?",opts:["A. It is too expensive","B. Students may become dependent on it","C. It only works in English","D. It replaces all teachers"],ans:"B. Students may become dependent on it — the passage says 'students may become dependent on AI assistance, losing the ability to think independently.'"},
     {q:"What does the author suggest is the 'most effective educational future'?",opts:["A. Only human teachers","B. Only AI systems","C. Blending AI efficiency with human warmth","D. Removing AI from schools"],ans:"C. Blending AI efficiency with human warmth — the passage concludes 'blend the efficiency of AI with the irreplaceable warmth of human teaching.'"},
   ],shortQ:"What is the human element in education that AI cannot replace? Mention two aspects from the passage.",shortA:"1. The mentor who inspires students — this motivational, relational role cannot be replicated by an algorithm.\n2. The teacher who notices a struggling student and offers personal encouragement — this empathetic observation and support is distinctly human."},
];
const grammar=[
  {title:"Grammar (Set 1)",qs:[
    {q:"Fill in the blank with the correct tense: She _____ (study) for three hours when the lights went out.",opts:["A. studied","B. had been studying","C. was studying","D. studies"],ans:"B. had been studying — Past Perfect Continuous for an ongoing action that continued up to a past point. The lights going out (simple past) interrupted the study."},
    {q:"Change to passive voice: 'The committee approved the proposal.'",opts:["A. The proposal approves the committee.","B. The proposal was approved by the committee.","C. The proposal has been approved.","D. The committee was approving the proposal."],ans:"B. The proposal was approved by the committee. — Simple past passive: Object + was/were + past participle + by + agent."},
    {q:"Choose the correct reported speech: She said, 'I will come tomorrow.'",opts:["A. She said she will come tomorrow.","B. She said she would come the next day.","C. She said I will come tomorrow.","D. She said she comes the next day."],ans:"B. She said she would come the next day. — In reported speech: 'will' → 'would'; 'tomorrow' → 'the next day'; pronoun 'I' → 'she'."},
    {q:"Fill in with the correct article: He is _____ honest man.",opts:["A. a","B. an","C. the","D. no article"],ans:"B. an — 'honest' begins with a vowel sound /ɒn/; use 'an' before vowel sounds, not vowel letters."},
  ]},
  {title:"Grammar (Set 2)",qs:[
    {q:"Choose the correct conjunction: I wanted to call you _____ I lost my phone.",opts:["A. because","B. but","C. so","D. and"],ans:"B. but — 'but' shows contrast/opposition: I wanted to call (positive desire) BUT I lost my phone (obstacle)."},
    {q:"Identify the error and correct it: 'Neither of the boys have done their homework.'",opts:["A. boys → boy","B. have → has","C. their → his","D. done → did"],ans:"B. have → has — 'Neither' takes singular verb. Correct: 'Neither of the boys HAS done their homework.'"},
    {q:"Change to negative without using 'not': 'She is always late.'",opts:["A. She is never early.","B. She isn't ever late.","C. She will be late.","D. She never be late."],ans:"A. She is never early. — 'always' (positive) → 'never' (negative); 'late' → 'early' (opposite). This keeps the meaning without using 'not'."},
    {q:"Choose the correct preposition: The students arrived _____ the examination hall _____ time.",opts:["A. to / in","B. at / on","C. in / at","D. into / at"],ans:"B. at / on — 'arrived at' (a specific place) + 'on time' (punctual). 'At' for specific locations; 'on time' is a fixed phrase."},
  ]},
  {title:"Grammar (Set 3)",qs:[
    {q:"Choose the correct modal: You _____ see a doctor if you feel unwell.",opts:["A. may","B. should","C. would","D. could"],ans:"B. should — 'should' expresses advice or recommendation. The sentence is advising someone to consult a doctor."},
    {q:"Identify the clause type: 'Although it was raining, they continued playing.'",opts:["A. Result clause","B. Time clause","C. Concessive clause","D. Conditional clause"],ans:"C. Concessive clause — 'Although' introduces a concessive (contrast/concession) clause: despite the rain, they played. Contrast to expected result."},
    {q:"Rewrite using 'unless': 'If you do not practise, you will not improve.'",opts:["A. Unless you practise, you will not improve.","B. Unless you do not practise, you improve.","C. Unless practising you improve.","D. Unless you practise, you improve."],ans:"A. Unless you practise, you will not improve. — 'Unless' = 'if not'. 'Unless you practise' = 'If you do not practise'. The rest stays the same."},
    {q:"Fill in the blank: The harder you work, _____ your results will be.",opts:["A. better","B. the better","C. best","D. much better"],ans:"B. the better — Comparative correlation: 'The + comparative, the + comparative.' 'The harder... the better.'"},
  ]},
];
const writing=[
  {title:"Writing (Set 1)",letter:{q:"Your city has been facing a severe water shortage for the past two months. Write a letter to the Municipal Commissioner (100-120 words) highlighting the problem and requesting urgent action. (5 marks)",ans:`23, Shivaji Nagar,
Pune - 411004
15 October 20XX

The Municipal Commissioner,

function pick(arr,o,n){const out=[];for(let i=0;i<n;i++)out.push(arr[(o+i)%arr.length]);return out;}
function buildPaper(n){const o=n%3;const g=n%3;const l=n%2;const w=n%2;
  return{title:`Practice Paper ${n+1}`,passage:passages[o],grammar:grammar[g],writing:writing[w],lit:literature[l]};}
const PAPERS=[];for(let i=0;i<15;i++)PAPERS.push(buildPaper(i));

function tog(btn,id){btn.classList.toggle('open');const p=document.getElementById(id);if(p)p.classList.toggle('show');}
function qBlock(label,q,ans,mk,pfx,n){const id=`a_${pfx}_${n}`;
  const pre=q.includes('\n')?`<pre style="white-space:pre-wrap;font-size:.93rem;line-height:1.8;font-family:inherit">${q}</pre>`:`<div class="q-text">${q}</div>`;
  const opts=ans.opts?`<div class="options">${ans.opts.map(o=>`<div class="opt">${o}</div>`).join('')}</div>`:'';
  const ansText=typeof ans==='string'?ans:ans.ans;
  return `<div class="q-block"><div class="q-num">${label} [${mk}]</div>${pre}${opts}
    <button class="ans-btn" onclick="tog(this,'${id}')">▶ Show Answer</button>
    <div class="ans-panel" id="${id}"><div class="ans-label">Answer</div><pre>${ansText}</pre></div></div>`;}
function renderPaper(n){
  const p=PAPERS[n];let qn=1;
  let rdHtml=p.passage.mcq.map(m=>qBlock(`Q${qn++}`,m.q,m,'1 mark','rd',qn)).join('');
  rdHtml+=qBlock(`Q${qn++}`,p.passage.shortQ,p.passage.shortA,'2 marks','rds',qn);
  let grHtml=p.grammar.qs.map(m=>qBlock(`Q${qn++}`,m.q,m,'1 mark','gr',qn)).join('');
  let litExHtml=p.lit.extracts.map(m=>qBlock(`Q${qn++}`,m.q,m.ans,'4 marks','lx',qn)).join('');
  let litSAHtml=p.lit.shortAns.map(m=>qBlock(`Q${qn++}`,m.q,m.ans,'3 marks','ls',qn)).join('');
  document.getElementById('paperDiv').innerHTML=`
    <div class="paper-hdr"><div class="paper-title">English Communicative — ${p.title}</div><div class="paper-meta">Code 101 | 2026-27</div>
      <div class="meta-grid"><span>⏱ 3 Hours</span><span>📝 Multiple Sections</span><span>🎯 80 Marks</span></div></div>
    <div class="instr">Section A: Reading (20m) | Section B: Writing (20m) | Section C: Grammar (10m) | Section D: Literature (30m)</div>
    <div class="section-card sec-rd"><div class="section-hdr">📖 Section A — Reading (${p.passage.title})</div><div class="sec-body">
      <div class="passage-box"><strong>Read the following passage carefully:</strong><br><br>${p.passage.text}</div>${rdHtml}</div></div>
    <div class="section-card sec-wr"><div class="section-hdr">✍️ Section B — Writing</div><div class="sec-body">
      ${qBlock(`Q${qn++}`,p.writing.letter.q,p.writing.letter.ans,'5 marks','wl',qn)}
      ${qBlock(`Q${qn++}`,p.writing.para.q,p.writing.para.ans,'5 marks','wp',qn)}</div></div>
    <div class="section-card sec-gr"><div class="section-hdr">📝 Section C — Grammar (${p.grammar.title})</div><div class="sec-body">${grHtml}</div></div>
    <div class="section-card sec-lit"><div class="section-hdr">📚 Section D — Literature (${p.lit.title})</div><div class="sec-body">${litExHtml}${litSAHtml}</div></div>`;}

/* ── Tab bar bounce hint ── */
(function(){
  function initTabHint(rowId){
    var row = document.getElementById(rowId);
    if(!row) return;
    // Wrap in scroll-wrap div if not already wrapped
    if(!row.parentElement.classList.contains('tab-scroll-wrap')){
      var wrap = document.createElement('div');
      wrap.className = 'tab-scroll-wrap';
      row.parentNode.insertBefore(wrap, row);
      wrap.appendChild(row);
    }
    var wrap = row.parentElement;
    // Hide fade when scrolled to end
    row.addEventListener('scroll', function(){
      var atEnd = row.scrollLeft + row.clientWidth >= row.scrollWidth - 4;
      wrap.classList.toggle('at-end', atEnd);
    }, {passive:true});
    // One-time bounce nudge: scroll right 80px then back
    if(row.scrollWidth > row.clientWidth + 10){
      setTimeout(function(){
        row.scrollTo({left:row.scrollWidth, behavior:'smooth'});
        setTimeout(function(){
          row.scrollTo({left:0, behavior:'smooth'});
        }, 1800);
      }, 800);
    }
  }
  document.addEventListener('DOMContentLoaded', function(){
    initTabHint('mainTabs');   // resource pages
    initTabHint('toolTabs');   // resource pages second row
    initTabHint('tabs');       // practice paper pages
  });
})();
