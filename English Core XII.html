<script>
// ─────────────────────────────────────────────
// QUESTION BANKS
// ─────────────────────────────────────────────

// SECTION A – Q1: Factual Passage (12 marks, 10 sub-questions)
const SEC_A_Q1 = [
  {
    passage:"Geminids Meteor Shower",
    blurb:"The Geminids meteor shower occurs every December as Earth passes through debris from asteroid 3200 Phaethon. Unlike most showers (which originate from comets), the Geminids can exceed 100 meteors/hour, are visible to the naked eye, and produce bright, longer-lasting streaks due to the moderate speed of the meteors.",
    qs:[
      {n:"I", q:"Which evidence from paragraph 1 tells us that the Geminids are exceptionally active?", type:"sa", marks:1,
        ans:"Observation rates can exceed 100 meteors per hour — this numerical evidence directly indicates unusually high activity compared to other meteor showers."},
      {n:"II", q:"Complete the following with a suitable reason (paragraph 2): The writer refers to 3200 Phaethon as a 'rocky asteroid' rather than a 'comet' in order to tell the reader that ________.", type:"sa", marks:1,
        ans:"…the Geminids originate from a rocky asteroid, not from a comet, which is the usual source of meteor showers."},
      {n:"III", q:"Based on the passage, how does friction help in making the Geminids visible to observers on Earth? (paragraph 2)", type:"sa", marks:1,
        ans:"Friction causes incoming dust and rock fragments to heat up as they pass through Earth's atmosphere, making them glow and produce bright streaks of light visible from the ground."},
      {n:"IV", q:"Which of the following statements best captures the functional role of the 'radiant' as described in the passage? (paragraph 3)\nA. It is the physical location where cosmic debris is created.\nB. It serves as visual guide for observers to locate the shower.\nC. It determines the speed fragments enter the atmosphere.\nD. It represents the exact area where all meteors disappear", type:"mcq", marks:1, ans:"B — It serves as a visual guide for observers to locate the shower. (The radiant helps identify the shower's apparent point of origin.)"},
      {n:"V", q:"How can we say that the Geminids are more 'observer-friendly' than other showers? (Any one reason) (Paragraph 5)", type:"sa", marks:1,
        ans:"They can be observed with the unaided eye — no specialised equipment like telescopes or binoculars is required. (Any one acceptable reason: brighter/longer streaks, predictable window, high count, visible across wide sky area.)"},
      {n:"VI", q:"Which of the following best explains why the Geminids are frequently studied by scientists?\nA. Their activity has shown a steady increase over time.\nB. Their meteors travel at extremely high speeds.\nC. Their observation requires specialised equipment.\nD. Their radiant shifts position across the sky.", type:"mcq", marks:1, ans:"A — Their activity has shown a steady increase over time. (Long-term consistency and growth make the Geminids scientifically valuable.)"},
      {n:"VII", q:"How does the mention of the 'mid-nineteenth century' documentation contribute to the authority of the claims made about the shower? (Answer in about 40 words)", type:"la", marks:2,
        ans:"Mentioning documentation since the mid-nineteenth century establishes a long observational history. This strengthens credibility of claims about increasing activity and reliability, as they are supported by sustained scientific observation rather than recent data alone."},
      {n:"VIII", q:"The writer's tone throughout the passage can best be described as ________.\nA. persuasive and promotional, encouraging mass participation\nB. explanatory and informative, aimed at scientific understanding\nC. speculative and argumentative, questioning existing theories\nD. celebratory and emotional, highlighting wonder over facts", type:"mcq", marks:1, ans:"B — Explanatory and informative, aimed at scientific understanding. (The passage presents factual explanations in a neutral, objective manner.)"},
      {n:"IX", q:"What does the moderate speed of the Geminids and the resulting 'longer-lasting streaks' suggest about the quality of the viewing experience? (Answer in about 40 words)", type:"la", marks:2,
        ans:"The moderate speed allows meteors to burn longer in the atmosphere, producing brighter and more sustained streaks. This enhances visibility and gives observers more time to notice and appreciate each meteor, making the viewing experience richer."},
      {n:"X", q:"Complete the following with the most suitable option. The main idea of the passage is the ________.\nA. technical process of how asteroids shed cosmic debris\nB. impact of light pollution on modern scientific learning\nC. historical evolution of astronomy since the nineteenth century\nD. scientific explanation and practical observation of Geminids", type:"mcq", marks:1, ans:"D — Scientific explanation and practical observation of Geminids. (The passage combines origin/nature explanation with practical guidance on when and how to observe.)"}
    ]
  },
  {
    passage:"Growth of UPI in India",
    blurb:"A study tracking India's Unified Payments Interface (UPI) over four Octobers (2021–2024) shows transaction volume rising from 4.21 billion to 16.58 billion, and transaction value from ₹7.71 lakh crore to ₹23.49 lakh crore. UPI has spread from tech-savvy users to shops, homes, roadside vendors, and is now a routine part of daily financial life for millions.",
    qs:[
      {n:"I", q:"What was the purpose of tracking the four-year growth of India's Unified Payments Interface (UPI)? (paragraph 1)\nA. To analyse the technical infrastructure supporting digital banking systems\nB. To understand changes in payment behaviour among different user groups\nC. To determine the number of vendors using smartphone-based payments\nD. To compare patterns of digital transactions with traditional cash practices", type:"mcq", marks:1, ans:"B — To understand changes in payment behaviour among different user groups."},
      {n:"II", q:"Analyse whether the percentage growth in the total value of UPI transactions is greater than, less than, or roughly the same as the percentage growth in the number of transactions. State your choice and briefly justify with reference to paragraph 2.", type:"sa", marks:1,
        ans:"The percentage growth in total value is greater. Volume rose ~4× (4.21→16.58 billion), while value rose >3× (₹7.71→₹23.49 lakh crore). This indicates faster growth in value, reflecting increased trust and use of UPI for higher-value payments."},
      {n:"III", q:"Which of the following statements best describes the overall pattern with reference to paragraph 3?\nA. Both the number of transactions and the total value of transactions increase steadily over the four years.\nB. The number of transactions increases, but the total value decreases year after year.\nC. The total value of transactions increases, but the number stays almost unchanged.\nD. Both the number and total value decrease after an initial increase.", type:"mcq", marks:1, ans:"A — Both the number of transactions and the total value increase steadily over the four years."},
      {n:"IV", q:"Paragraph 4 mentions that UPI is used in 'shops, homes, workplaces, and even small roadside vendors'. What does this suggest about the nature of UPI adoption?\nA. Dependence on organised commercial establishments\nB. Widespread adoption across formal and informal settings\nC. Usage limited to digitally advanced urban spaces\nD. Usage restricted to specific consumer groups", type:"mcq", marks:1, ans:"B — Widespread adoption across formal and informal settings."},
      {n:"V", q:"Evaluate the impact of UPI's expansion into formal financial systems on small business owners, with reference to paragraph 5. (Answer in about 40 words)", type:"la", marks:2,
        ans:"UPI's expansion significantly improves financial management for small business owners by enabling digital transaction records, easier income tracking, and reduced reliance on cash. However, benefit may depend on digital literacy and technology access."},
      {n:"VI", q:"Which of the following aspects is NOT directly discussed in the passage?\nA. The growth pattern of UPI transactions over time\nB. The changing public attitude towards digital payments\nC. The policy framework governing digital payment systems\nD. The effect of UPI adoption on small businesses", type:"mcq", marks:1, ans:"C — The policy framework governing digital payment systems. (The passage discusses growth, attitudes, and small business impact, but not government policies or regulations.)"},
      {n:"VII", q:"Fill in the blank with the correct option: UPI's usage by small roadside vendors primarily suggests that digital payment systems in India have become ________. (inclusive / exclusive / marginal)", type:"sa", marks:1, ans:"inclusive — UPI is used across both formal and informal sectors, indicating a wide, inclusive range of users."},
      {n:"VIII", q:"Rohan prefers to carry almost no cash and pays for groceries and transport using his phone. Using information from Paragraph 3 and the charts, explain giving two reasons why UPI is a more suitable option for him in 2024 than it might have been in 2021. (Answer in about 40 words).", type:"la", marks:2,
        ans:"In 2024, the far higher transaction volumes indicate greater system reliability and acceptance. The massive increase in transaction value also reflects wider usage for everyday payments, making UPI more dependable and trusted for routine daily transactions like groceries and transport."},
      {n:"IX", q:"(Based on passage context) How has the growth of UPI transactions from 2021 to 2024 reflected a change in Indian society's relationship with digital payments?", type:"la", marks:1,
        ans:"Higher transaction value reflects user confidence. Greater reliability due to massive transaction volumes. Increased volumes indicate system stability. Wider acceptance across everyday settings. Reduced dependence on physical cash. (Any two points.)"},
      {n:"X", q:"Complete the following appropriately. The four-year data captured in the studies suggests that UPI has transformed from ________ to ________.", type:"sa", marks:1,
        ans:"…a convenient payment option → an essential part of daily financial life for millions of Indians."}
    ]
  },
  {
    passage:"Role of Libraries in Society",
    blurb:"Libraries serve communities not just as book repositories but as learning hubs, equalising access to information regardless of economic background. Free internet, reading spaces, and community programmes make libraries critical to digital inclusion, lifelong learning, and social cohesion.",
    qs:[
      {n:"I", q:"What role do libraries play beyond lending books, based on the passage?", type:"sa", marks:1, ans:"Libraries serve as learning hubs offering free internet access, reading spaces, and community programmes that promote digital inclusion and lifelong learning."},
      {n:"II", q:"Complete the following: Libraries are described as 'equalising' because they ________.", type:"sa", marks:1, ans:"…provide access to information regardless of economic background, ensuring everyone benefits from educational resources."},
      {n:"III", q:"Which aspect of libraries is most emphasised in the passage?\nA. Their architectural heritage\nB. Their role in digital inclusion and community learning\nC. Their collections of rare manuscripts\nD. Their function as quiet study rooms only", type:"mcq", marks:1, ans:"B — Their role in digital inclusion and community learning."},
      {n:"IV", q:"How does free internet access in libraries contribute to social cohesion?", type:"sa", marks:1, ans:"It reduces the digital divide, allowing people from all backgrounds to access information, participate in the digital economy, and connect with communities — thereby strengthening social cohesion."},
      {n:"V", q:"Which of the following best describes the writer's view of libraries?\nA. Outdated institutions being replaced by digital platforms\nB. Essential community resources promoting equality and learning\nC. Government buildings serving administrative purposes\nD. Spaces reserved for academic researchers", type:"mcq", marks:1, ans:"B — Essential community resources promoting equality and learning."},

let ctr=0;
function uid(){return 'a'+(++ctr);}

function tog(btn,id){
  const b=document.getElementById(id);
  b.classList.toggle('show');
  btn.classList.toggle('open');
  btn.textContent=btn.classList.contains('open')?'Hide Answer':'Show Answer';
}

function ansBtn(ansText){
  const id=uid();
  return `<button class="ans-btn" onclick="tog(this,'${id}')">Show Answer</button>
<div class="ans-div" id="${id}"><strong>Answer:</strong> ${ansText.replace(/\n/g,'<br>')}</div>`;
}

function qCard(qnum, qtitle, qsub, qopts, ansText, tags){
  return `<div class="qcard">
<div class="qrow">
<div class="qnum">Q${qnum}.</div>
<div class="qtext">
<div class="qtitle">${qtitle}</div>
${qsub?`<div class="qsub">${qsub}</div>`:''}
${qopts?`<div class="qopts">${qopts}</div>`:''}
${tags?`<div class="qmeta">${tags}</div>`:''}
${ansBtn(ansText)}
</div></div></div>`;
}

function subQCard(subN, qtitle, ansText){
  const id=uid();
  return `<div class="qcard">
<div class="qrow">
<div class="qnum" style="min-width:1.8rem;font-size:.82rem;color:var(--sub);">(${subN})</div>
<div class="qtext">
<div class="qtitle" style="font-size:.87rem;">${qtitle}</div>
<button class="ans-btn" onclick="tog(this,'${id}')">Show Answer</button>
<div class="ans-div" id="${id}"><strong>Answer:</strong> ${ansText.replace(/\n/g,'<br>')}</div>
</div></div></div>`;
}

<div class="qmeta"><span class="tag">Factual passage</span><span class="tag">12 marks</span></div>

<script>
/* ── Tab bar bounce hint ── */
(function(){
  function initTabHint(rowId){
    var row = document.getElementById(rowId);
    if(!row) return;
    // Wrap in scroll-wrap div if not already wrapped
    if(!row.parentElement.classList.contains('tab-scroll-wrap')){
      var wrap = document.createElement('div');
      wrap.className = 'tab-scroll-wrap';
      row.parentNode.insertBefore(wrap, row);
      wrap.appendChild(row);
    }
    var wrap = row.parentElement;
    // Hide fade when scrolled to end
    row.addEventListener('scroll', function(){
      var atEnd = row.scrollLeft + row.clientWidth >= row.scrollWidth - 4;
      wrap.classList.toggle('at-end', atEnd);
    }, {passive:true});
    // One-time bounce nudge: scroll right 80px then back
    if(row.scrollWidth > row.clientWidth + 10){
      setTimeout(function(){
        row.scrollTo({left:row.scrollWidth, behavior:'smooth'});
        setTimeout(function(){
          row.scrollTo({left:0, behavior:'smooth'});
        }, 1800);
      }, 800);
    }
  }
  document.addEventListener('DOMContentLoaded', function(){
    initTabHint('mainTabs');   // resource pages
    initTabHint('toolTabs');   // resource pages second row
    initTabHint('tabs');       // practice paper pages
  });
})();
</script>
