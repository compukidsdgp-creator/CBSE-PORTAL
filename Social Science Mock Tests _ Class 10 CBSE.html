<script>
// HISTORY
const hisMCQ=[
  {q:"The 'Zollverein' was a customs union created in 1834 in:",opts:["A. Italy","B. Germany","C. France","D. Austria"],ans:"B. Germany — Zollverein abolished tariff barriers between German states, creating a unified economic market; important step toward German unification.",type:"mcq"},
  {q:"Which of the following artists painted the allegorical female figure 'Germania' during the Frankfurt Parliament of 1848?",opts:["A. Frédéric Sorrieu","B. Philip Veit","C. Caspar David Friedrich","D. Eugène Delacroix"],ans:"B. Philip Veit — painted Germania at the Frankfurt Parliament; she wore the crown of oak leaves (symbol of German heroism and valor).",type:"mcq"},
  {q:"Assertion (A): Mahatma Gandhi called off the Non-Cooperation Movement in February 1922.\nReason (R): The Chauri Chaura incident in UP involved a violent mob burning a police station, killing 22 policemen.",opts:["A. Both A and R are true; R is correct explanation","B. Both A and R are true; R is not correct explanation","C. A is true but R is false","D. A is false but R is true"],ans:"A. Both A and R are true; R is the correct explanation — Gandhi believed in non-violence; this violent incident convinced him to call off the movement.",type:"ar"},
  {q:"The Civil Disobedience Movement began with Gandhiji's march to:",opts:["A. Champaran","B. Bardoli","C. Dandi","D. Noakhali"],ans:"C. Dandi — the famous 'Dandi March' (March-April 1930): Gandhi walked 240 miles to Dandi to break the salt law, starting the Civil Disobedience Movement.",type:"mcq"},
  {q:"Who amongst the following was NOT associated with the First World War's outcome that affected colonised peoples?",opts:["A. Woodrow Wilson","B. Vladimir Lenin","C. Bismarck","D. Ho Chi Minh"],ans:"C. Bismarck — Otto von Bismarck died in 1898; he was associated with German unification (1871), not WWI. Others were active post-WWI figures.",type:"mcq"},
  {q:"The 'Rowlatt Act' of 1919 gave the British government powers to:",opts:["A. Collect land revenue","B. Jail people without trial","C. Impose economic sanctions","D. Recruit soldiers"],ans:"B. Jail people without trial — the Rowlatt Act (Black Act) allowed indefinite detention without trial for political prisoners; deeply resented as it denied civil liberties.",type:"mcq"},
  {q:"Assertion (A): The Plantation workers in Assam interpreted 'Swaraj' as freedom of movement.\nReason (R): They were not permitted to leave the tea gardens without permission under the Inland Emigration Act of 1859.",opts:["A. Both A and R are true; R is correct explanation","B. Both A and R are true; R is not correct explanation","C. A is true but R is false","D. A is false but R is true"],ans:"A. Both A and R are true; R is the correct explanation — plantation workers associated Swaraj with freedom to move; they were trapped under the Inland Emigration Act.",type:"ar"},
  {q:"Which treaty recognised Greece as an independent nation?",opts:["A. Treaty of Versailles (1919)","B. Treaty of Vienna (1815)","C. Treaty of Constantinople (1832)","D. Treaty of Frankfurt (1871)"],ans:"C. Treaty of Constantinople (1832) — signed between Ottoman Empire, Britain, France, and Russia; formally recognized Greek independence after a decade-long struggle.",type:"mcq"},
  {q:"The Indian artist who painted 'Bharat Mata' was:",opts:["A. Rabindranath Tagore","B. Nandalal Bose","C. Abanindranath Tagore","D. Raja Ravi Varma"],ans:"C. Abanindranath Tagore — painted the iconic 'Bharat Mata' in 1905, depicting India as a goddess holding scriptures, sheaves of rice, a white cloth and a garland.",type:"mcq"},
  {q:"Assertion (A): Planters in the Indigo cultivating regions of Bengal were deeply resented.\nReason (R): They forced the peasants to grow indigo on 3/20th of their land under the 'tinkathia system'.",opts:["A. Both A and R are true; R is correct explanation","B. Both A and R are true; R is not correct explanation","C. A is true but R is false","D. A is false but R is true"],ans:"A. Both A and R are true; R is the correct explanation — the tinkathia system (3 out of 20 parts) was imposed, and planters gave extremely low prices; this triggered Champaran Satyagraha.",type:"ar"},
  {q:"The concept of 'print capitalism' was developed by the historian:",opts:["A. Eric Hobsbawm","B. Benedict Anderson","C. Ernest Renan","D. Jules Michelet"],ans:"B. Benedict Anderson — coined 'print capitalism' in 'Imagined Communities'; argued print media created the shared experience that made nation-states possible.",type:"mcq"},
  {q:"Which of the following best describes 'proto-industrialisation'?",opts:["A. Industrial production in factories","B. Production by artisans in urban workshops","C. Production for merchants by rural craftspeople","D. Government-controlled industrial production"],ans:"C. Production for merchants by rural craftspeople — proto-industrialisation preceded factory system; merchants gave raw materials to rural cottagers who produced for wider markets.",type:"mcq"},
];

const hisSA=[
  {q:"Explain three reasons why novel became a popular literary form in the 18th-19th centuries.",ans:"1. Rise of print technology: cheaper books made novels affordable for middle classes; circulating libraries further widened access.\n2. Literacy spread: industrial revolution increased demand for educated workers; schools expanded; more people could read.\n3. Reflected common people's lives: novels focused on everyday life, domestic settings, romantic relationships — relatable to new middle class audiences, unlike classical epics.\n4. Leisure time: industrial wages gave workers some disposable time/income for reading."},
  {q:"What was the significance of the 1848 revolutions in Europe? Explain with reference to any two countries.",ans:"1848 revolutions ('Spring of Nations'): wave of revolutionary uprisings across Europe against conservative order.\nFrance: February revolution overthrew King Louis-Philippe; Second Republic declared; Louis Napoleon elected president (later Napoleon III).\nGermany/Austria: liberal nationalists in Frankfurt Parliament attempted to draft constitution for unified Germany; conservatives eventually suppressed movement; demonstrated tensions between liberal nationalism and conservative forces.\nSignificance: showed strength of nationalist movements; though ultimately suppressed, accelerated eventual unification of Italy (1861) and Germany (1871); established that nationalism would be the dominant political force of the century."},
  {q:"How did the First World War affect the Indian economy? Explain with three points.",ans:"1. War industries: Indian industries (jute, cotton, iron/steel) boosted to supply war materials; created a new class of Indian capitalists who demanded protection from British competition.\n2. Price rise: war disrupted supply chains; prices of essential goods rose sharply; ordinary people suffered hardship; contributed to anti-colonial resentment.\n3. Income tax and customs duties: government imposed new taxes; peasants and workers bore burden; increased economic discontent.\n4. Recruitment of soldiers: 1.5 million Indian soldiers recruited, many from Punjab; villagers lost young men; families suffered."},
];

const hisLA=[
  {q:"(a) Explain the role of women in the Indian National Movement.\n(b) Why did Gandhi choose salt as the symbol of Civil Disobedience?\n(c) What were the limitations of the movement?",ans:"(a) Women's role: participated in large numbers for first time; took out processions, picketed foreign cloth/liquor shops; produced khadi; courted imprisonment. Middle-class women left domestic confines. Rural women participated in civil disobedience. However, Gandhi's vision was sometimes paternalistic — he saw women's strength as moral, not political.\n(b) Salt as symbol: consumed by all Indians, rich and poor; taxed heavily by British (salt was a state monopoly); breaking salt law was easily understood and participated in by entire population; powerfully symbolised British exploitation of India's resources. Simple act of making salt was accessible to all.\n(c) Limitations: Dalits excluded/marginalised — B.R. Ambedkar formed Depressed Classes Association, demanded separate electorates; Muslim League under Jinnah did not join (feared Hindu domination); movement called off twice (Chauri Chaura 1922, for Gandhi-Irwin pact 1931 negotiations); didn't achieve immediate independence."},
];

// GEOGRAPHY
const geoMCQ=[
  {q:"Which type of soil is formed due to high temperature, heavy rainfall and erosion?",opts:["A. Alluvial soil","B. Laterite soil","C. Black soil","D. Red and yellow soil"],ans:"B. Laterite soil — formed in high temperature and high rainfall areas through intense leaching; found in Karnataka, Tamil Nadu, Western Ghats; suitable for tea and coffee.",type:"mcq"},
  {q:"Assertion (A): The Himalayan rivers are perennial.\nReason (R): They are fed by both snowmelt and monsoon rainfall throughout the year.",opts:["A. Both A and R are true; R is correct explanation","B. Both A and R are true; R is not correct explanation","C. A is true but R is false","D. A is false but R is true"],ans:"A. Both A and R are true; R is the correct explanation — Himalayan rivers receive water from glaciers/snowmelt in summer and monsoon rainfall, making them perennial (non-drying).",type:"ar"},
  {q:"The percentage of land under net sown area in India is approximately:",opts:["A. 12%","B. 28%","C. 46%","D. 54%"],ans:"C. 46% — Net sown area is about 46% of total land area of India; total geographical area is 3.28 million sq km.",type:"mcq"},
  {q:"Which river is called the 'Sorrow of Bihar'?",opts:["A. Ganga","B. Kosi","C. Son","D. Gandak"],ans:"B. Kosi — called 'Sorrow of Bihar' due to frequent and devastating floods it causes in Bihar; it frequently shifts its course and has caused immense human suffering.",type:"mcq"},
  {q:"Assertion (A): India has about 12% of the world's fresh water resources.\nReason (R): India has several large rivers and receives good monsoon rainfall.",opts:["A. Both A and R are true; R is correct explanation","B. Both A and R are true; R is not correct explanation","C. A is true but R is false","D. A is false but R is true"],ans:"A. Both A and R are true; R is the correct explanation — India's diverse river systems and monsoon patterns contribute to its rich freshwater resources.",type:"ar"},
  {q:"Which state is the largest producer of sugarcane in India?",opts:["A. Maharashtra","B. Tamil Nadu","C. Uttar Pradesh","D. Karnataka"],ans:"C. Uttar Pradesh — India's largest sugarcane producer; UP accounts for ~40% of India's total sugarcane production; sugarcane is a Kharif crop.",type:"mcq"},
];

const geoSA=[
  {q:"Differentiate between conventional and non-conventional sources of energy. Give two examples of each.",ans:"Conventional sources: exhaustible, cause pollution, have been used for long time. Examples: coal (thermal power), petroleum (oil), natural gas, nuclear power (sometimes classified separately).\nNon-conventional sources: renewable, environmentally friendly, infinite. Examples: solar energy (solar panels), wind energy (wind farms), tidal energy, geothermal, biogas.\nIndia's context: reducing dependence on coal; expanding solar (National Solar Mission target) and wind (Tamil Nadu, Rajasthan have large wind farms)."},
  {q:"Why are roads more important than railways in India? Give three reasons.",ans:"1. Accessibility: roads can reach remote villages, hilly terrain, forest areas where rail lines are impossible/uneconomical to build.\n2. First/last mile connectivity: goods transported by rail still need roads for loading/unloading and final delivery to consumers.\n3. Flexible and cheaper: small volumes of goods and short distances are more economically moved by road; no fixed schedule.\n4. Door-to-door service: unlike railways (fixed stations), trucks/vehicles can deliver directly to destination.\n5. Rural areas: 66% population lives in villages; roads are the primary transport mode."},
];

const geoLA=[
  {q:"(a) What is meant by 'water scarcity'? Explain its causes.\n(b) Describe the importance of rainwater harvesting in India.\n(c) Name two traditional methods of water conservation used in India.",ans:"(a) Water scarcity: shortage of water when demand exceeds available supply in a region. Causes: (i) Over-extraction of groundwater for agriculture (tube wells); (ii) Population growth increasing demand; (iii) Unequal distribution (some regions over-watered, others dry); (iv) Pollution of water bodies reducing usable water; (v) Climate change altering rainfall patterns; (vi) Inefficient use of water in agriculture (flood irrigation).\n(b) Rainwater harvesting importance: (i) Recharges groundwater aquifers (depleting rapidly); (ii) Provides water in arid regions (Rajasthan, Tamil Nadu); (iii) Reduces urban flooding; (iv) Reduces dependence on centralised supply; (v) Low-cost, sustainable, community-managed; (vi) Tamil Nadu made rooftop rainwater harvesting compulsory for all buildings.\n(c) Traditional methods: (i) Khadins and Johads (Rajasthan) — earthen check dams to harvest rainwater in tanks; (ii) Baolis (stepwells) in Gujarat/Rajasthan; (iii) Bamboo drip irrigation in Meghalaya; (iv) Kulhs (channels) in Himachal Pradesh; (v) Surangam (horizontal wells) in Kerala."},
];

// POLITICAL SCIENCE
const polMCQ=[
  {q:"Which language was made the sole official language by Sri Lanka in 1956?",opts:["A. Tamil","B. Sinhala","C. English","D. Pali"],ans:"B. Sinhala — the Sinhala Only Act (1956) made Sinhala the sole official language, ignoring Tamil-speaking minority (18% of population); led to decades of ethnic conflict.",type:"mcq"},
  {q:"Assertion (A): Belgium adopted a federal model to manage ethnic diversity.\nReason (R): Belgium has a significant French-speaking minority in its Walloon region and Dutch-speaking Flemish majority.",opts:["A. Both A and R are true; R is correct explanation","B. Both A and R are true; R is not correct explanation","C. A is true but R is false","D. A is false but R is true"],ans:"A. Both A and R are true; R is the correct explanation — Belgium's federal model (1993) gave autonomy to regional communities to prevent language-based civil conflict.",type:"ar"},
  {q:"Which of the following is NOT a characteristic of a federal government?",opts:["A. Single government at national level","B. Constitution divides powers","C. Independent judiciary","D. Written constitution"],ans:"A. Single government at national level — federalism has TWO levels: central + state governments. A single government is the hallmark of unitary systems (like UK).",type:"mcq"},
  {q:"Horizontal power sharing refers to the sharing of power among:",opts:["A. Different levels of government","B. Different organs of government at the same level","C. Different ethnic groups","D. Different political parties"],ans:"B. Different organs of government at the same level — the three organs: legislature (makes laws), executive (implements), judiciary (interprets); this is checks and balances.",type:"mcq"},
  {q:"The 'Scheduled Castes and Scheduled Tribes (Prevention of Atrocities) Act' deals with:",opts:["A. Educational reservation","B. Political representation","C. Protection from social discrimination","D. Economic development"],ans:"C. Protection from social discrimination — enacted to prevent crimes against SC/ST communities and ensure their protection; strengthened by 2018 amendment.",type:"mcq"},
];

const polSA=[
  {q:"What is the difference between 'coming together' and 'holding together' federations? Give one example of each.",ans:"'Coming together' federation: independent states come together voluntarily to form a federation for mutual benefit; constituent units have more autonomy. Example: USA, Switzerland, Australia.\n'Holding together' federation: a large country divides power between the central government and constituent units to accommodate diversity; central government usually stronger. Example: India, Spain, Belgium.\nIndia's federalism: holds together; Parliament can change state boundaries; strong central list (Union List); emergency provisions centralise power further."},
  {q:"Explain the role of political parties in a democracy. Name any two challenges faced by political parties in India.",ans:"Role of political parties: (1) Contest elections — provide choice to voters; (2) Form governments — ruling party implements policies; (3) Represent public opinion — aggregate and articulate views; (4) Provide opposition — scrutinise government; (5) Shape public policies — through manifestos.\nChallenges in India: (1) Internal democracy deficit — decisions made by top leaders without consulting members; family-based succession (dynasticism); (2) Money and muscle power — criminal elements enter politics; expensive elections favour wealthy candidates; (3) Lack of meaningful choice — similar policies across parties; voters have limited alternatives."},
];

const polLA=[
  {q:"(a) Explain the concept of 'majoritarianism' with the example of Sri Lanka.\n(b) How does Belgium's power-sharing model differ from Sri Lanka's approach?\n(c) Why is power sharing desirable in democracies?",ans:"(a) Sri Lanka's majoritarianism: after independence (1948), leaders implemented Sinhala-majority policies. Sinhala Only Act (1956): Sinhala made sole official language; Tamils lost government jobs. University admissions favoured Sinhalese. Buddhism given privileged status. Tamil people felt alienated; demanded Tamil Eelam (separate state). Led to civil war (1983-2009); LTTE formed; enormous human suffering.\n(b) Belgium vs Sri Lanka: Belgium had similar ethnic tensions (Dutch Flemish majority, French Walloon minority). Instead of majoritarianism, Belgium: (i) Equal representation in cabinet regardless of population; (ii) Federal model — regional governments for language communities; (iii) Separate community governments for cultural/educational matters; (iv) Brussels — equal status for both languages. Result: peaceful accommodation of diversity; Belgium remained united.\n(c) Why power sharing is desirable: (1) Reduces conflict — groups fear domination when excluded from power; sharing reduces resentment; (2) Moral argument — democratic legitimacy requires all stakeholders to have a voice; majority alone cannot impose will on minorities; (3) Better outcomes — multiple perspectives lead to better decisions; (4) Stability — governments with broad coalitions are more durable; (5) Respects diversity — especially important in multi-ethnic societies like India."},
];

// ECONOMICS
const ecoMCQ=[
  {q:"Which of the following is NOT a feature of the service sector?",opts:["A. It produces intangible goods","B. It includes banking and insurance","C. It directly transforms natural resources","D. It includes education"],ans:"C. It directly transforms natural resources — that's the primary sector (agriculture, mining). Service/tertiary sector produces intangible services (banking, education, healthcare, transport).",type:"mcq"},
  {q:"Assertion (A): The Human Development Index (HDI) is a better measure of development than per capita income.\nReason (R): HDI considers health, education and income, giving a more comprehensive picture of human well-being.",opts:["A. Both A and R are true; R is correct explanation","B. Both A and R are true; R is not correct explanation","C. A is true but R is false","D. A is false but R is true"],ans:"A. Both A and R are true; R is the correct explanation — HDI (UNDP) measures life expectancy (health), education (mean years/expected years) and GNI per capita; more comprehensive than just income.",type:"ar"},
  {q:"Under which scheme did the government plan for 100 days of guaranteed employment to rural households?",opts:["A. PMRY","B. MNREGA","C. JNNURM","D. PMEGP"],ans:"B. MNREGA (Mahatma Gandhi National Rural Employment Guarantee Act 2005) — guarantees 100 days of wage employment per year to rural households; unskilled manual work; implemented from 2006.",type:"mcq"},
  {q:"The 'Pradhan Mantri Jan Dhan Yojana' is primarily aimed at:",opts:["A. Providing food security","B. Financial inclusion of the poor","C. Rural electrification","D. Housing for all"],ans:"B. Financial inclusion of the poor — aimed at ensuring access to banking, savings/deposit accounts, remittance, credit, insurance and pension services to excluded sections.",type:"mcq"},
];

const ecoSA=[
  {q:"What is globalisation? Explain how it has impacted Indian economy.",ans:"Globalisation: process of rapid integration and interconnection of countries through trade, investment, technology, and migration; enabled by IT and fall in trade barriers.\nImpact on India (post-1991 liberalisation):\nPositive: (i) FDI increased — jobs in BPO, IT, manufacturing; (ii) Consumer goods variety improved; (iii) GDP growth accelerated; (iv) Access to latest technology.\nNegative: (i) Local manufacturers face competition from MNCs; (ii) Small producers (textiles, toys, electronics) unable to compete; (iii) Job losses in some sectors; (iv) Farmers affected by cheaper imports.\nIndia emerged as major IT/services exporter; mixed impact on industry vs services."},
  {q:"Distinguish between formal and informal credit sources. Why should people prefer formal credit?",ans:"Formal sources: banks, cooperative societies, SBI, RBI-regulated; low interest rates (10-15%); collateral may be required; supervised by government.\nInformal sources: moneylenders, traders, relatives; high interest rates (up to 5-10% per month); no regulation; may lead to debt traps.\nWhy formal credit preferred: (i) Lower interest rates save money; (ii) Legal protection for borrowers; (iii) Transparent terms; (iv) Self-help groups (SHGs) have made formal credit accessible to rural poor without collateral requirements."},
];

const ecoLA=[
  {q:"(a) What is 'consumer exploitation'? Give two examples.\n(b) Explain the Consumer Protection Act with three rights of consumers.\n(c) What steps can consumers take to protect themselves?",ans:"(a) Consumer exploitation: sellers take undue advantage of consumers through misleading ads, adulterated goods, short weighing, overcharging. Examples: (1) Shopkeeper sells food with less weight than marked. (2) Medicine sold without marked expiry date. (3) Fake guarantee/warranty cards. (4) Misleading advertisements overstating benefits.\n(b) Consumer Protection Act 2019 (replaced 1986 Act): Rights of consumers: (1) Right to safety — protection from hazardous goods; (2) Right to be informed — truthful info about quality, quantity, price; (3) Right to choose — variety of goods at competitive prices; (4) Right to be heard — grievances must be addressed; (5) Right to seek redressal — compensation for defective goods; (6) Right to consumer education — aware of rights and remedies. Redressal forums: District (up to ₹1 crore), State, National Consumer Disputes Redressal Commissions.\n(c) Consumer self-protection: (1) Check BIS/FSSAI/ISI marks on products; (2) Get cash memo/receipt for every purchase; (3) File complaint at consumer forum for grievances; (4) Read labels carefully (ingredients, expiry, price); (5) Form consumer awareness groups/organisations; (6) Use RTI to get information from public authorities."},
];

function pick(arr,o,n){const out=[];for(let i=0;i<n;i++)out.push(arr[(o+i)%arr.length]);return out;}

function buildPaper(n){
  const o=n*2;
  return {
    title:`Practice Paper ${n+1}`,
    hisMCQ:pick(hisMCQ,o,6), hisSA:pick(hisSA,o,2), hisLA:pick(hisLA,o,1),
    geoMCQ:pick(geoMCQ,o,5), geoSA:pick(geoSA,o,2), geoLA:pick(geoLA,o,1),
    polMCQ:pick(polMCQ,o,5), polSA:pick(polSA,o,2), polLA:pick(polLA,o,1),
    ecoMCQ:pick(ecoMCQ,o,4), ecoSA:pick(ecoSA,o,2), ecoLA:pick(ecoLA,o,1),
  };
}

const PAPERS=[];for(let i=0;i<15;i++) PAPERS.push(buildPaper(i));
let cur=0;

function tog(btn,id){btn.classList.toggle('open');const p=document.getElementById(id);if(p)p.classList.toggle('show');}

function qBlock(q,num,type,sec,pfx){
  const id=`a_${pfx}_${num}`;
  const tl=type==='mcq'?'MCQ':type==='ar'?'A&R':type==='sa'?'SA':'LA';
  const ansCls=sec==='geo'?'geo-ans':sec==='pol'?'pol-ans':sec==='eco'?'eco-ans':'';
  const al=sec==='his'?'Answer (History)':sec==='geo'?'Answer (Geography)':sec==='pol'?'Answer (Pol. Science)':'Answer (Economics)';
  const pre=q.q.includes('\n')?`<pre style="white-space:pre-wrap;font-family:inherit;font-size:.93rem;line-height:1.6">${q.q}</pre>`:`<div class="q-text">${q.q}</div>`;
  const opts=q.opts?`<div class="options">${q.opts.map(o=>`<div class="opt">${o}</div>`).join('')}</div>`:'';
  const mk=type==='mcq'||type==='ar'?'[1 mark]':type==='sa'?'[3 marks]':'[5 marks]';
  return `<div class="q-block">
    <div class="q-num">Q${num} <span class="q-type type-${type}">${tl}</span></div>
    ${pre}${opts}
    <div style="font-size:.78rem;color:var(--muted);margin-top:3px">${mk}</div>
    <button class="ans-btn" onclick="tog(this,'${id}')">▶ Show Answer</button>
    <div class="ans-panel ${ansCls}" id="${id}">
      <div class="ans-label">${al}</div>
      <pre style="white-space:pre-wrap;font-family:inherit;font-size:.88rem;line-height:1.6">${q.ans}</pre>
    </div>
  </div>`;
}

function renderPaper(n){
  const p=PAPERS[n]; let qn=1;
  const hisQs=p.hisMCQ.map((q,i)=>qBlock(q,qn++,'mcq','his',`h_m${i}`)).join('')+
    p.hisSA.map((q,i)=>qBlock(q,qn++,'sa','his',`h_s${i}`)).join('')+
    p.hisLA.map((q,i)=>qBlock(q,qn++,'la','his',`h_l${i}`)).join('');
  const geoQs=p.geoMCQ.map((q,i)=>qBlock(q,qn++,'mcq','geo',`g_m${i}`)).join('')+
    p.geoSA.map((q,i)=>qBlock(q,qn++,'sa','geo',`g_s${i}`)).join('')+
    p.geoLA.map((q,i)=>qBlock(q,qn++,'la','geo',`g_l${i}`)).join('');
  const polQs=p.polMCQ.map((q,i)=>qBlock(q,qn++,'mcq','pol',`p_m${i}`)).join('')+
    p.polSA.map((q,i)=>qBlock(q,qn++,'sa','pol',`p_s${i}`)).join('')+
    p.polLA.map((q,i)=>qBlock(q,qn++,'la','pol',`p_l${i}`)).join('');
  const ecoQs=p.ecoMCQ.map((q,i)=>qBlock(q,qn++,'mcq','eco',`e_m${i}`)).join('')+
    p.ecoSA.map((q,i)=>qBlock(q,qn++,'sa','eco',`e_s${i}`)).join('')+
    p.ecoLA.map((q,i)=>qBlock(q,qn++,'la','eco',`e_l${i}`)).join('');
  document.getElementById('paperDiv').innerHTML=`
    <div class="paper-hdr">
      <div class="paper-title">Class X Social Science — ${p.title}</div>
      <div class="paper-meta">Code 087 | 2026-27</div>
      <div class="meta-grid"><span class="meta-item">⏱ 3 Hours</span><span class="meta-item">📝 37 Questions</span><span class="meta-item">🎯 80 Marks</span></div>
    </div>
    <div class="section-card sec-his"><div class="section-hdr"><span class="sec-dot"></span>History — India & the Contemporary World II</div><div class="sec-body">${hisQs}</div></div>
    <div class="section-card sec-geo"><div class="section-hdr"><span class="sec-dot"></span>Geography — Contemporary India II</div><div class="sec-body">${geoQs}</div></div>
    <div class="section-card sec-pol"><div class="section-hdr"><span class="sec-dot"></span>Political Science — Democratic Politics II</div><div class="sec-body">${polQs}</div></div>
    <div class="section-card sec-eco"><div class="section-hdr"><span class="sec-dot"></span>Economics — Understanding Economic Development</div><div class="sec-body">${ecoQs}</div></div>`;
}

function loadPaper(n){cur=n;document.getElementById('pSel').value=n;renderPaper(n);window.scrollTo({top:0,behavior:'smooth'});}
function prev(){if(cur>0)loadPaper(cur-1);}
function next(){if(cur<14)loadPaper(cur+1);}
function toggleTheme(){const r=document.documentElement;r.setAttribute('data-theme',r.getAttribute('data-theme')==='dark'?'light':'dark');}
loadPaper(0);
</script>
