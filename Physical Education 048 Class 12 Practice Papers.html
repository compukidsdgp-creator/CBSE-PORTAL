<script>
// ── SECTION A — MCQ Banks (18 × 1M) ────────────────────────────
const SA=[
  // Q1 — type of competition
  [{q:"Which type of competition involves direct interaction between opponents?",opts:["A. Technical","B. Tactical","C. Physical","D. Psychological"],ans:"A. Technical",exp:"Technical competitions involve direct physical skill confrontation."},
   {q:"A round robin tournament is also known as:",opts:["A. Single elimination","B. League tournament","C. Knockout","D. Consolation"],ans:"B. League tournament",exp:"Round robin = league; every team plays every other team."}],
  // Q2 — A/R
  [{q:"Assertion (A): Physical activity improves mental health. Reason (R): Exercise releases endorphins that elevate mood.",opts:["A. Both true, R correct explanation","B. Both true, R not correct explanation","C. A true R false","D. A false R true"],ans:"A. Both true, R correct explanation",exp:"Endorphins released during exercise are scientifically proven to improve mood — R correctly explains A."},
   {q:"Assertion (A): Warming up before exercise prevents injury. Reason (R): Warm-up increases body temperature and blood flow to muscles.",opts:["A. Both true, R correct explanation","B. Both true, R not correct explanation","C. A true R false","D. A false R true"],ans:"A. Both true, R correct explanation",exp:"Warm-up reduces injury risk; R (increased temperature/blood flow) is the correct explanation."}],
  // Q3 — matching
  [{q:"Match the yoga asanas with their primary benefits: A-Tadasana, B-Shavasana, C-Padmasana, D-Bhujangasana — i-Back strength, ii-Standing posture, iii-Relaxation, iv-Meditation",opts:["A. A-ii, B-iii, C-iv, D-i","B. A-i, B-ii, C-iii, D-iv","C. A-iv, B-i, C-ii, D-iii","D. A-iii, B-iv, C-i, D-ii"],ans:"A. A-ii, B-iii, C-iv, D-i",exp:"Tadasana-posture, Shavasana-relaxation, Padmasana-meditation, Bhujangasana-back strength."},
   {q:"Match the fitness components with tests: A-Cardio endurance, B-Flexibility, C-Speed, D-Strength — i-50m dash, ii-Push-ups, iii-Sit and reach, iv-600m run",opts:["A. A-iv, B-iii, C-i, D-ii","B. A-i, B-iii, C-iv, D-ii","C. A-iii, B-i, C-ii, D-iv","D. A-ii, B-iv, C-iii, D-i"],ans:"A. A-iv, B-iii, C-i, D-ii",exp:"Cardio-600m, Flexibility-sit&reach, Speed-50m dash, Strength-push-ups."}],
  // Q4
  [{q:"In the Aaberg Physical Fitness Test Battery, the percentage of body fat for an average adult male is approximately:",opts:["A. 45%","B. 55%","C. 25%","D. 35%"],ans:"B. 55%",exp:"Per SQP MS: 55% (B)."},
   {q:"BMI of 30 or above is classified as:",opts:["A. Normal","B. Overweight","C. Obese","D. Underweight"],ans:"C. Obese",exp:"WHO: BMI ≥30 = Obese; 25-29.9 = Overweight; 18.5-24.9 = Normal."}],
  // Q5
  [{q:"Which asana is recommended for managing diabetes?",opts:["A. Vakrasana","B. Halasana","C. Sarvangasana","D. Shavasana"],ans:"A. Vakrasana",exp:"Vakrasana (spinal twist) stimulates the pancreas and is recommended for diabetes management."},
   {q:"Mandukasana is beneficial for:",opts:["A. Hypertension","B. Diabetes","C. Back pain","D. Asthma"],ans:"B. Diabetes",exp:"Mandukasana (frog pose) massages abdominal organs including the pancreas, beneficial for diabetes."}],
  // Q6
  [{q:"Which asana is performed lying on the back with legs raised?",opts:["A. Bhujangasana","B. Matsyasana","C. Matsendraasana","D. Viparita Karani"],ans:"C. Matsendraasana",exp:"Per SQP MS (Q6): Matsendraasana. Note: Matsendraasana is a seated twist; SQP answer is C."},
   {q:"Ardha Matsyendrasana primarily benefits:",opts:["A. Eye muscles","B. Digestive system and spine","C. Lungs","D. Kidneys only"],ans:"B. Digestive system and spine",exp:"Ardha Matsyendrasana stimulates digestive organs and improves spinal flexibility."}],
  // Q7
  [{q:"Who is known as the father of Paralympic movement?",opts:["A. Dr Ludwig Guttman","B. Pierre de Coubertin","C. Sir Roger Bannister","D. Dr Ernst Jokl"],ans:"A. Dr Ludwig Guttman",exp:"Dr Ludwig Guttman organised the first Stoke Mandeville Games in 1948, the foundation of Paralympics."},
   {q:"The Paralympic Games were first held in:",opts:["A. 1952","B. 1948","C. 1960","D. 1964"],ans:"C. 1960",exp:"The first Paralympic Games were held in Rome in 1960, though the Stoke Mandeville Games started in 1948."}],
  // Q8
  [{q:"Which mineral is essential for bone health?",opts:["A. Iron","B. Zinc","C. Calcium","D. Magnesium"],ans:"C. Calcium",exp:"Calcium is the primary mineral for bone density and strength."},
   {q:"The macronutrient that provides the most energy per gram is:",opts:["A. Carbohydrate","B. Protein","C. Water","D. Fat"],ans:"D. Fat",exp:"Fat provides 9 kcal/gram; carbohydrates and proteins provide 4 kcal/gram each."}],
  // Q9
  [{q:"Which of the following are considered micronutrients?",opts:["A. Proteins and fats","B. Carbohydrates only","C. Water and fibre","D. Vitamins and minerals"],ans:"D. Vitamins and minerals",exp:"Micronutrients = vitamins and minerals needed in small amounts; macronutrients = carbs, proteins, fats."},
   {q:"Dehydration during exercise primarily affects:",opts:["A. Hair growth","B. Bone density","C. Performance and body temperature regulation","D. Vision"],ans:"C. Performance and body temperature regulation",exp:"Even 2% dehydration significantly impairs exercise performance and thermoregulation."}],
  // Q10
  [{q:"The Harvard Step Test measures:",opts:["A. Lung capacity","B. Muscle strength","C. Flexibility","D. Cardiovascular fitness"],ans:"D. Cardiovascular fitness",exp:"Harvard Step Test assesses cardiovascular efficiency by measuring heart rate recovery after stepping."},
   {q:"Which test measures flexibility of the lower back and hamstrings?",opts:["A. Harvard Step Test","B. Push-up test","C. Sit and Reach Test","D. 600m run"],ans:"C. Sit and Reach Test",exp:"Sit and Reach Test measures flexibility of the lower back and hamstring muscles."}],
  // Q11
  [{q:"Muscle hypertrophy refers to:",opts:["A. Muscle weakness","B. Hypertrophy of muscles (increase in size)","C. Muscle atrophy","D. Muscle cramp"],ans:"B. Hypertrophy of muscles (increase in size)",exp:"Hypertrophy is the increase in muscle fibre size due to resistance training."},
   {q:"Which principle of training involves gradually increasing the training load?",opts:["A. Specificity","B. Reversibility","C. Progressive Overload","D. Variation"],ans:"C. Progressive Overload",exp:"Progressive overload = gradually increasing stress on the body to stimulate adaptation."}],
  // Q12
  [{q:"A sprain is an injury to:",opts:["A. Muscle","B. Ligament","C. Tendon","D. Bone"],ans:"B. Ligament / Sprain",exp:"Sprain = injury to ligament (bone-to-bone). Strain = injury to muscle/tendon."},
   {q:"RICE method for injury treatment stands for:",opts:["A. Rest, Ice, Compression, Elevation","B. Run, Ice, Continue, Engage","C. Relax, Inhale, Compress, Exercise","D. Rest, Injury, Cold, Elastic"],ans:"A. Rest, Ice, Compression, Elevation",exp:"RICE (or PRICE with Protection) is the standard first aid protocol for soft tissue injuries."}],
  // Q13
  [{q:"Which component of physical fitness is measured by the time taken to respond to a stimulus?",opts:["A. Speed","B. Agility","C. Reaction time","D. Coordination"],ans:"C. Reaction time",exp:"Reaction time is the interval between a stimulus and the initiation of a response."},
   {q:"Agility is best defined as:",opts:["A. Muscle strength","B. Ability to change direction quickly and accurately","C. Running speed","D. Balance"],ans:"B. Ability to change direction quickly and accurately",exp:"Agility combines speed, balance, coordination and reaction time."}],
  // Q14
  [{q:"In biomechanics, force produces or changes:",opts:["A. Temperature","B. Effect of force / motion","C. Nutrition","D. Colour"],ans:"B. Effect of force / motion",exp:"Force causes changes in motion — it accelerates, decelerates or changes direction of an object."},
   {q:"Newton's Third Law states:",opts:["A. F=ma","B. Objects at rest stay at rest","C. Every action has an equal and opposite reaction","D. Force equals mass times velocity"],ans:"C. Every action has an equal and opposite reaction",exp:"Newton's Third Law: for every action force there is an equal and opposite reaction force."}],
  // Q15
  [{q:"Psychology in sports is concerned with:",opts:["A. Diet of athletes","B. Training schedules","C. Injury management","D. Behaviour and mental processes of athletes"],ans:"D. Behaviour and mental processes of athletes",exp:"Sports psychology studies how psychological factors influence sports performance and how sport affects psychological well-being."},
   {q:"Which type of motivation comes from within the individual?",opts:["A. Extrinsic","B. Social","C. Intrinsic","D. Material"],ans:"C. Intrinsic",exp:"Intrinsic motivation is driven by personal interest and enjoyment; extrinsic by external rewards."}],
  // Q16
  [{q:"Assertion (A): Intrinsic motivation is more durable than extrinsic. Reason (R): External rewards eventually decrease intrinsic interest.",opts:["A. Both true, R correct","B. Both true, R not correct","C. A true R false","D. A false R true"],ans:"B. A true R false",exp:"Per SQP MS Q16: B (A true, R false). Note: R describes 'overjustification effect' which IS a real phenomenon. MS states B."},
   {q:"Assertion (A): Anxiety improves sports performance. Reason (R): Moderate arousal is optimal for performance.",opts:["A. Both true, R correct","B. Both true, R not correct","C. A true R false","D. A false R true"],ans:"B. Both true, R not correct",exp:"A is true (moderate anxiety can improve performance — Yerkes-Dodson). R is true but doesn't correctly explain A (optimal performance is not just about 'moderate arousal' in a simple sense)."}],
  // Q17
  [{q:"The two main variables manipulated in training load are:",opts:["A. Speed and strength","B. Intensity and volume","C. Frequency and nutrition","D. Rest and diet"],ans:"B. Intensity and volume",exp:"Training load = Intensity (how hard) × Volume (how much). These two variables determine overload."},
   {q:"Which principle of training says muscles must be trained specifically for the sport?",opts:["A. Overload","B. Reversibility","C. Specificity","D. Variety"],ans:"C. Specificity",exp:"Specificity principle: training adaptations are specific to the type of exercise and muscles used."}],
  // Q18
  [{q:"Which component of physical fitness is most important for a weightlifter?",opts:["A. Strength","B. Flexibility","C. Endurance","D. Agility"],ans:"A. Strength",exp:"Weightlifting primarily requires muscular strength — the maximum force a muscle can exert."},
   {q:"Cardiorespiratory endurance is best developed by:",opts:["A. Short sprints","B. Weight training","C. Aerobic exercises like running and swimming","D. Stretching"],ans:"C. Aerobic exercises like running and swimming",exp:"Aerobic activities sustained over time develop cardiorespiratory (cardiovascular) endurance."}],
];

// ── BUILD + RENDER ────────────────────────────────────────────────
function tog(btn,id){
  const b=document.getElementById(id);b.classList.toggle('show');
  btn.classList.toggle('open');
  btn.textContent=btn.classList.contains('open')?'Hide Answer':'Show Answer';
}
function ab(id){return`<button class="ans-btn" onclick="tog(this,'${id}')">Show Answer</button>`;}

function buildPaper(n){
  // SA: each Qn bank has 2 variants; pick by (n%2)
  const v=n%2;
  return{
    sa:Array.from({length:18},(_, i)=>SA[i][v]),
    sb:SB.slice(0,6).map((_,i)=>SB[(n*3+i)%SB.length]),
    sc:SC.slice(0,6).map((_,i)=>SC[(n*2+i)%SC.length]),
    sd:SD.map((_,i)=>SD[(n+i)%SD.length]),
    se:SE.map((_,i)=>SE[(n+i)%SE.length]),
  };
}

function renderPaper(p,idx){
  const pid=`p${idx}`;
  let h=`<div class="paper-header"><h2>Practice Paper ${idx+1}</h2>
    <div class="paper-meta"><span class="meta-tag">Code 048</span><span class="meta-tag">70 Marks</span>
    <span class="meta-tag">3 Hours</span><span class="meta-tag">Section-A: No choice</span></div></div>`;

  // SECTION A
  h+=`<div class="section"><div class="section-title">SECTION A — MCQ / Assertion-Reason (18 × 1 = 18 Marks)</div>
    <div class="instr">Q1-Q18: Each carries 1 mark. Q1-Q16 MCQ/Matching/T-F; Q17-Q18 may contain A-R. All compulsory.</div>`;
  p.sa.forEach((q,i)=>{
    const qid=`${pid}-sa${i+1}`;
    h+=`<div class="question"><div class="q-header"><span class="q-num">Q${i+1}</span><span class="q-marks">1M</span></div>
      <div class="q-text">${q.q}</div>
      <div class="options">${q.opts.map(o=>`<div class="opt">${o}</div>`).join('')}</div>
      ${ab(qid)}<div class="answer" id="${qid}"><p><strong>${q.ans}</strong><br>${q.exp}</p></div></div>`;
  });
  h+=`</div>`;

  // SECTION B
  h+=`<div class="section"><div class="section-title">SECTION B — Short Answer-I (2M each · 6 Questions · 12 Marks)</div>
    <div class="instr">Q19-Q24: Attempt any 6 (internal choice may be available). Each carries 2 marks.</div>`;
  p.sb.forEach((q,i)=>{
    const qid=`${pid}-sb${i+19}`;
    h+=`<div class="question"><div class="q-header"><span class="q-num">Q${i+19}</span><span class="q-marks">2M</span></div>
      <div class="q-text">${q.q}</div>
      ${ab(qid)}<div class="answer" id="${qid}"><p>${q.ans.replace(/\n/g,'<br>')}</p></div></div>`;
  });
  h+=`</div>`;

  // SECTION C
  h+=`<div class="section"><div class="section-title">SECTION C — Short Answer-II (3M each · 6 Questions · 18 Marks)</div>
    <div class="instr">Q25-Q30: Each carries 3 marks. Attempt any 6.</div>`;
  p.sc.forEach((q,i)=>{
    const qid=`${pid}-sc${i+25}`;
    h+=`<div class="question"><div class="q-header"><span class="q-num">Q${i+25}</span><span class="q-marks">3M</span></div>
      <div class="q-text">${q.q}</div>
      ${ab(qid)}<div class="answer" id="${qid}"><p>${q.ans.replace(/\n/g,'<br>')}</p></div></div>`;
  });
  h+=`</div>`;

  // SECTION D
  h+=`<div class="section"><div class="section-title">SECTION D — Case Studies (4M each · 3 Questions · 12 Marks)</div>
    <div class="instr">Q31-Q33: Case-based / long answer. Each carries 4 marks. Internal choice in each.</div>`;
  p.sd.forEach((q,i)=>{
    const qid=`${pid}-sd${i+31}`;
    h+=`<div class="question"><div class="q-header"><span class="q-num">Q${i+31}</span><span class="q-marks">4M</span></div>
      <div class="q-text">${q.q}</div>
      ${ab(qid)}<div class="answer" id="${qid}"><p>${q.ans.replace(/\n/g,'<br>')}</p></div></div>`;
  });
  h+=`</div>`;

  // SECTION E
  h+=`<div class="section"><div class="section-title">SECTION E — Long Answer (5M each · 2 Questions · 10 Marks)</div>
    <div class="instr">Q34-Q37 (choose any 2): Each carries 5 marks. Attempt any 2 of 4.</div>`;
  p.se.forEach((q,i)=>{
    const qid=`${pid}-se${i+34}`;
    h+=`<div class="question"><div class="q-header"><span class="q-num">Q${i+34}</span><span class="q-marks">5M</span></div>
      <div class="q-text">${q.q}</div>
      ${ab(qid)}<div class="answer" id="${qid}"><p>${q.ans.replace(/\n/g,'<br>')}</p></div></div>`;
  });
  h+=`</div>`;
  return h;
}

const N=15;
const tabsEl=document.getElementById('tabs');
const papersEl=document.getElementById('papers');
for(let i=0;i<N;i++){
  const t=document.createElement('button');
  t.className='tab'+(i===0?' active':'');
  t.textContent=`Paper ${i+1}`;
  t.onclick=(()=>{const n=i;return()=>show(n);})();
  tabsEl.appendChild(t);
  const d=document.createElement('div');
  d.className='paper'+(i===0?' active':'');
  d.innerHTML=renderPaper(buildPaper(i),i);
  papersEl.appendChild(d);
}
function show(n){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===n));
  document.querySelectorAll('.paper').forEach((p,i)=>p.classList.toggle('active',i===n));
  window.scrollTo({top:0,behavior:'smooth'});
}
function toggleTheme(){
  const r=document.documentElement;
  r.setAttribute('data-theme',r.getAttribute('data-theme')==='dark'?'light':'dark');
}

(function(){
  function initTabHint(rowId){
    var row = document.getElementById(rowId);
    if(!row) return;
    // Wrap in scroll-wrap div if not already wrapped
    if(!row.parentElement.classList.contains('tab-scroll-wrap')){
      var wrap = document.createElement('div');
      wrap.className = 'tab-scroll-wrap';
      row.parentNode.insertBefore(wrap, row);
      wrap.appendChild(row);
    }
    var wrap = row.parentElement;
    // Hide fade when scrolled to end
    row.addEventListener('scroll', function(){
      var atEnd = row.scrollLeft + row.clientWidth >= row.scrollWidth - 4;
      wrap.classList.toggle('at-end', atEnd);
    }, {passive:true});
    // One-time bounce nudge: scroll right 80px then back
    if(row.scrollWidth > row.clientWidth + 10){
      setTimeout(function(){
        row.scrollTo({left:row.scrollWidth, behavior:'smooth'});
        setTimeout(function(){
          row.scrollTo({left:0, behavior:'smooth'});
        }, 1800);
      }, 800);
    }
  }
  document.addEventListener('DOMContentLoaded', function(){
    initTabHint('mainTabs');   // resource pages
    initTabHint('toolTabs');   // resource pages second row
    initTabHint('tabs');       // practice paper pages
  });
})();
