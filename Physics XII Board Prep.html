<script>
// ── QUESTION POOLS ─────────────────────────────────────────────────
const SEC_A_MCQ = [
  {q:"A hollow conducting sphere of radius R has charge Q. If the radius is doubled keeping charge same, the electric flux through the Gaussian surface enclosing the sphere will:",
   opts:["A. increase","B. decrease","C. remain the same","D. become zero"],ans:"C",key:"Electric flux depends only on enclosed charge (Gauss's Law: Φ = Q/ε₀), not on size of Gaussian surface."},
  {q:"Two resistors of 1000 W each are connected in parallel across 220 V. Total power consumed is:",
   opts:["A. 500 W","B. 1000 W","C. 2000 W","D. 4000 W"],ans:"C",key:"Parallel: P = P₁+P₂ = 1000+1000 = 2000 W."},
  {q:"A metallic cylinder is placed in a uniform magnetic field with its axis parallel to the field. If the field changes with time, induced current in the cylinder is:",
   opts:["A. along its axis","B. circular inside","C. no current will be induced","D. along surface only"],ans:"C",key:"Cylinder axis parallel to B; flux through any loop perpendicular to axis is zero → no change → no induced current."},
  {q:"An electromagnetic wave propagating along x-axis has equation E = E₀cos(kx−ωt). Direction of propagation is:",
   opts:["A. +x̂","B. −x̂","C. ŷ","D. ẑ"],ans:"A",key:"Direction of EM wave propagation is along +x̂ (given by k direction in kx−ωt)."},
  {q:"Which of the following cannot be explained by Huygens' wave theory of light?",
   opts:["A. Reflection","B. Refraction","C. Interference","D. Origin of spectra"],ans:"D",key:"Huygens' principle explains reflection, refraction, interference, diffraction — but NOT origin of spectra (needs quantum theory)."},
  {q:"A distant star sends light to Earth. The wavefront reaching Earth is:",
   opts:["A. Spherical","B. Cylindrical","C. Plane","D. Elliptical"],ans:"C",key:"Star is so far that wavefront is essentially plane by the time it reaches Earth."},
  {q:"The binding energy per nucleon is maximum for nuclei near iron (Fe-56). This means these nuclei:",
   opts:["A. undergo spontaneous fission","B. are most tightly bound","C. are least stable","D. cannot participate in nuclear reactions"],ans:"B",key:"Maximum binding energy per nucleon = maximum stability = most tightly bound nuclei."},
  {q:"A superconducting ball cooled below critical temperature in a magnetic field. On removing field, ball will:",
   opts:["A. attract the bar magnet","B. repel the bar magnet","C. show no interaction","D. align with field"],ans:"D",key:"Below Tc ball becomes diamagnetic superconductor — it repels and moves away from magnet, opposite to bar magnet direction."},
  {q:"In a Wheatstone bridge with arms 2Ω,3Ω,4Ω,6Ω and a 5Ω galvanometer, battery 18V. Current from battery:",
   opts:["A. 5:3","B. 5 A","C. 3 A","D. 2 A"],ans:"B",key:"Bridge balanced (2/4=3/6=½). 5Ω ineffective. R_AB = 6×9/(6+9) = 18/5. I = 18/(18/5) = 5 A."},
  {q:"Resistances R₁ and R₂ dissipate power P₁=60W and P₂=100W from same supply. R₁:R₂ =",
   opts:["A. 5:3","B. 3:5","C. 6:10","D. 1:1"],ans:"A",key:"R = V²/P, so R₁/R₂ = P₂/P₁ = 100/60 = 5:3."},
  {q:"The size of a nucleus is about 10⁻¹⁵ m. If a football (22 cm radius) represents the nucleus, size of atom would be:",
   opts:["A. 2.2 km","B. 22 km","C. 220 km","D. 2200 km"],ans:"B",key:"Atom/nucleus ratio ~10⁵. 0.22 m × 10⁵ = 22,000 m = 22 km."},
  {q:"A circular loop of radius 0.1 m carries current 5 A. Magnetic field at centre:",
   opts:["A. 2π μT","B. π μT","C. 5π μT","D. 10π μT"],ans:"C",key:"B = μ₀I/2R = (4π×10⁻⁷ × 5)/(2×0.1) = 5π×10⁻⁶ T = 5π μT."},
  {q:"[A-R Q13] A: Most of the α particles pass undeflected through gold foil. R: Most of the space in atom is empty.",
   opts:["A. Both A and R true, R explains A","B. Both true, R not correct explanation","C. A true R false","D. A false R true"],ans:"B",key:"Both statements are true, but R (space is empty due to tiny nucleus) is not the correct explanation for A — R states a fact but doesn't fully explain WHY particles pass through."},
  {q:"[A-R Q14] A: A convex lens submerged in water has greater focal length. R: Lens formula uses relative refractive index.",
   opts:["A. Both A and R true, R explains A","B. Both true, R not correct explanation","C. A true R false","D. A false R true"],ans:"A",key:"Both true, R correctly explains A: in water relative μ decreases, so power decreases, focal length increases."},
  {q:"[A-R Q15] A: In YDSE, decreasing slit separation increases fringe width. R: Fringe width is directly proportional to slit separation.",
   opts:["A. Both A and R true, R explains A","B. Both true, R not correct explanation","C. A true R false","D. A false R true"],ans:"C",key:"A is true (β = λD/d, d↓ → β↑). R is false (β is INVERSELY proportional to d)."},
  {q:"[A-R Q16] A: Net electric field inside a conductor is zero. R: Electrons in a conductor are always stationary.",
   opts:["A. Both A and R true, R explains A","B. Both true, R not correct explanation","C. A true R false","D. A false R true"],ans:"D",key:"A is false (field inside conductor is zero when in equilibrium, not always). R is false (electrons move freely due to thermal energy)."},
];

const SEC_B_Qs = [
  {q:"An EM wave has frequency ν = 10¹⁸ Hz and travels in vacuum. Find: (i) refractive index of medium if speed is 2×10⁸ m/s, (ii) angular frequency ω.",
   ans:"(i) μ = c/v = 3×10⁸/2×10⁸ = 1.5\n(ii) ω = 2πν = 2π×10¹⁸ rad/s; frequency corresponds to X-ray range.",marks:2},
  {q:"Distinguish between path of free electrons in a conductor (a) with electric field applied, (b) without electric field.",
   ans:"(a) With E-field: electrons drift opposite to E (superimposed on random motion) → net current flows.\n(b) Without E-field: purely random thermal motion; no net displacement → no current.",marks:2},
  {q:"Two equal positive charges +q are placed at distance d apart. Find potential and work done to bring charge +q from infinity to midpoint.",
   ans:"V = 2kq/(d/2) = 4kq/d.\nW = qV = 4kq²/d.",marks:2},
  {q:"Relative permeability of a material is 800. Identify type and state any two properties.",
   ans:"Type: Ferromagnetic (μr >> 1).\nProperties: (1) Strongly attracted by magnetic field. (2) Can retain magnetism after field removed (hysteresis).",marks:2},
  {q:"An AC source with frequency 50 Hz is connected to an inductor. If current lags voltage by 90°, explain why? Find reactance if L = 2 H.",
   ans:"In pure inductor, current lags voltage by 90° due to back-emf opposing change in current.\nX_L = 2πfL = 2π×50×2 = 200π ≈ 628 Ω.",marks:2},
];

const SEC_C_Qs = [
  {q:"(i) Compare electrical conductivity of metals, insulators and semiconductors based on band theory. (ii) Explain why diamond is insulator but tin is conductor though both are Group 14.",
   ans:"Metals: Overlapping/partially filled conduction band → free electrons → high conductivity.\nInsulators: Large band gap (>5 eV) → negligible thermal excitation → poor conductivity.\nSemiconductors: Moderate band gap (~1 eV) → some carriers at room temp → intermediate conductivity.\nDiamond: Very large band gap (~5.4 eV) → insulator. Tin: Metallic bonding, overlapping bands → conductor.",marks:3},
  {q:"Internal resistance of a car battery decreases with temperature. Explain: (i) why car starts easily on warm day, (ii) why even small currents from mains can be fatal, (iii) why temperature of heater element becomes constant.",
   ans:"(i) Warm day: lower internal resistance → larger current → easier engine starting.\n(ii) Human body is sensitive to currents as low as a few mA → even small mains current is dangerous.\n(iii) At steady state, rate of heat production = rate of heat loss to surroundings → temperature constant.",marks:3},
  {q:"Calculate binding energy and binding energy per nucleon for oxygen-16. (m_p=1.00727u, m_n=1.00866u, m_O=15.99493u, 1u=931.5 MeV)",
   ans:"Z=8, N=8. Mass of constituents = 8(1.00727)+8(1.00866) = 8.05816+8.06928 = 16.12744 u.\nMass defect Δm = 16.12744−15.99493 = 0.13251 u.\nBE = 0.13251×931.5 ≈ 123.4 MeV.\nBE/nucleon = 123.4/16 ≈ 7.71 MeV.",marks:3},
  {q:"Find critical angle for diamond (μ=2.42). A ray hits a face at 30°. Will it undergo total internal reflection? Also explain why diamond sparkles.",
   ans:"θ_c = sin⁻¹(1/2.42) < sin⁻¹(0.413) ≈ 24.4°.\nIncident angle 30° > θ_c → Total Internal Reflection occurs.\nDiamond is cut so light undergoes multiple TIR internally before exiting — causing sparkle.",marks:3},
  {q:"State Huygens' principle. Use it to derive Snell's law of refraction.",
   ans:"Huygens' Principle: Every point on a wavefront is a source of secondary wavelets; new wavefront is tangent to these wavelets.\nDerivation: Let AB hit boundary. A reaches medium 2, point B still in medium 1. In time t: B→C (v₁t), A→E (v₂t). Refracted wavefront CE.\nsin i = BC/AC = v₁t/AC; sin r = AE/AC = v₂t/AC.\nsin i/sin r = v₁/v₂ = n₂/n₁ → n₁ sin i = n₂ sin r (Snell's Law).",marks:3},
  {q:"An ammeter reads up to 750 mA; galvanometer has Ig=100 mA, G=13 Ω. (i) Find shunt resistance. (ii) Why is the frame of a galvanometer made of metal?",
   ans:"(i) S = IgG/(I−Ig) = 100×13/(750−100) = 1300/650 = 2 Ω.\n(ii) Metal frame provides electromagnetic damping — eddy currents in frame oppose coil oscillation → quick settling.",marks:3},
  {q:"A solenoid: N turns, area A, length l. Find (i) Inductance L. If N→5N, A→25A, l→5l, find new inductance.",
   ans:"L = μ₀N²A/l.\nL' = μ₀(5N)²(25A)/(5l) = μ₀×25N²×25A/(5l) = 125×μ₀N²A/l = 125L.",marks:3},

  {q:"[CBQ] Polymer Semiconductor Wearables\nA startup designs flexible wearable patches using polymer semiconductors. The device must operate with minimal power and withstand bending.\n(i) What property makes these devices low power? [1m]\n(ii) Why is diamond NOT used as semiconductor in such devices? [1m]\n(iii) In intrinsic polymer semiconductor, compare number of electrons and holes. [1m]\n(iv) Explain role of majority and minority carriers in polymer semiconductor conductivity. [4m — extended]",

// ── PAPER BUILDER ─────────────────────────────────────────────────
function pick(arr, offset, n){
  const out=[];
  for(let i=0;i<n;i++) out.push(arr[(offset+i)%arr.length]);
  return out;
}

function buildPaper(n){
  const o=n*3;
  return {
    secA: pick(SEC_A_MCQ, o%SEC_A_MCQ.length, 16),
    secB: pick(SEC_B_Qs, o%SEC_B_Qs.length, 5),
    secC: pick(SEC_C_Qs, o%SEC_C_Qs.length, 7),
    secD: pick(SEC_D_Qs, o%SEC_D_Qs.length, 2),
    secE: pick(SEC_E_Qs, o%SEC_E_Qs.length, 3),
  };
}

// ── RENDER ────────────────────────────────────────────────────────
let current=0;

function tog(btn,id){
  const box=document.getElementById(id);
  box.classList.toggle('show');
  btn.classList.toggle('open');
  btn.textContent=btn.classList.contains('open')?'Hide Answer':'Show Answer';
}

function renderPaper(n){
  current=n;
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active',i===n);
  });
  const p=buildPaper(n);
  const m=document.getElementById('main');
  let h=`<div class="pinfo">
    <span class="ptag">📄 Practice Paper ${n+1}</span>
    <span class="ptag">🕐 3 Hours</span>
    <span class="ptag">📊 70 Marks</span>
    <span class="ptag">❓ 33 Questions</span>
    <span class="ptag">📖 5 Sections</span>
  </div>`;

  // Section A
  h+=`<div class="sec"><div class="sechdr">
    <span class="secname">Section A</span>
    <span class="secdesc">Q1–16 · Multiple Choice · 1 mark each · 16 marks</span>
  </div><div class="qlist">`;
  p.secA.forEach((q,i)=>{
    const id=`p${n}a${i}`;
    h+=`<div class="qitem">
      <div class="qtext"><span class="qnum">${i+1}</span><span>${q.q}</span></div>
      <div class="opts">${q.opts.map(o=>`<div class="opt">${o}</div>`).join('')}</div>
      <div class="ans-wrap">
        <button class="ans-btn" onclick="tog(this,'${id}')">Show Answer</button>
        <div class="ans-box" id="${id}"><strong>Answer: ${q.ans}</strong><br>${q.key}</div>
      </div>
    </div>`;
  });
  h+=`</div></div>`;

  // Section B
  h+=`<div class="sec"><div class="sechdr">
    <span class="secname">Section B</span>
    <span class="secdesc">Q17–21 · Short Answer · 2 marks each · 10 marks</span>
  </div><div class="qlist">`;
  p.secB.forEach((q,i)=>{
    const id=`p${n}b${i}`;
    h+=`<div class="qitem">
      <div class="qtext"><span class="qnum">${17+i}</span><span>${q.q}</span>
        <span class="marks">[${q.marks}m]</span></div>
      <div class="ans-wrap">
        <button class="ans-btn" onclick="tog(this,'${id}')">Show Answer</button>
        <div class="ans-box" id="${id}">${q.ans.replace(/\n/g,'<br>')}</div>
      </div>
    </div>`;
  });
  h+=`</div></div>`;

  // Section C
  h+=`<div class="sec"><div class="sechdr">
    <span class="secname">Section C</span>
    <span class="secdesc">Q22–28 · Short Answer · 3 marks each · 21 marks</span>
  </div><div class="qlist">`;
  p.secC.forEach((q,i)=>{
    const id=`p${n}c${i}`;
    h+=`<div class="qitem">
      <div class="qtext"><span class="qnum">${22+i}</span><span>${q.q}</span>
        <span class="marks">[${q.marks}m]</span></div>
      <div class="ans-wrap">
        <button class="ans-btn" onclick="tog(this,'${id}')">Show Answer</button>
        <div class="ans-box" id="${id}">${q.ans.replace(/\n/g,'<br>')}</div>
      </div>
    </div>`;
  });
  h+=`</div></div>`;

  // Section D
  h+=`<div class="sec"><div class="sechdr">
    <span class="secname">Section D</span>
    <span class="secdesc">Q29–30 · Case-Based · 4 marks each · 8 marks</span>
  </div><div class="qlist">`;
  p.secD.forEach((q,i)=>{
    const id=`p${n}d${i}`;
    h+=`<div class="qitem">
      <div class="qtext"><span class="qnum">${29+i}</span><span style="white-space:pre-line">${q.q}</span>
        <span class="marks">[${q.marks}m]</span></div>
      <div class="ans-wrap">
        <button class="ans-btn" onclick="tog(this,'${id}')">Show Answer</button>
        <div class="ans-box" id="${id}">${q.ans.replace(/\n/g,'<br>')}</div>
      </div>
    </div>`;
  });
  h+=`</div></div>`;

  // Section E
  h+=`<div class="sec"><div class="sechdr">
    <span class="secname">Section E</span>
    <span class="secdesc">Q31–33 · Long Answer · 5 marks each · 15 marks (with OR choices)</span>
  </div><div class="qlist">`;
  p.secE.forEach((q,i)=>{
    const id=`p${n}e${i}`;
    const orid=`p${n}eo${i}`;
    h+=`<div class="qitem">
      <div class="qtext"><span class="qnum">${31+i}</span><span style="white-space:pre-line">${q.q}</span>
        <span class="marks">[${q.marks}m]</span></div>
      <div class="ans-wrap">
        <button class="ans-btn" onclick="tog(this,'${id}')">Show Answer</button>
        <div class="ans-box" id="${id}">${q.ans.replace(/\n/g,'<br>')}</div>
      </div>
      <div class="or-div">— OR —</div>
      <div class="qtext" style="margin-top:6px;padding-left:32px;font-size:.88rem;white-space:pre-line">${q.orq}</div>
      <div class="ans-wrap">
        <button class="ans-btn" onclick="tog(this,'${orid}')">Show OR Answer</button>
        <div class="ans-box" id="${orid}">${q.orans.replace(/\n/g,'<br>')}</div>
      </div>
    </div>`;
  });
  h+=`</div></div>`;

  m.innerHTML=h;
  window.scrollTo({top:0,behavior:'smooth'});
}

// ── INIT ──────────────────────────────────────────────────────────
const tabsEl=document.getElementById('tabs');
for(let i=0;i<15;i++){
  const btn=document.createElement('button');
  btn.className='tab'+(i===0?' active':'');
  btn.textContent=`Paper ${i+1}`;

}
renderPaper(0);

/* ── Tab bar bounce hint ── */
(function(){
  function initTabHint(rowId){
    var row = document.getElementById(rowId);
    if(!row) return;
    // Wrap in scroll-wrap div if not already wrapped
    if(!row.parentElement.classList.contains('tab-scroll-wrap')){
      var wrap = document.createElement('div');
      wrap.className = 'tab-scroll-wrap';
      row.parentNode.insertBefore(wrap, row);
      wrap.appendChild(row);
    }
    var wrap = row.parentElement;
    // Hide fade when scrolled to end
    row.addEventListener('scroll', function(){
      var atEnd = row.scrollLeft + row.clientWidth >= row.scrollWidth - 4;
      wrap.classList.toggle('at-end', atEnd);
    }, {passive:true});
    // One-time bounce nudge: scroll right 80px then back
    if(row.scrollWidth > row.clientWidth + 10){
      setTimeout(function(){
        row.scrollTo({left:row.scrollWidth, behavior:'smooth'});
        setTimeout(function(){
          row.scrollTo({left:0, behavior:'smooth'});
        }, 1800);
      }, 800);
    }
  }
  document.addEventListener('DOMContentLoaded', function(){
    initTabHint('mainTabs');   // resource pages
    initTabHint('toolTabs');   // resource pages second row
    initTabHint('tabs');       // practice paper pages
  });
})();
</script>
