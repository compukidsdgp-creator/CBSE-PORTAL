  {q:"Explain supervised, unsupervised, and reinforcement learning with one example each.",a:"Supervised Learning: Model learns from labelled data — each input has a correct output.\nExample: Email spam detection — emails labelled 'spam'/'not spam' train the model.\n\nUnsupervised Learning: Model finds hidden patterns in unlabelled data.\nExample: Customer segmentation — grouping customers by purchasing behaviour.\n\nReinforcement Learning: Agent learns by interacting with environment, receiving rewards for correct actions.\nExample: A game-playing AI like AlphaGo learning to win by playing thousands of games."},
  {q:"What is model evaluation? Explain any three evaluation metrics used for classification models.",a:"Model evaluation assesses how well a trained model performs on unseen data.\n\n1. Accuracy: (TP+TN)/Total — proportion of correct predictions. Useful for balanced datasets.\n2. Precision: TP/(TP+FP) — of all positively predicted cases, how many were actually positive. Important when false positives are costly.\n3. Recall (Sensitivity): TP/(TP+FN) — of all actual positive cases, how many were correctly identified. Important when false negatives are costly (e.g., disease detection)."},
  {q:"Describe Computer Vision. Explain the concepts of pixels, RGB images, and the role of convolution in image processing.",a:"Computer Vision enables machines to interpret visual information from images and videos.\n\nPixels: Smallest unit of a digital image. An image is a grid of pixels, each storing colour/intensity information.\n\nRGB Images: Each pixel stores three values — Red, Green, Blue — each ranging 0–255. These combine to produce any visible colour. A 100×100 RGB image has 30,000 values.\n\nConvolution: A mathematical operation where a small matrix (kernel) slides over the image, computing dot products. This extracts features like edges, corners, and textures. In CNNs, multiple convolutional layers extract increasingly complex features, enabling recognition of objects."},
  {q:"Explain Natural Language Processing (NLP). Describe the stages of NLP and the Bag-of-Words model.",a:"NLP is a branch of AI that enables machines to understand, interpret, and generate human language.\n\nStages of NLP:\n1. Lexical Analysis: Tokenisation — breaking text into words\n2. Syntactic Analysis: Analysing grammar and sentence structure\n3. Semantic Analysis: Understanding meaning of words and sentences\n4. Discourse Integration: Understanding meaning in context\n5. Pragmatic Analysis: Understanding intent and real-world context\n\nBag-of-Words (BoW) Model:\nRepresents text as word frequency vectors, ignoring grammar and word order.\nExample: 'AI is good. AI is powerful.' → {AI:2, is:2, good:1, powerful:1}\nUsed for text classification, sentiment analysis, spam detection.\nLimitation: Loses word order and context."},
  {q:"What is Artificial Intelligence? Explain its three domains with examples. Discuss the need for ethical AI.",a:"AI is the simulation of human intelligence processes by computer systems.\n\nThree Domains:\n1. Data/Statistical Learning: Pattern recognition from structured data. Example: Netflix recommendations.\n2. Computer Vision: AI interprets visual data. Example: Medical AI detecting cancer in X-rays.\n3. NLP: AI understands human language. Example: Google Translate.\n\nNeed for Ethical AI:\n- Bias: Biased training data leads to discriminatory decisions.\n- Privacy: AI systems collect massive amounts of personal data.\n- Accountability: Unclear who is responsible when AI makes errors.\n- Transparency: AI decisions must be explainable.\nEthical frameworks ensure AI is designed to be fair, transparent, accountable, and beneficial to all."},
  {q:"Explain Neural Networks. Describe the structure of a perceptron and how a neural network learns.",a:"A Neural Network is a computational model inspired by the biological brain, consisting of interconnected nodes that process information.\n\nPerceptron:\n- Takes multiple inputs (x₁, x₂, ..., xₙ)\n- Each input multiplied by a weight (w₁, w₂, ..., wₙ)\n- Computes weighted sum: Σ(wᵢ × xᵢ) + bias\n- Passes through activation function to produce output\n\nHow a Neural Network Learns:\n1. Forward Pass: Input data flows through layers\n2. Loss Calculation: Difference between predicted and actual output computed\n3. Backpropagation: Error propagated backward through the network\n4. Weight Update: Weights adjusted using gradient descent to minimise error\n5. Repeats over many epochs until acceptable accuracy is achieved"},
  {q:"Describe Model Evaluation. Why is it important? Explain the confusion matrix with an example.",a:"Model Evaluation determines if a trained AI model is reliable and ready for deployment. Crucial because a model that memorises training data (overfitting) will fail in real-world scenarios.\n\nConfusion Matrix: Table showing four outcomes for a binary classifier:\n         Predicted +    Predicted -\nActual +  TP            FN\nActual -  FP            TN\n\nExample: COVID test on 100 people (60 infected, 40 healthy):\nTP=55, FN=5, FP=8, TN=32\nAccuracy=(55+32)/100=87%\nPrecision=55/63=87.3%\nRecall=55/60=91.7% (more critical — missing infected person is dangerous)"},
  {q:"Discuss Computer Vision comprehensively. Explain image representation, feature extraction, and CNNs.",a:"Computer Vision enables computers to process visual data to perform tasks requiring human-level understanding.\n\nImage Representation:\n- Grayscale: 2D array (H×W), each pixel=0–255 brightness\n- RGB: 3D array (H×W×3), each pixel has R, G, B channels\n- Example: 640×480 RGB image = 921,600 values\n\nFeature Extraction: Identifying important visual attributes:\n- Low-level: Edges, corners, gradients\n- Mid-level: Shapes, textures, patterns\n- High-level: Objects, faces, scenes\n\nCNN Architecture:\nInput → [Conv + ReLU + Pooling] × N → Flatten → Fully Connected → Output\n1. Convolutional Layer: Applies learnable filters\n2. ReLU: Introduces non-linearity\n3. Pooling: Reduces spatial size\n4. Fully Connected: Final classification\n\nApplications: Image recognition, medical imaging, autonomous vehicles, quality control."},
  {q:"Describe NLP comprehensively. Explain its pipeline, challenges, and the Bag-of-Words model. Compare script bots and smart bots.",a:"NLP enables machines to understand and generate human language.\n\nNLP Pipeline:\n1. Text Collection: Gathering raw text\n2. Preprocessing: Tokenisation, lowercasing, stop word removal, stemming\n3. Feature Extraction: BoW, TF-IDF, Word Embeddings\n4. Modelling: Training ML/DL model\n5. Post-processing: Formatting output\n\nChallenges: Ambiguity ('Bank'), context ('I saw her duck'), sarcasm, idioms, multi-language complexity\n\nBag-of-Words Model:\nRepresents text as word frequency vectors.\nExample: Doc1='AI helps people', Doc2='People love AI'\nVocabulary={AI, helps, people, love}\nDoc1=[1,1,1,0], Doc2=[1,0,1,1]\nLimitation: Loses context and word order.\n\nScript Bot vs Smart Bot:\nScript Bot: Fixed decision trees, programmed responses, no learning.\nSmart Bot: Uses NLP/ML, learns from conversations, handles varied inputs."}

function pick(pool, offset, count, stride) {
  const result = [];
  for(let i=0;i<count;i++) result.push(pool[(offset + i*stride) % pool.length]);
  return result;
}

let cur = 0;

function buildChips(){
  const c = document.getElementById('chips');
  for(let i=0;i<15;i++){
    const b = document.createElement('button');
    b.className='chip'+(i===0?' active':'');
    b.textContent=`Paper ${i+1}`;
    b.onclick=()=>sel(i);
    c.appendChild(b);
  }
}

function sel(i){
  cur=i;
  document.querySelectorAll('.chip').forEach((c,j)=>c.classList.toggle('active',j===i));
  render(PAPERS[i]);
  window.scrollTo({top:0,behavior:'smooth'});
}

      return `<div class="kr" style="flex-direction:column;align-items:flex-start;margin-bottom:12px">
        <span class="kq">${prefix}${i+1}</span>
        <span class="ka" style="white-space:pre-wrap">${q.a}</span>
      </div>`;
    }
    return `<div class="kr"><span class="kq">${prefix}(${String.fromCharCode(97+i)})</span><span class="ka"><b>${q.a}</b></span></div>`;
  }).join('');
}

(function(){
  function initTabHint(rowId){
    var row = document.getElementById(rowId);
    if(!row) return;
    // Wrap in scroll-wrap div if not already wrapped
    if(!row.parentElement.classList.contains('tab-scroll-wrap')){
      var wrap = document.createElement('div');
      wrap.className = 'tab-scroll-wrap';
      row.parentNode.insertBefore(wrap, row);
      wrap.appendChild(row);
    }
    var wrap = row.parentElement;
    // Hide fade when scrolled to end
    row.addEventListener('scroll', function(){
      var atEnd = row.scrollLeft + row.clientWidth >= row.scrollWidth - 4;
      wrap.classList.toggle('at-end', atEnd);
    }, {passive:true});
    // One-time bounce nudge: scroll right 80px then back
    if(row.scrollWidth > row.clientWidth + 10){
      setTimeout(function(){
        row.scrollTo({left:row.scrollWidth, behavior:'smooth'});
        setTimeout(function(){
          row.scrollTo({left:0, behavior:'smooth'});
        }, 1800);
      }, 800);
    }
  }
  document.addEventListener('DOMContentLoaded', function(){
    initTabHint('mainTabs');   // resource pages
    initTabHint('toolTabs');   // resource pages second row
    initTabHint('tabs');       // practice paper pages
  });
})();
</script>
