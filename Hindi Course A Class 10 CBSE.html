    {q:"'उत्साह' कविता में बादल को क्या कहा गया है?",opts:["A. शांत","B. क्रांतिदूत","C. डरपोक","D. सोया हुआ"],ans:"B. क्रांतिदूत — सूर्यकांत त्रिपाठी 'निराला' ने 'उत्साह' में बादल को क्रांति का प्रतीक मानकर उसे क्रांतिदूत के रूप में संबोधित किया है।"},
  ]},
];
const lekhan=[
  {title:"लेखन खंड (Set 1)",patra:{q:"अपने मित्र को पत्र लिखिए जिसमें उसे परीक्षा की तैयारी के लिए उचित सुझाव दीजिए। (5 अंक)",ans:`परीक्षा भवन,\nनई दिल्ली,\n15 अक्तूबर 20XX\n\nप्रिय मित्र अनुज,\n   सप्रेम नमस्ते।\n   आशा है कि तुम सकुशल होगे। मुझे पता चला है कि बोर्ड परीक्षाएँ नजदीक हैं और तुम थोड़े चिंतित हो। मैं तुम्हें कुछ उपयोगी सुझाव देना चाहता हूँ।\n   सबसे पहले, एक सुव्यवस्थित समय-सारणी बनाओ। प्रतिदिन कम से कम 8-10 घंटे पढ़ाई करो। कठिन विषयों को सुबह पढ़ो जब मन ताजा हो। पिछले वर्षों के प्रश्नपत्र हल करना मत भूलो — इससे परीक्षा पैटर्न समझ आता है।\n   स्वास्थ्य का ध्यान रखो। पर्याप्त नींद लो, पौष्टिक भोजन करो। मोबाइल और सोशल मीडिया से दूर रहो। आत्मविश्वास बनाए रखो।\n   मुझे विश्वास है कि तुम सफल होगे।\n\nतुम्हारा मित्र,\nप्रिया`},
    nibandh:{q:"'जल है तो जीवन है' विषय पर 150-200 शब्दों में अनुच्छेद लिखिए। (5 अंक)",ans:`जल है तो जीवन है\n\nजल पृथ्वी पर जीवन का आधार है। बिना जल के किसी भी जीव का अस्तित्व संभव नहीं है। मानव शरीर का लगभग 70 प्रतिशत भाग जल से बना है। पेड़-पौधों को बढ़ने के लिए जल चाहिए। कृषि, उद्योग, और दैनिक जीवन — सभी में जल की अनिवार्यता है।\n\nपरंतु आज जल की उपलब्धता घटती जा रही है। नदियाँ प्रदूषित हो रही हैं। भूजल का अत्यधिक दोहन हो रहा है। जलवायु परिवर्तन के कारण वर्षा अनियमित हो गई है। कई राज्यों में गंभीर जल संकट उत्पन्न हो गया है।\n\nहमें जल संरक्षण के उपाय अपनाने होंगे। वर्षा जल का संचयन करना चाहिए। जल व्यर्थ नहीं बहाना चाहिए। वृक्षारोपण से जल स्तर बढ़ता है। 'एक बूंद बचाओ, एक जीवन बचाओ' की भावना से काम करना होगा।\n\nसंयुक्त राष्ट्र के अनुसार 2050 तक विश्व के अनेक देशों में गंभीर जल संकट होगा। अतः आज से ही जल बचाना हमारा कर्तव्य है।`}},
  {title:"लेखन खंड (Set 2)",patra:{q:"अपने विद्यालय के प्राचार्य को प्रार्थना-पत्र लिखिए जिसमें पुस्तकालय में नई पुस्तकें मँगाने की प्रार्थना हो। (5 अंक)",ans:`सेवा में,\nश्रीमान् प्राचार्य महोदय,\nकेन्द्रीय विद्यालय, नई दिल्ली।\n\nविषय: पुस्तकालय में नई पुस्तकें मँगाने हेतु प्रार्थना।\n\nमहोदय,\n   सविनय निवेदन है कि मैं आपके विद्यालय का दसवीं कक्षा का छात्र हूँ। हमारा विद्यालय पुस्तकालय बहुत अच्छा है परंतु उसमें अधिकांश पुस्तकें पुरानी हैं।\n   हम छात्र विज्ञान, गणित और साहित्य की नवीनतम पुस्तकें पढ़ना चाहते हैं। CBSE की नई पाठ्यपुस्तकें, प्रतियोगी परीक्षाओं की तैयारी की पुस्तकें और अच्छे उपन्यास भी आने चाहिए।\n   अतः आपसे विनम्र प्रार्थना है कि पुस्तकालय के लिए नई एवं उपयोगी पुस्तकें मँगाने की कृपा करें। इससे हम सभी छात्रों को बहुत लाभ होगा।\n\nआपका आज्ञाकारी छात्र,\nआदित्य कुमार\nकक्षा 10-A, क्रमांक 15\nदिनांक: 15 अक्तूबर 20XX`},
    nibandh:{q:"'आधुनिक जीवन में मोबाइल फोन: लाभ और हानियाँ' विषय पर 150-200 शब्दों में निबंध लिखिए। (5 अंक)",ans:`आधुनिक जीवन में मोबाइल फोन: लाभ और हानियाँ\n\nआज मोबाइल फोन हमारे जीवन का अभिन्न अंग बन गया है। इसके बिना जीवन की कल्पना भी कठिन लगती है।\n\nलाभ: मोबाइल ने संचार को बेहद आसान बना दिया है। दूर बैठे परिजनों से तुरंत बात हो सकती है। इंटरनेट के माध्यम से ज्ञान का असीमित भंडार उपलब्ध है। ऑनलाइन बैंकिंग, शॉपिंग, शिक्षा — सब मोबाइल पर उपलब्ध है। आपातकाल में तुरंत सहायता मिलती है।\n\nहानियाँ: अत्यधिक मोबाइल उपयोग से स्वास्थ्य पर बुरा प्रभाव पड़ता है। आँखें कमजोर होती हैं, नींद खराब होती है। बच्चे पढ़ाई छोड़कर गेम खेलते हैं। सोशल मीडिया की लत लग जाती है। साइबर अपराध और ऑनलाइन ठगी की समस्या बढ़ रही है।\n\nनिष्कर्ष: मोबाइल फोन एक उपकरण है — इसका सदुपयोग करना हमारे ऊपर है। सीमित और उद्देश्यपूर्ण उपयोग से यह वरदान है, अन्यथा अभिशाप।`}},
];
function pick(arr,o,n){const out=[];for(let i=0;i<n;i++)out.push(arr[(o+i)%arr.length]);return out;}
function buildPaper(n){const o=n%3;const v=n%3;const s=n%3;const l=n%2;
  return{title:`अभ्यास पत्र ${n+1}`,passage:passages[o],vyakaran:vyakaran[v],sahitya:sahitya[s],lekhan:lekhan[l]};}
const PAPERS=[];for(let i=0;i<15;i++)PAPERS.push(buildPaper(i));
let cur=0;
function tog(btn,id){btn.classList.toggle('open');const p=document.getElementById(id);if(p)p.classList.toggle('show');}
function qMCQ(q,n,ans){const id=`a_${n}`;return `<div class="q-block"><div class="q-num">प्र. ${n}</div><div class="q-text">${q}</div><div class="options">${ans.opts.map(o=>`<div class="opt">${o}</div>`).join('')}</div><button class="ans-btn" onclick="tog(this,'${id}')">▶ उत्तर देखें</button><div class="ans-panel" id="${id}"><div class="ans-label">उत्तर</div>${ans.ans}</div></div>`;}
function qText(q,n,ans,mk){const id=`at_${n}`;return `<div class="q-block"><div class="q-num">प्र. ${n} [${mk}]</div><div class="q-text">${q}</div><button class="ans-btn" onclick="tog(this,'${id}')">▶ उत्तर देखें</button><div class="ans-panel" id="${id}"><div class="ans-label">उत्तर</div><pre style="white-space:pre-wrap;font-family:'Noto Serif Devanagari',serif;font-size:.9rem;line-height:2">${ans}</pre></div></div>`;}
function renderPaper(n){
  const p=PAPERS[n];let qn=1;
  let mcqHtml=p.passage.mcq.map(m=>qMCQ(m.q,qn++,m)).join('');
  let vyaHtml=p.vyakaran.qs.map(m=>qMCQ(m.q,qn++,m)).join('');
  let sahHtml=p.sahitya.qs.map(m=>qMCQ(m.q,qn++,m)).join('');
  document.getElementById('paperDiv').innerHTML=`
    <div class="paper-hdr"><div class="paper-title">हिंदी कोर्स A — ${p.title}</div><div class="paper-meta">कोड 002 | 2026-27</div>
      <div class="meta-grid"><span>⏱ 3 घंटे</span><span>📝 बहुविकल्पीय + वर्णनात्मक</span><span>🎯 80 अंक</span></div></div>
    <div class="instr">खंड-क: अपठित गद्यांश (14 अंक) | खंड-ख: व्याकरण (16 अंक) | खंड-ग: पाठ्यक्रम साहित्य (30 अंक) | खंड-घ: लेखन (20 अंक)</div>
    <div class="section-card"><div class="section-hdr">📖 खंड-क: अपठित बोध — ${p.passage.title} (14 अंक)</div><div class="sec-body">
      <div class="passage-box"><strong>गद्यांश पढ़कर नीचे दिए प्रश्नों के उत्तर दीजिए:</strong><br><br>${p.passage.text}</div>
      ${mcqHtml}${qText(p.passage.short,qn++,p.passage.shortAns,'2 अंक')}</div></div>
    <div class="section-card sec-kha"><div class="section-hdr">✏️ खंड-ख: व्याकरण — ${p.vyakaran.title} (16 अंक)</div><div class="sec-body">${vyaHtml}</div></div>
    <div class="section-card sec-ga"><div class="section-hdr">📚 खंड-ग: पाठ्यक्रम साहित्य — ${p.sahitya.title} (30 अंक)</div><div class="sec-body">${sahHtml}</div></div>
    <div class="section-card sec-gha"><div class="section-hdr">🖊️ खंड-घ: लेखन — ${p.lekhan.title} (20 अंक)</div><div class="sec-body">
      ${qText(p.lekhan.patra.q,qn++,p.lekhan.patra.ans,'5 अंक')}
      ${qText(p.lekhan.nibandh.q,qn++,p.lekhan.nibandh.ans,'5 अंक')}</div></div>`;}
function loadPaper(n){cur=n;document.getElementById('pSel').value=n;renderPaper(n);window.scrollTo({top:0,behavior:'smooth'});}
function prev(){if(cur>0)loadPaper(cur-1);}
function next(){if(cur<14)loadPaper(cur+1);}
function toggleTheme(){const r=document.documentElement;r.setAttribute('data-theme',r.getAttribute('data-theme')==='dark'?'light':'dark');}
loadPaper(0);
</script>
