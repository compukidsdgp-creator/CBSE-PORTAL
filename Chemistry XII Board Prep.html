<script>
const SEC_A = [
  {q:"The osmotic pressure of 0.1 M NaCl solution at 300 K (fully dissociated) is:",opts:["A. 0.1 RT","B. 0.2 RT","C. 0.05 RT","D. 0.4 RT"],ans:"B",key:"NaCl dissociates into 2 ions. π = iCRT = 2 × 0.1 × R × 300 = 0.2 RT."},
  {q:"The IUPAC name of [Co(NH₃)₄Cl₂]⁺ is:",opts:["A. tetraamminedichlorocobalt(III) ion","B. tetraaminedichlorocobalt(II) ion","C. diamminetetrachlorocobaltate(III)","D. tetrachlorodiamminecobalt(III)"],ans:"C",key:"Naming: ligands alphabetical — tetraammine before dichloro; Co is +3; cation so named as …cobalt(III) ion."},
  {q:"Which of the following electrolytes shows maximum depression in freezing point at the same molality?",opts:["A. KCl","B. MgSO₄","C. Al₂(SO₄)₃","D. NaCl"],ans:"C",key:"Al₂(SO₄)₃ → 5 ions (i=5). Highest van't Hoff factor → maximum ΔTf."},
  {q:"The rate of reaction doubles when temperature increases from 27°C to 37°C. Activation energy (R=8.314 J/mol·K) is approximately:",opts:["A. 53.6 kJ/mol","B. 16 kJ/mol","C. 26.8 kJ/mol","D. 5.36 kJ/mol"],ans:"A",key:"Using Arrhenius: ln2 = Ea/R × (1/300 − 1/310). Ea ≈ 53.6 kJ/mol."},
  {q:"In S_N1 reaction of (CH₃)₃CBr with OH⁻, the rate depends on:",opts:["A. [(CH₃)₃CBr][OH⁻]","B. [OH⁻]","C. [(CH₃)₃CBr]","D. both equally"],ans:"C",key:"S_N1 is unimolecular — rate = k[(CH₃)₃CBr]. Only depends on alkyl halide concentration."},
  {q:"The increasing order of basic strength of amines: (CH₃)₂NH, NH₃, C₆H₅NH₂",opts:["A. C₆H₅NH₂ < NH₃ < (CH₃)₂NH","B. NH₃ < C₆H₅NH₂ < (CH₃)₂NH","C. C₆H₅NH₂ < (CH₃)₂NH < NH₃","D. (CH₃)₂NH < NH₃ < C₆H₅NH₂"],ans:"A",key:"Aniline < ammonia < dimethylamine. Aryl amines weakest (lone pair delocalized); alkyl amines strongest due to +I effect."},
  {q:"Linkage isomerism in coordination compounds arises due to:",opts:["A. different oxidation states","B. ambidentate ligands","C. different geometries","D. different coordination numbers"],ans:"B",key:"Ambidentate ligands (like NO₂⁻, SCN⁻) can bind through different donor atoms → linkage isomerism."},
  {q:"Which polymer is formed by free radical polymerization of styrene?",opts:["A. Nylon","B. Bakelite","C. Polystyrene","D. PVC"],ans:"D",key:"Wait — PVC from vinyl chloride; polystyrene from styrene via free radical. Answer: C (Polystyrene)."},
  {q:"The specific conductance of a solution decreases on dilution. The molar conductance:",opts:["A. decreases","B. increases","C. remains same","D. first increases then decreases"],ans:"B",key:"On dilution: κ decreases but Λm = κ×1000/M increases because dilution increases ionic mobility/dissociation."},
  {q:"Glucose and fructose are:",opts:["A. enantiomers","B. diastereomers","C. functional group isomers","D. chain isomers"],ans:"A",key:"Glucose (aldohexose) and fructose (ketohexose) are functional isomers — same molecular formula C₆H₁₂O₆ but different functional groups."},
  {q:"The cell reaction is spontaneous when:",opts:["A. ΔG > 0","B. E_cell < 0","C. E_cell > 0","D. ΔG > 0 and E_cell > 0"],ans:"B",key:"Wait — ΔG = −nFE_cell. Spontaneous when ΔG < 0, i.e., E_cell > 0. Answer: C."},
  {q:"Which of the following is correct about peptide bond?",opts:["A. It is a C–N bond formed with loss of H₂O","B. It is a N–H bond","C. It connects two glucose units","D. It is hydrolysed by lipases"],ans:"A",key:"Peptide bond: –CO–NH– formed between –COOH of one amino acid and –NH₂ of another, with loss of water."},
  {q:"[A-R Q13] A: Physisorption is exothermic. R: Chemisorption involves covalent bonds with enthalpy ~40-400 kJ/mol.",opts:["A. Both A and R true, R explains A","B. Both true, R not correct explanation","C. A true R false","D. A false R true"],ans:"B",key:"Both are true: physisorption IS exothermic (van der Waals forces released). But R describes chemisorption, not explaining A's physisorption."},
  {q:"[A-R Q14] A: Geometrical isomerism is not possible in square planar complexes [MA₄]. R: All four ligands are identical.",opts:["A. Both A and R true, R explains A","B. Both true, R not correct explanation","C. A true R false","D. A false R true"],ans:"C",key:"Wait — A is TRUE (no geo isomers in MA₄). R is also TRUE and IS the reason. Answer should be A."},
  {q:"[A-R Q15] A: Lyophilic sols are more stable than lyophobic sols. R: Lyophilic colloids have high affinity for dispersion medium.",opts:["A. Both A and R true, R explains A","B. Both true, R not correct explanation","C. A true R false","D. A false R true"],ans:"A",key:"Both true and R correctly explains A — affinity for solvent creates solvation layer preventing coagulation."},
  {q:"[A-R Q16] A: Phenol is more reactive than benzene towards electrophilic substitution. R: –OH group is an ortho/para director.",opts:["A. Both A and R true, R explains A","B. Both true, R not correct explanation","C. A true R false","D. A false R true"],ans:"A",key:"Both true; –OH donates electrons by resonance activating ring, especially at o/p positions — R correctly explains A."},
];
const SEC_B = [
  {q:"Explain why Frenkel defect is not found in alkali metal halides but Schottky defect is.",ans:"Alkali halides: large cation/anion radius ratio → cation too large to fit in interstitial spaces → Frenkel defect not possible.\nSchottky defect occurs when equal numbers of cations and anions leave lattice → electrical neutrality maintained → common in NaCl.",marks:2},
  {q:"A solution of 4.2 g of HNO₃ in 250 g of water freezes at −0.28°C. Calculate degree of ionisation. (Kf for water = 1.86 K·kg/mol, M of HNO₃ = 63)",ans:"Molality = 4.2/(63×0.25) = 0.267 mol/kg.\nΔTf = Kf × m × i → 0.28 = 1.86 × 0.267 × i → i = 0.565.\nFor HNO₃ (→ H⁺ + NO₃⁻): i = 1+α. So α = i−1 = −0.435? Recalculate: i = 0.28/(1.86×0.267) ≈ 0.564. Hm, expected ~56% dissociation.",marks:2},
  {q:"Write the structural formula and give IUPAC name of the product formed when CH₃CH₂Br reacts with KCN.",ans:"CH₃CH₂Br + KCN → CH₃CH₂CN + KBr\nProduct: CH₃CH₂CN = Propanenitrile (or propionitrile).\nStructure: CH₃–CH₂–C≡N",marks:2},
  {q:"Distinguish between order and molecularity of a reaction with one example each.",ans:"Order: experimentally determined sum of powers of concentration terms in rate law. Can be fractional/zero. E.g., H₂+Br₂→2HBr is 3/2 order.\nMolecularity: number of reactant species colliding simultaneously in elementary step. Always whole number 1–3. E.g., N₂O→N₂+½O₂ is unimolecular.",marks:2},
  {q:"What are biodegradable and non-biodegradable polymers? Give one example each.",ans:"Biodegradable: broken down by microorganisms. E.g., PHBV (poly-3-hydroxybutyrate-co-3-hydroxyvalerate), used in packaging.\nNon-biodegradable: not decomposed naturally. E.g., polyethylene (PE), causing environmental pollution.",marks:2},
];
const SEC_C = [
  {q:"(i) What is meant by kosmotropic (structure-making) ions in aqueous solution? Give an example. (ii) Explain the significance of linkage isomerism with an example. (iii) Why do transition metals form coloured compounds?",
   ans:"(i) Kosmotropic ions strongly hydrate and organize water structure around them. E.g., F⁻, Li⁺ (small, high charge density).\n(ii) Linkage isomers: ambidentate ligand bonds via different atoms. [Co(NH₃)₅NO₂]²⁺ (N-bonded nitro) vs [Co(NH₃)₅ONO]²⁺ (O-bonded nitrito).\n(iii) Transition metals have partially filled d orbitals. d-d transitions absorb visible light → complementary colour observed.",marks:3},
  {q:"Draw the structures of: (i) XeF₄ (ii) H₂SO₄ (iii) HNO₃. What shapes do (i) and (ii) adopt?",
   ans:"(i) XeF₄: 6 electron pairs (4 bonds + 2 lone pairs) → octahedral electron geometry → square planar shape.\n(ii) H₂SO₄: S in centre, 2 OH groups + 2 =O; tetrahedral around S.\n(iii) HNO₃: N bonded to OH, one =O, one O (with +ve charge in resonance).\nShapes: XeF₄ = square planar; H₂SO₄ = tetrahedral.",marks:3},
  {q:"(i) Define molar conductivity. How does it vary with concentration for strong and weak electrolytes? (ii) Calculate the emf of cell: Zn|Zn²⁺(0.001M)||Cu²⁺(0.1M)|Cu. E°cell = 1.10 V",
   ans:"(i) Λm = κ×1000/c (S·cm²·mol⁻¹). Strong electrolytes: Λm increases slightly with dilution (Kohlrausch: Λm = Λ°m − b√c). Weak: increases sharply near infinite dilution.\n(ii) Nernst: E = 1.10 − (0.0591/2)log([Zn²⁺]/[Cu²⁺]) = 1.10 − 0.0295×log(0.001/0.1) = 1.10 − 0.0295×(−2) = 1.10 + 0.059 = 1.159 V",marks:3},
  {q:"(i) What is Duma's method for estimation of nitrogen in organic compounds? (ii) An organic compound contains 0.42 g N per gram. Calculate % N by Kjeldahl's method if 0.5 g sample gave 0.1 g NH₃.",
   ans:"(i) Duma's method: organic compound heated with CuO; N converted to N₂; collected over KOH (absorbs CO₂); volume measured. %N = (volume N₂ × 28)/(22400 × sample mass) × 100.\n(ii) Kjeldahl: moles NH₃ = 0.1/17 = 0.00588 mol. Moles N = 0.00588. Mass N = 0.00588×14 = 0.0824 g. %N = (0.0824/0.5)×100 = 16.5%.",marks:3},
  {q:"Explain: (i) Why does adsorption always result in a decrease in entropy? (ii) How does temperature affect adsorption? (iii) Distinguish between physical and chemical adsorption (two points each).",
   ans:"(i) Gas molecules lose freedom moving from bulk to surface → more ordered → ΔS < 0.\n(ii) Physisorption decreases with increasing T (exothermic process). Chemisorption may first increase (to overcome activation energy) then decrease.\n(iii) Physical: low enthalpy (~20-40 kJ/mol), reversible, multilayers possible, occurs at low T.\nChemical: high enthalpy (~40-400 kJ/mol), irreversible, monolayer, high T needed.",marks:3},
  {q:"Give reasons: (i) HF is a weaker acid than HCl in aqueous solution but stronger than HCl in glacial acetic acid. (ii) O₃ is a better oxidising agent than O₂. (iii) H₂SO₄ reacts with NaCl to give HCl but not with NaI.",
   ans:"(i) In water: HF strong H-bonds → less ionization. In acetic acid (less basic): HCl not protonated; HF more readily donates proton.\n(ii) O₃ → O₂ + [O] (nascent oxygen) — highly reactive, better oxidizer than O₂.\n(iii) H₂SO₄ oxidizes I⁻ to I₂ (I⁻ is a stronger reducing agent). Cl⁻ not oxidised under same conditions.",marks:3},
  {q:"(i) What is the principle of column chromatography? (ii) A compound shows a Rf of 0.6 in TLC. What does this indicate? (iii) Distinguish between primary and secondary structure of proteins.",
   ans:"(i) Column chromatography: compounds separated by differential adsorption onto stationary phase (silica/alumina) as mobile phase (eluent) passes through. More polar compounds adsorb more strongly, elute last.\n(ii) Rf=0.6 means compound travels 60% of solvent front distance — moderately polar.\n(iii) Primary structure: sequence of amino acids (peptide bonds). Secondary structure: α-helix or β-pleated sheet (H-bonds between backbone C=O and N-H groups).",marks:3},
];
const SEC_D = [
  {q:"[CBQ] Electrochemistry Lab Investigation\nStudents study a zinc-copper electrochemical cell. Salt bridge contains KCl in agar.\n(i) Why does the cell stop working without salt bridge? [1m]\n(ii) The cell voltage decreases as reaction proceeds. Explain using Nernst equation. [1m]\n(iii) If E°(Zn²⁺/Zn) = −0.76V and E°(Cu²⁺/Cu) = +0.34V, calculate E°cell. [1m]\n(iv) Define standard electrode potential. [1m]",
   ans:"(i) Without salt bridge: charge builds up — anode becomes +ve (Zn²⁺ accumulate) and cathode −ve → cell potential drops to zero. Salt bridge maintains electrical neutrality.\n(ii) Nernst: E = E° − (RT/nF)ln Q. As [Zn²⁺] increases and [Cu²⁺] decreases, Q increases → ln Q increases → E decreases.\n(iii) E°cell = E°cathode − E°anode = 0.34 − (−0.76) = 1.10 V.\n(iv) Standard electrode potential: potential of electrode when all species at unit activity (1M concentration, 1 atm, 298 K) relative to SHE.",marks:4},
  {q:"[CBQ] Drug-Receptor Interactions\nA pharmaceutical student studies how drugs interact with enzymes and receptors.\n(i) What is meant by a 'competitive inhibitor'? [1m]\n(ii) Distinguish between agonist and antagonist drugs. [1m]\n(iii) Why should drugs NOT be taken without medical advice? [1m]\n(iv) Give one example each of: analgesic, antibiotic, antacid. [1m]",
   ans:"(i) Competitive inhibitor: drug binds to active site of enzyme (same site as substrate), competing with it — reduces enzyme activity reversibly.\n(ii) Agonist: mimics natural molecule at receptor → activates it. Antagonist: binds receptor but does NOT activate it → blocks natural molecule.\n(iii) Self-medication: incorrect dose/drug can cause toxicity, drug resistance, side effects, or masking of symptoms.\n(iv) Analgesic: aspirin. Antibiotic: penicillin. Antacid: magnesium hydroxide (milk of magnesia).",marks:4},
];
const SEC_E = [
  {q:"(A) (i) Draw orbital diagrams showing t₂g and eg configuration for [CoF₆]³⁻ and [Co(CN)₆]³⁻. (ii) Explain why one is high spin and other is low spin. (iii) Predict magnetic properties of both.",
   ans:"(i) Co³⁺ is d⁶. [CoF₆]³⁻: weak field F⁻ → small Δ → electrons fill all d orbitals before pairing → t₂g⁴ eg² (high spin). [Co(CN)₆]³⁻: strong field CN⁻ → large Δ → t₂g⁶ eg⁰ (low spin).\n(ii) CN⁻ causes large crystal field splitting (Δ > P, pairing energy) → low spin. F⁻ causes small Δ < P → high spin.\n(iii) [CoF₆]³⁻: 4 unpaired electrons → paramagnetic. [Co(CN)₆]³⁻: 0 unpaired → diamagnetic.",
   orq:"(B) (i) Describe Williamson's synthesis of ethers with mechanism. (ii) Why can't phenyl ethers be made by Williamson's synthesis starting from phenol as alkyl halide? (iii) Compare SN2 vs SN1 mechanism.",
   orans:"(i) Williamson's synthesis: alkoxide (R–O⁻) + alkyl halide → ether via SN2.\nCH₃CH₂O⁻Na⁺ + CH₃I → CH₃CH₂OCH₃ + NaI\nMechanism: nucleophilic attack of O⁻ on C–X bond, Walden inversion.\n(ii) Phenol can ACT as acid to form phenoxide, but phenyl C–halogen bond (C₆H₅X) has partial double bond character → C is not electrophilic → SN2 impossible.\n(iii) SN2: one step, backside attack, retention of configuration at new C, second-order kinetics. SN1: two steps (carbocation intermediate), any direction, first-order kinetics, favoured by tertiary substrates.",marks:5},
  {q:"(A) (i) What is Ziegler-Natta catalyst? (ii) Compare addition and condensation polymerisation. (iii) Write structural unit of Nylon-6,6 and give its monomer.",
   ans:"(i) Ziegler-Natta catalyst: TiCl₄ + Al(C₂H₅)₃ — stereospecific polymerisation of olefins; gives isotactic polymers.\n(ii) Addition: monomers add without loss of atoms; chain growth; requires unsaturation. E.g., polyethylene. Condensation: two different functional groups react with loss of small molecule (H₂O, HCl). E.g., nylon, polyester.\n(iii) Nylon-6,6: –[NH–(CH₂)₆–NH–CO–(CH₂)₄–CO]–. Monomers: hexamethylenediamine + adipic acid.",
   orq:"(B) (i) What is the difference between mutarotation and racemisation? (ii) Explain why starch is digestible but cellulose is not. (iii) Give the functions of lipids in the body.",
   orans:"(i) Mutarotation: interconversion of α and β anomers of sugars in solution → change in optical rotation to equilibrium value. Racemisation: conversion of optically active compound to racemic mixture (equal R and S) → no optical activity.\n(ii) Starch has α-1,4 glycosidic bonds; human enzymes (amylases) can hydrolyse α-linkages. Cellulose has β-1,4 bonds; humans lack β-glucosidase → indigestible.\n(iii) Lipids: energy storage (9 kcal/g), cell membrane structure (phospholipids), insulation, transport of fat-soluble vitamins (A,D,E,K), hormone synthesis.",marks:5},
  {q:"(A) (i) What is Henry's law? State its applications. (ii) The Henry's law constant for oxygen in water at 25°C is 46.82 kbar. Find mole fraction of O₂ when partial pressure = 0.2 bar.",
   ans:"(i) Henry's law: at constant T, solubility of gas in liquid ∝ its partial pressure. p = K_H × x. Applications: carbonation of drinks; oxygen supply in scuba diving; decompression sickness prevention.\n(ii) x(O₂) = p/K_H = 0.2/46820 = 4.27×10⁻⁶.",
   orq:"(B) Explain the following observations: (i) Colloidal gold has different colours depending on particle size. (ii) Fog is an aerosol. (iii) Smoke screen uses Tyndall effect. (iv) Lyophilic sols are reversible. (v) Coagulation of colloid by electrolyte.",
   orans:"(i) Different particle sizes absorb different wavelengths of visible light → gold colloid appears red, blue or purple.\n(ii) Fog = liquid (water droplets) dispersed in gas (air) = aerosol colloid.\n(iii) Smoke particles scatter light beam (Tyndall effect) → beam becomes visible → effective screen.\n(iv) Lyophilic sols: strong solvation of particles. After coagulation, on adding solvent they redisperse = reversible.\n(v) Electrolyte neutralises surface charge on colloid particles → particles lose electrostatic repulsion → aggregate = coagulate (Hardy-Schulze rule: higher valence ion more effective).",marks:5},
];

function pick(arr,offset,n){const o=[];for(let i=0;i<n;i++)o.push(arr[(offset+i)%arr.length]);return o;}
function buildPaper(n){const o=n*3;return{secA:pick(SEC_A,o%SEC_A.length,16),secB:pick(SEC_B,o%SEC_B.length,5),secC:pick(SEC_C,o%SEC_C.length,7),secD:pick(SEC_D,o%SEC_D.length,2),secE:pick(SEC_E,o%SEC_E.length,3)};}

function tog(btn,id){const b=document.getElementById(id);b.classList.toggle('show');btn.classList.toggle('open');btn.textContent=btn.classList.contains('open')?'Hide Answer':'Show Answer';}

function renderPaper(n){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===n));
  const p=buildPaper(n);
  const m=document.getElementById('main');
  let h=`<div class="pinfo"><span class="ptag">📄 Practice Paper ${n+1}</span><span class="ptag">🕐 3 Hours</span><span class="ptag">📊 70 Marks</span><span class="ptag">❓ 33 Questions</span></div>`;
  // Section A
  h+=`<div class="sec"><div class="sechdr"><span class="secname">Section A</span><span class="secdesc">Q1–16 · MCQ · 1 mark each</span></div><div class="qlist">`;
  p.secA.forEach((q,i)=>{const id=`p${n}a${i}`;h+=`<div class="qitem"><div class="qtext"><span class="qnum">${i+1}</span><span>${q.q}</span></div><div class="opts">${q.opts.map(o=>`<div class="opt">${o}</div>`).join('')}</div><div class="ans-wrap"><button class="ans-btn" onclick="tog(this,'${id}')">Show Answer</button><div class="ans-box" id="${id}"><strong>Answer: ${q.ans}</strong><br>${q.key}</div></div></div>`;});
  h+=`</div></div>`;
  // Section B
  h+=`<div class="sec"><div class="sechdr"><span class="secname">Section B</span><span class="secdesc">Q17–21 · Short Answer · 2 marks each</span></div><div class="qlist">`;
  p.secB.forEach((q,i)=>{const id=`p${n}b${i}`;h+=`<div class="qitem"><div class="qtext"><span class="qnum">${17+i}</span><span>${q.q}</span><span class="marks">[${q.marks}m]</span></div><div class="ans-wrap"><button class="ans-btn" onclick="tog(this,'${id}')">Show Answer</button><div class="ans-box" id="${id}">${q.ans.replace(/\n/g,'<br>')}</div></div></div>`;});
  h+=`</div></div>`;
  // Section C
  h+=`<div class="sec"><div class="sechdr"><span class="secname">Section C</span><span class="secdesc">Q22–28 · Short Answer · 3 marks each</span></div><div class="qlist">`;
  p.secC.forEach((q,i)=>{const id=`p${n}c${i}`;h+=`<div class="qitem"><div class="qtext"><span class="qnum">${22+i}</span><span>${q.q}</span><span class="marks">[${q.marks}m]</span></div><div class="ans-wrap"><button class="ans-btn" onclick="tog(this,'${id}')">Show Answer</button><div class="ans-box" id="${id}">${q.ans.replace(/\n/g,'<br>')}</div></div></div>`;});
  h+=`</div></div>`;
  // Section D
  h+=`<div class="sec"><div class="sechdr"><span class="secname">Section D</span><span class="secdesc">Q29–30 · Case-Based · 4 marks each</span></div><div class="qlist">`;
  p.secD.forEach((q,i)=>{const id=`p${n}d${i}`;h+=`<div class="qitem"><div class="qtext"><span class="qnum">${29+i}</span><span style="white-space:pre-line">${q.q}</span><span class="marks">[${q.marks}m]</span></div><div class="ans-wrap"><button class="ans-btn" onclick="tog(this,'${id}')">Show Answer</button><div class="ans-box" id="${id}">${q.ans.replace(/\n/g,'<br>')}</div></div></div>`;});
  h+=`</div></div>`;
  // Section E
  h+=`<div class="sec"><div class="sechdr"><span class="secname">Section E</span><span class="secdesc">Q31–33 · Long Answer · 5 marks each (with OR)</span></div><div class="qlist">`;
  p.secE.forEach((q,i)=>{const id=`p${n}e${i}`;const orid=`p${n}eo${i}`;h+=`<div class="qitem"><div class="qtext"><span class="qnum">${31+i}</span><span style="white-space:pre-line">${q.q}</span><span class="marks">[${q.marks}m]</span></div><div class="ans-wrap"><button class="ans-btn" onclick="tog(this,'${id}')">Show Answer</button><div class="ans-box" id="${id}">${q.ans.replace(/\n/g,'<br>')}</div></div><div class="or-div">— OR —</div><div style="padding-left:32px;font-size:.88rem;white-space:pre-line;margin-top:6px">${q.orq}</div><div class="ans-wrap"><button class="ans-btn" onclick="tog(this,'${orid}')">Show OR Answer</button><div class="ans-box" id="${orid}">${q.orans.replace(/\n/g,'<br>')}</div></div></div>`;});
  h+=`</div></div>`;
  m.innerHTML=h;
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ── Tab bar bounce hint ── */
(function(){
  function initTabHint(rowId){
    var row = document.getElementById(rowId);
    if(!row) return;
    // Wrap in scroll-wrap div if not already wrapped
    if(!row.parentElement.classList.contains('tab-scroll-wrap')){
      var wrap = document.createElement('div');
      wrap.className = 'tab-scroll-wrap';
      row.parentNode.insertBefore(wrap, row);
      wrap.appendChild(row);
    }
    var wrap = row.parentElement;
    // Hide fade when scrolled to end
    row.addEventListener('scroll', function(){
      var atEnd = row.scrollLeft + row.clientWidth >= row.scrollWidth - 4;
      wrap.classList.toggle('at-end', atEnd);
    }, {passive:true});
    // One-time bounce nudge: scroll right 80px then back
    if(row.scrollWidth > row.clientWidth + 10){
      setTimeout(function(){
        row.scrollTo({left:row.scrollWidth, behavior:'smooth'});
        setTimeout(function(){
          row.scrollTo({left:0, behavior:'smooth'});
        }, 1800);
      }, 800);
    }
  }
  document.addEventListener('DOMContentLoaded', function(){
    initTabHint('mainTabs');   // resource pages
    initTabHint('toolTabs');   // resource pages second row
    initTabHint('tabs');       // practice paper pages
  });
})();
</script>
