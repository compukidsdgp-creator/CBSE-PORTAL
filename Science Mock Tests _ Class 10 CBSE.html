.chem-ans .ans-label{color:var(--chem);}

.choice-note{font-style:italic;color:var(--gold);font-size:.8rem;margin-top:4px;}
footer{text-align:center;padding:24px;color:var(--muted);font-size:.8rem;border-top:1px solid var(--border);margin-top:20px;}

<script>
// ===== BIOLOGY POOL =====
const bioMCQ=[
  {q:"Which of the following is the correct sequence of events in photosynthesis?",opts:["Light reactions → Carbon fixation → Calvin cycle","Carbon fixation → Light reactions → Calvin cycle","Light reactions → Calvin cycle → Carbon fixation","Calvin cycle → Light reactions → Carbon fixation"],ans:"A. Light reactions → Carbon fixation → Calvin cycle",type:"mcq"},
  {q:"A student observed a cell under a microscope and noticed a large central vacuole. The cell is most likely from:",opts:["A. Animal muscle tissue","B. Plant leaf epidermis","C. Human blood","D. Bacterial colony"],ans:"B. Plant leaf epidermis — plant cells have large central vacuoles for storage and maintaining turgor pressure.",type:"mcq"},
  {q:"In Mendel's experiments, when a tall pea plant (TT) was crossed with a dwarf plant (tt), the F1 generation showed only tall plants. This is due to:",opts:["A. Incomplete dominance","B. Law of dominance","C. Law of segregation","D. Multiple alleles"],ans:"B. Law of dominance — the tall allele (T) is completely dominant over the dwarf allele (t).",type:"mcq"},
  {q:"Assertion (A): The stomata open during the day and close at night in most plants.\nReason (R): Guard cells lose water and become flaccid in the presence of light.",opts:["A. Both A and R are true; R is correct explanation","B. Both A and R are true; R is not correct explanation","C. A is true but R is false","D. A is false but R is true"],ans:"C. A is true but R is false — Guard cells gain water (become turgid) in light, causing stomata to open; they lose water (become flaccid) in darkness, causing closure.",type:"ar"},
  {q:"Which hormone is responsible for 'fight or flight' response in humans?",opts:["A. Insulin","B. Thyroxine","C. Adrenaline","D. Testosterone"],ans:"C. Adrenaline — secreted by adrenal glands during stress, increasing heart rate and blood flow to muscles.",type:"mcq"},
  {q:"The process by which an organism produces offspring similar to itself is called:",opts:["A. Regeneration","B. Reproduction","C. Budding","D. Binary fission"],ans:"B. Reproduction — the fundamental process by which organisms produce offspring of the same species.",type:"mcq"},
  {q:"Assertion (A): Variations are essential for the process of evolution.\nReason (R): Variations help species to adapt to changing environmental conditions.",opts:["A. Both A and R are true; R is correct explanation","B. Both A and R are true; R is not correct explanation","C. A is true but R is false","D. A is false but R is true"],ans:"A. Both A and R are true; R is the correct explanation — Variations provide raw material for natural selection, enabling adaptation to new environments.",type:"ar"},
  {q:"In the human digestive system, where does the digestion of proteins primarily begin?",opts:["A. Mouth","B. Oesophagus","C. Stomach","D. Small intestine"],ans:"C. Stomach — pepsin (activated from pepsinogen in acidic medium) begins protein digestion in the stomach.",type:"mcq"},
  {q:"Which of the following correctly represents the flow of energy in a food chain?",opts:["A. Decomposers → Producers → Consumers","B. Producers → Primary consumers → Secondary consumers","C. Secondary consumers → Primary consumers → Producers","D. Consumers → Decomposers → Producers"],ans:"B. Producers → Primary consumers → Secondary consumers — energy flows from autotrophs to heterotrophs.",type:"mcq"},
  {q:"The diagram shows a cross-section of the human heart. Which chamber pumps oxygenated blood to the body?",opts:["A. Right atrium","B. Right ventricle","C. Left atrium","D. Left ventricle"],ans:"D. Left ventricle — has thickest walls and pumps oxygenated blood through the aorta to the entire body.",type:"mcq"},
  {q:"Assertion (A): Binary fission in Amoeba results in two daughter cells identical to the parent.\nReason (R): Binary fission is a type of sexual reproduction.",opts:["A. Both A and R are true; R is correct explanation","B. Both A and R are true; R is not correct explanation","C. A is true but R is false","D. A is false but R is true"],ans:"C. A is true but R is false — Binary fission produces identical offspring, but it is asexual reproduction, not sexual.",type:"ar"},
  {q:"Which of the following is NOT a function of the human kidney?",opts:["A. Filtration of blood","B. Regulation of blood pH","C. Production of digestive enzymes","D. Excretion of urea"],ans:"C. Production of digestive enzymes — this is a function of the pancreas and other digestive glands, not the kidney.",type:"mcq"},
  {q:"A green leaf contains chlorophyll. When tested with iodine solution after keeping in sunlight, it turns blue-black. This shows:",opts:["A. Presence of protein","B. Presence of starch","C. Presence of fat","D. Presence of glucose"],ans:"B. Presence of starch — iodine solution (I₂-KI) turns blue-black in the presence of starch, confirming photosynthesis occurred.",type:"mcq"},
  {q:"The sex of a child is determined by:",opts:["A. The egg of the mother","B. The sperm of the father","C. Both egg and sperm equally","D. Environmental factors after birth"],ans:"B. The sperm of the father — sperm carries either X or Y chromosome; XX = female, XY = male.",type:"mcq"},
  {q:"Assertion (A): The human brain is protected by the cranium.\nReason (R): The spinal cord is enclosed within the vertebral column.",opts:["A. Both A and R are true; R is correct explanation","B. Both A and R are true; R is not correct explanation","C. A is true but R is false","D. A is false but R is true"],ans:"B. Both A and R are true; R is not the correct explanation — both statements are independently true but one doesn't explain the other.",type:"ar"},
  {q:"Which part of the nephron is responsible for selective reabsorption of useful substances?",opts:["A. Bowman's capsule","B. Glomerulus","C. Renal tubule","D. Collecting duct only"],ans:"C. Renal tubule — glucose, amino acids, water, and salts are selectively reabsorbed in the tubule.",type:"mcq"},
  {q:"In a food web, if all the snakes are removed, which of the following is most likely to happen?",opts:["A. Frog population decreases","B. Grass population decreases","C. Rat population increases rapidly","D. Eagle population increases"],ans:"C. Rat population increases rapidly — snakes prey on rats; removal of predator causes prey population boom.",type:"mcq"},
  {q:"Assertion (A): Vegetative propagation can produce plants identical to the parent plant.\nReason (R): Vegetative propagation involves the fusion of gametes.",opts:["A. Both A and R are true; R is correct explanation","B. Both A and R are true; R is not correct explanation","C. A is true but R is false","D. A is false but R is true"],ans:"C. A is true but R is false — Vegetative propagation is asexual; it does NOT involve fusion of gametes.",type:"ar"},
  {q:"The oxygen released during photosynthesis comes from:",opts:["A. CO₂","B. H₂O","C. Glucose","D. Chlorophyll"],ans:"B. H₂O — water molecules are split (photolysis) during the light reaction, releasing O₂.",type:"mcq"},
  {q:"Which of the following diseases is caused by a protozoan?",opts:["A. Tuberculosis","B. Malaria","C. Cholera","D. Pneumonia"],ans:"B. Malaria — caused by Plasmodium (a protozoan), transmitted by female Anopheles mosquito.",type:"mcq"},
  {q:"Assertion (A): The human immune system provides protection against pathogens.\nReason (R): Antibodies are proteins that recognise and neutralise specific antigens.",opts:["A. Both A and R are true; R is correct explanation","B. Both A and R are true; R is not correct explanation","C. A is true but R is false","D. A is false but R is true"],ans:"A. Both A and R are true; R is the correct explanation — antibodies produced by B-lymphocytes specifically target and neutralise antigens from pathogens.",type:"ar"},
  {q:"Which process is used to separate cream from milk?",opts:["A. Filtration","B. Centrifugation","C. Distillation","D. Crystallisation"],ans:"B. Centrifugation — centrifugal force separates denser and less dense components; cream (less dense) separates from milk.",type:"mcq"},
];

const bioVSA=[
  {q:"Name the process by which plants lose water in the form of water vapour through leaves. Write one factor that affects this process.",ans:"Transpiration — factors: light intensity, temperature, humidity, wind speed, stomatal opening."},
  {q:"What is the function of lymph in the human body?",ans:"Lymph (tissue fluid) transports digested fats from lacteals; returns excess interstitial fluid to blood; carries immune cells (lymphocytes) to defend against infection."},
  {q:"Differentiate between aerobic and anaerobic respiration. Give one example of each.",ans:"Aerobic: requires O₂, complete oxidation of glucose, releases CO₂ + H₂O + ~38 ATP (e.g., human muscle cells). Anaerobic: no O₂, incomplete oxidation, releases less energy (e.g., yeast — produces ethanol + CO₂; muscle cells under stress — produces lactic acid)."},
  {q:"State one difference between pollination and fertilisation in plants.",ans:"Pollination: transfer of pollen grains from anther to stigma (same or different flower). Fertilisation: fusion of male gamete (from pollen) with female gamete (egg) in the ovule to form zygote."},
  {q:"Why is the flow of energy in a food chain unidirectional? Explain.",ans:"Energy flows from producers to consumers and is lost as heat at each trophic level (10% rule). Lost energy cannot return to producers; hence flow is unidirectional and non-recyclable, unlike matter."},
  {q:"What is meant by 'contraception'? Name any two methods of contraception.",ans:"Contraception: deliberate prevention of fertilisation/pregnancy. Methods: (i) Condom (barrier method) (ii) Oral contraceptive pills (hormonal) (iii) IUD (intrauterine device) (iv) Surgical methods — tubectomy/vasectomy."},
];

const bioSA=[
  {q:"(a) Draw a neat diagram of the human excretory system and label any two parts.\n(b) What is the role of the urinary bladder?",ans:"(a) Diagram should show: kidneys (paired), ureters, urinary bladder, urethra. Label: kidney, ureter (or bladder, urethra).\n(b) Urinary bladder: temporary storage of urine; muscular walls contract to expel urine through urethra during urination (micturition)."},
  {q:"With the help of a labelled diagram, explain the structure of a neuron. Why is the myelin sheath important?",ans:"Diagram: cell body (soma) with nucleus, dendrites (receive signals), axon (transmit signals away), myelin sheath (insulating layer of Schwann cells), nodes of Ranvier, synaptic terminals.\nMyelin sheath: insulates the axon, enables saltatory conduction (faster nerve impulse transmission), reduces energy expenditure."},
  {q:"Explain the process of double fertilisation in flowering plants. Why is it called 'double'?",ans:"Double fertilisation: Two male gametes from pollen tube reach embryo sac. One fuses with egg (n + n → 2n zygote → embryo). The other fuses with two polar nuclei (n + n + n → 3n primary endosperm nucleus → endosperm). Called 'double' because two acts of fertilisation occur simultaneously: syngamy + triple fusion."},
  {q:"(a) What are hormones? Name the hormone that regulates blood glucose level.\n(b) What happens when this hormone is not produced in sufficient quantity?",ans:"(a) Hormones: chemical messengers secreted by endocrine glands, transported by blood, regulate body functions. Insulin (from β-cells of islets of Langerhans in pancreas) regulates blood glucose.\n(b) Insufficient insulin → Diabetes mellitus. Blood glucose levels remain high (hyperglycaemia). Glucose excreted in urine. Symptoms: frequent urination, excessive thirst, fatigue, weight loss."},
];

const bioLA4=[
  {q:"(a) Draw a labelled diagram of the human digestive system.\n(b) Describe the role of the liver in digestion.\n(c) What is the function of villi in the small intestine?",ans:"(a) Diagram: mouth → oesophagus → stomach → small intestine (duodenum, jejunum, ileum) → large intestine → rectum → anus. Also show: liver, gallbladder, pancreas connected to duodenum.\n(b) Liver role: produces bile (stored in gallbladder); bile emulsifies fats (breaks large fat droplets into small ones for lipase action); helps absorb fat-soluble vitamins; detoxifies blood.\n(c) Villi: finger-like projections lining small intestine; increase surface area for absorption of digested nutrients; contain lacteals for fat absorption; rich capillary network for nutrient transport to blood."},

function pick(arr,o,n){const out=[];for(let i=0;i<n;i++)out.push(arr[(o+i)%arr.length]);return out;}

function buildPaper(n){
  const o=n*3;
  return {
    title:`Practice Paper ${n+1}`,
    // Biology: Q1-9 MCQ/AR, Q10-11 VSA(2m), Q12 VSA(2m), Q13-14 SA(3m), Q15 LA(4m), Q16 LA(5m)
    bioMCQ: pick(bioMCQ,o,9),
    bioVSA: pick(bioVSA,o,3),
    bioSA: pick(bioSA,o,2),
    bioLA4: pick(bioLA4,o,1),
    bioLA5: pick(bioLA5,o,1),
    // Chemistry: Q17-24 MCQ/AR(1m), Q25 VSA(2m), Q26-27 SA(3m), Q28 LA(4m), Q29 LA(5m)
    chemMCQ: pick(chemMCQ,o,8),
    chemVSA: pick(chemVSA,o,1),
    chemSA: pick(chemSA,o,2),
    chemLA4: pick(chemLA4,o,1),
    chemLA5: pick(chemLA5,o,1),
    // Physics: Q30-32 MCQ/AR(1m), Q33-34 VSA(2m), Q35-37 SA(3m), Q38 LA(4m), Q39 LA(5m)
    physMCQ: pick(physMCQ,o,3),
    physVSA: pick(physVSA,o,2),
    physSA: pick(physSA,o,3),
    physLA4: pick(physLA4,o,1),
    physLA5: pick(physLA5,o,1),
  };
}

function tog(btn,id){btn.classList.toggle('open');const p=document.getElementById(id);if(p)p.classList.toggle('show');}

function optHtml(q){
  if(!q.opts) return '';
  return `<div class="options">${q.opts.map(o=>`<div class="opt">${o}</div>`).join('')}</div>`;
}

function qBlock(q,num,type,sect,pfx){
  const id=`a_${pfx}_${num}`;
  const typeLabel=type==='mcq'?'MCQ':type==='ar'?'A&R':type==='vsa'?'VSA':type==='sa'?'SA':'LA';
  const typeCls=`type-${type}`;
  const ansCls=sect==='chem'?'chem-ans':sect==='phys'?'phys-ans':'';
  const ansLabel=sect==='bio'?'Answer (Biology)':sect==='chem'?'Answer (Chemistry)':'Answer (Physics)';
  const pre=q.q.includes('\n')?`<pre style="white-space:pre-wrap;font-family:inherit;font-size:.93rem;line-height:1.6">${q.q}</pre>`:`<div class="q-text">${q.q}</div>`;
  return `<div class="q-block">
    <div class="q-num">Q${num} <span class="q-type ${typeCls}">${typeLabel}</span></div>
    ${pre}
    ${optHtml(q)}
    <div class="q-mark">${type==='mcq'||type==='ar'?'[1 mark]':type==='vsa'?'[2 marks]':type==='sa'?'[3 marks]':type==='la4'?'[4 marks]':'[5 marks]'}</div>
    <button class="ans-btn" onclick="tog(this,'${id}')">▶ Show Answer</button>
    <div class="ans-panel ${ansCls}" id="${id}">
      <div class="ans-label">${ansLabel}</div>
      <pre style="white-space:pre-wrap;font-family:inherit;font-size:.88rem;line-height:1.6">${q.ans}</pre>
    </div>
  </div>`;
}

    p.bioLA4.map((q,i)=>qBlock(q,qn++,'la4','bio',`bio_la4_${i}`)).join('')+
    p.bioLA5.map((q,i)=>qBlock(q,qn++,'la5','bio',`bio_la5_${i}`)).join('');
  const chemQs=
    p.chemMCQ.map((q,i)=>qBlock(q,qn++,'mcq','chem',`chem_mcq_${i}`)).join('')+

    p.chemSA.map((q,i)=>qBlock(q,qn++,'sa','chem',`chem_sa_${i}`)).join('')+
    p.chemLA4.map((q,i)=>qBlock(q,qn++,'la4','chem',`chem_la4_${i}`)).join('')+
    p.chemLA5.map((q,i)=>qBlock(q,qn++,'la5','chem',`chem_la5_${i}`)).join('');
  const physQs=
    p.physMCQ.map((q,i)=>qBlock(q,qn++,'mcq','phys',`phys_mcq_${i}`)).join('')+

    p.physLA4.map((q,i)=>qBlock(q,qn++,'la4','phys',`phys_la4_${i}`)).join('')+

  document.getElementById('paperDiv').innerHTML=`

      <div class="paper-title">Class X Science — ${p.title}</div>
      <div class="paper-meta">Code 086 | 2026-27 Session</div>
      <div class="meta-grid">
        <span class="meta-item">⏱ 3 Hours</span>
        <span class="meta-item">📝 39 Questions</span>
        <span class="meta-item">🎯 80 Marks</span>
        <span class="meta-item">🔬 Biology + Chemistry + Physics</span>
      </div>
    </div>
    <div class="section-card sec-bio">
      <div class="section-hdr"><span class="sec-dot"></span>Section A — Biology (30 marks)</div>
      <div class="sec-body">${bioQs}</div>
    </div>
    <div class="section-card sec-chem">
      <div class="section-hdr"><span class="sec-dot"></span>Section B — Chemistry (26 marks)</div>
      <div class="sec-body">${chemQs}</div>
    </div>
    <div class="section-card sec-phys">
      <div class="section-hdr"><span class="sec-dot"></span>Section C — Physics (24 marks)</div>
      <div class="sec-body">${physQs}</div>
    </div>`;
}
