name: Weekly SEO report (Telegram)

on:
  schedule:
    - cron: '40 3 * * 1'      # Monday 9:10 AM IST
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install --quiet google-auth requests cryptography
      - name: Send the report
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY:             ${{ vars.GSC_PROPERTY }}
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SEO_REPORT_CHAT_ID:       ${{ secrets.SEO_REPORT_CHAT_ID }}
        run: python3 seo_weekly_report.py
