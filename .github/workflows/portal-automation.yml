name: Portal Automation Suite

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'       # 9:30 AM IST — daily news
    - cron: '30 4 * * 0'      # 10:00 AM IST Sunday — sitemap + stats rebuild
  workflow_dispatch:
    inputs:
      task:
        description: 'Task to run (all / news / sitemap / stats / og)'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  # ── 1. Daily CBSE News ──────────────────────────────────────────────────────
  daily-news:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'all' || github.event.inputs.task == 'news')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Fetch CBSE news → news.html
        run: python3 fetch_news.py && (python3 share_tags.py news.html || true)
      - name: Commit news.html
        run: |
          git config user.name  "cbse-bot"
          git config user.email "bot@cbsemock.org.in"
          git add news.html
          git diff --cached --quiet && exit 0
          git commit -m "chore: daily news $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do git pull -q --rebase --autostash origin main && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
      - name: Refresh Learn, reel, board and link-in-bio pages
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          pip install --quiet pillow || true
          python3 learn_pages.py || { echo "::warning::Learn pages were not refreshed"; exit 0; }
          python3 reels_page.py || echo "::warning::Reel pages were not refreshed"
          python3 formula_board_page.py || echo "::warning::Formula Board was not refreshed"
          python3 go_page.py || echo "::warning::Link-in-bio page was not refreshed"
          python3 favicon_tags.py || true
          python3 share_tags.py || true
          git add learn go why-reels formula-reels formula-board index.html chapters cbse-class-*.html
          git add -u -- '*.html' || true
          git diff --cached --quiet && exit 0
          git commit -q -m "chore: refresh Learn pages"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && exit 0; sleep 5; done

  # ── 2. Sitemap refresh ───────────────────────────────────────────────────────
  sitemap:
    runs-on: ubuntu-latest
    needs: daily-news
    if: always()
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }       # full history → accurate <lastmod>
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Refresh Weekly Focus SEO from current lesson
        run: python3 update_weekly_focus_seo.py
      - name: Regenerate sitemap.xml
        run: python3 gen_sitemap.py
      - name: Commit sitemap.xml
        run: |
          git config user.name  "cbse-bot"
          git config user.email "bot@cbsemock.org.in"
          git add sitemap.xml weekly-focus/weekly-focus-prod.html
          git diff --cached --quiet && exit 0
          git commit -q -m "chore: sitemap update $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do
            git pull --rebase --autostash -q origin main && git push -q origin main && exit 0
            sleep $((i * 5))
          done
          echo "::error::Could not push sitemap.xml"; exit 1

  # ── 3. Auto-stats update ─────────────────────────────────────────────────────
  stats:
    runs-on: ubuntu-latest
    needs: sitemap
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Scan portals → stats.json + update index.html
        run: python3 gen_stats.py
      - name: Commit stats
        run: |
          git config user.name  "cbse-bot"
          git config user.email "bot@cbsemock.org.in"
          git add stats.json index.html
          git diff --cached --quiet && exit 0
          git commit -m "chore: auto-stats update"
          for i in 1 2 3 4; do git pull -q --rebase --autostash origin main && git push -q && exit 0; sleep $((i * 5)); done
          exit 1

  # ── 4. OG meta injection (run on push when new portal added) ─────────────────
  og-cards:
    runs-on: ubuntu-latest
    needs: stats
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Inject OG meta into all resource pages
        run: python3 gen_og_cards.py
      - name: Commit OG updates
        run: |
          git config user.name  "cbse-bot"
          git config user.email "bot@cbsemock.org.in"
          git add resources/
          git diff --cached --quiet && exit 0
          git commit -m "chore: OG meta refresh"
          for i in 1 2 3 4; do git pull -q --rebase --autostash origin main && git push -q && exit 0; sleep $((i * 5)); done
          exit 1

  # ── 5. Telegram daily digest ─────────────────────────────────────────────────
  telegram-digest:
    runs-on: ubuntu-latest
    needs: daily-news
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Send daily digest to Telegram
        run: python3 notify_telegram.py digest

  # ── 6. Telegram countdown (every Sunday) ─────────────────────────────────────
  telegram-countdown:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Send weekly countdown to Telegram
        run: python3 notify_telegram.py countdown
