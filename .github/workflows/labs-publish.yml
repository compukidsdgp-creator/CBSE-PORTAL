name: Virtual labs — publish approved rebuilds

# Runs when a lab draft is added/revised (virtual-labs/*/_drafts/) or approved in the admin panel
# (labs_content/approvals.json). Approved drafts that pass lab_check replace the old lab at the same address.
on:
  push:
    branches: [main]
    paths:
      - "labs_content/**"
      - "virtual-labs/*/_drafts/**"
      - "labs_publish.py"
      - "lab_check.py"
  workflow_dispatch:

concurrency:
  group: labs-publish
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # always the latest main, not the commit that triggered the run (stale state files)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish approved labs
        run: |
          python3 labs_publish.py
          python3 share_tags.py || true
          python3 gen_sitemap.py || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A virtual-labs labs_content sitemap.xml
          git diff --cached --quiet && { echo "nothing to publish"; exit 0; }
          git commit -q -m "labs: publish approved rebuilds"
          for i in 1 2 3 4; do git pull -q --rebase -X theirs --autostash origin main && git push -q && break; git rebase --abort 2>/dev/null || true; sleep $((i * 5)); done; git fetch -q origin main; [ -z "$(git log origin/main..HEAD --oneline)" ] || { echo "::error::could not push the commit"; exit 1; }
      - name: Tell the owner a new lab draft is ready (private Telegram chat)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SEO_REPORT_CHAT_ID: ${{ secrets.SEO_REPORT_CHAT_ID }}
          MSG: ${{ github.event.head_commit.message }}
        run: python3 notify_draft.py || true
      - name: Refresh the admin dashboard numbers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run admin-dashboard.yml || true
