name: WHY? reel (Sunday + Wednesday 6:30 PM IST)

on:
  schedule:
    - cron: '0 13 * * 0,3'        # Sunday + Wednesday 13:00 UTC = 6:30 PM IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (true/false)'
        required: false
        default: 'false'
      force:
        description: 'Post even if a WHY? reel already went out today (true/false)'
        required: false
        default: ''

concurrency:
  group: why-reel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Skip if already posted today
        id: guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.force }}" ]; then
            echo "done=no" >> $GITHUB_OUTPUT; exit 0      # an explicit manual request always runs
          fi
          echo "done=$(python3 already_posted_today.py why-weekly.yml)" >> $GITHUB_OUTPUT
      - name: Install page builder dependencies
        if: steps.guard.outputs.done != 'yes'
        run: pip install --quiet matplotlib numpy pillow || true
      - name: Post the next WHY? reel
        if: steps.guard.outputs.done != 'yes'
        env:
          FB_PAGE_ID:             ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN:   ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID:   ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GITHUB_REPOSITORY:      ${{ github.repository }}
          GITHUB_REF_NAME:        ${{ github.ref_name }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python3 post_why_reel.py --dry-run
          else
            python3 post_why_reel.py
          fi
      - name: Save progress
        if: always() && github.event.inputs.dry_run != 'true' && steps.guard.outputs.done != 'yes'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          git config user.name  "social-post-bot"
          git config user.email "bot@cbsemock.org.in"
          python3 reels_page.py || echo "::warning::Reel pages were not refreshed"
          python3 learn_pages.py || echo "::warning::Learn pages were not refreshed"
          python3 go_page.py || echo "::warning::Link-in-bio page was not refreshed"
          git add -A formula-posts/why why-reels formula-reels learn go index.html chapters cbse-class-*.html || true
          git diff --cached --quiet && exit 0
          git commit -q -m "chore: WHY? reel posted [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase --autostash -q origin main && git push -q origin main && exit 0
            sleep $((i * 6))
          done
          echo "::warning::Could not save WHY? posting progress"
