name: Daily CBSE News Update

on:
  workflow_dispatch: # Manual run; scheduled updates are handled by portal-automation.yml

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch CBSE news and write news.html
        run: python3 fetch_news.py
      - name: Commit and push if changed
        run: |
          git config user.name "cbse-news-bot"
          git config user.email "bot@cbsemock.org.in"
          git add news.html
          git diff --cached --quiet || git commit -m "chore: manual CBSE news update $(date -u +%Y-%m-%d)" && git push
