name: Weekly Promo Post

on:
  schedule:
    # Every Saturday and Sunday 11:30 AM IST (6:00 UTC)
    - cron: '0 6 * * 6,0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Force a specific promo: promo_quest, promo_mock, promo_lab, promo_notes (leave blank for the promo planned for today)'
        required: false
        default: ''
      platform:
        description: 'Platform: facebook, telegram, or both'
        required: false
        default: 'both'
      dry_run:
        description: 'Dry run (true/false)'
        required: false
        default: 'false'

jobs:
  weekly-promo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine which promo to post
        id: promo
        run: |
          INPUT_MODE="${{ github.event.inputs.mode }}"
          if [ -n "$INPUT_MODE" ]; then
            MODE="$INPUT_MODE"
          else
            # Weekend A: Sat Study Notes, Sun Mock Tests · Weekend B: Sat Monthly Quest, Sun Virtual Labs
            MODE="$(python3 promo_config.py)"
          fi
          if [ -z "$MODE" ]; then
            echo "::error::No promo is planned for today (promos go out on Saturday and Sunday). To post one anyway, run again and fill in the mode."
            exit 1
          fi
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "Posting promo: $MODE"

      - name: Post to Facebook
        if: >
          github.event.inputs.platform == '' ||
          github.event.inputs.platform == 'facebook' ||
          github.event.inputs.platform == 'both'
        env:
          FB_PAGE_ID:           ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          MODE="${{ steps.promo.outputs.mode }}"
          if [ "$DRY" = "true" ]; then
            python3 post_facebook.py --mode "$MODE" --dry-run
          else
            python3 post_facebook.py --mode "$MODE"
          fi

      - name: Post to Telegram
        if: >
          always() && steps.promo.outputs.mode != '' && (
          github.event.inputs.platform == '' ||
          github.event.inputs.platform == 'telegram' ||
          github.event.inputs.platform == 'both' )
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          MODE="${{ steps.promo.outputs.mode }}"
          if [ "$DRY" = "true" ]; then
            python3 post_telegram.py --mode "$MODE" --dry-run
          else
            python3 post_telegram.py --mode "$MODE"
          fi

      - name: Post to Instagram
        if: >
          always() && steps.promo.outputs.mode != '' && (
          github.event.inputs.platform == '' ||
          github.event.inputs.platform == 'instagram' ||
          github.event.inputs.platform == 'both' )
        env:
          INSTAGRAM_ACCOUNT_ID:   ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          MODE="${{ steps.promo.outputs.mode }}"
          if [ "$DRY" = "true" ]; then
            python3 post_instagram.py --mode "$MODE" --dry-run
          else
            python3 post_instagram.py --mode "$MODE"
          fi
