name: Daily Social Media Posts

on:
  schedule:
    # Quest of the Day — 7:00 AM IST (1:30 UTC)
    - cron: '30 1 * * *'
    # News Digest — 6:00 PM IST (12:30 UTC)
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to post: quest, news, or both'
        required: false
        default: 'both'
      platform:
        description: 'Platform: facebook, telegram, or both'
        required: false
        default: 'both'
      dry_run:
        description: 'Dry run (true/false) — preview without posting'
        required: false
        default: 'false'

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine post mode from schedule
        id: mode
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "$(date -u +%H)" -lt "06" ]; then
            echo "mode=quest" >> $GITHUB_OUTPUT
          else
            echo "mode=news" >> $GITHUB_OUTPUT
          fi

      - name: Post to Facebook
        if: >
          github.event.inputs.platform == '' ||
          github.event.inputs.platform == 'facebook' ||
          github.event.inputs.platform == 'both'
        env:
          FB_PAGE_ID:           ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          MODE="${{ steps.mode.outputs.mode }}"
          if [ "$DRY" = "true" ]; then
            python3 post_facebook.py --mode "$MODE" --dry-run
          else
            python3 post_facebook.py --mode "$MODE"
          fi

      - name: Post to Telegram
        if: >
          github.event.inputs.platform == '' ||
          github.event.inputs.platform == 'telegram' ||
          github.event.inputs.platform == 'both'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          MODE="${{ steps.mode.outputs.mode }}"
          if [ "$DRY" = "true" ]; then
            python3 post_telegram.py --mode "$MODE" --dry-run
          else
            python3 post_telegram.py --mode "$MODE"
          fi
