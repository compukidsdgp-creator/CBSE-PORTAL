name: Daily Social Media Posts

on:
  schedule:
    # Quest of the Day — 7:00 AM IST (1:30 UTC)
    - cron: '30 1 * * *'
    # News Digest — 6:00 PM IST (12:30 UTC)
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to post: morning, evening, quest, news, notes, practice_10, practice_12, lab, weekly_focus, all'
        required: false
        default: 'morning'
      platform:
        description: 'Platform: facebook, telegram, or both'
        required: false
        default: 'both'
      dry_run:
        description: 'Dry run (true/false) — preview without posting'
        required: false
        default: 'false'

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine post mode from schedule
        id: mode
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "$(date -u +%H)" -lt "06" ]; then
            # Morning run (1:30 UTC = 7 AM IST): quest + notes + practice papers
            echo "mode=morning" >> $GITHUB_OUTPUT
          else
            # Evening run (12:30 UTC = 6 PM IST): news only
            echo "mode=evening" >> $GITHUB_OUTPUT
          fi

      - name: Post to Facebook
        if: >
          github.event.inputs.platform == '' ||
          github.event.inputs.platform == 'facebook' ||
          github.event.inputs.platform == 'both'
        env:
          FB_PAGE_ID:           ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          MODE="${{ steps.mode.outputs.mode }}"
          if [ "$DRY" = "true" ]; then
            python3 post_facebook.py --mode "$MODE" --dry-run
          else
            python3 post_facebook.py --mode "$MODE"
          fi

      - name: Commit tracker CSV updates
        run: |
          git config user.name  "social-post-bot"
          git config user.email "bot@cbsemock.org.in"
          git add social-posting-tracker.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update social posting tracker [skip ci]"
          git push || true

      - name: Post to Telegram
        if: >
          github.event.inputs.platform == '' ||
          github.event.inputs.platform == 'telegram' ||
          github.event.inputs.platform == 'both'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          MODE="${{ steps.mode.outputs.mode }}"
          if [ "$DRY" = "true" ]; then
            python3 post_telegram.py --mode "$MODE" --dry-run
          else
            python3 post_telegram.py --mode "$MODE"
          fi
