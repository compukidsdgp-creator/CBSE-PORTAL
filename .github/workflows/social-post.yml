name: Daily Social Media Posts

on:
  schedule:
    # Quest of the Day — 7:00 AM IST (1:30 UTC)
    - cron: '30 1 * * *'
    # Lab Activity — 10:00 AM IST (4:30 UTC)
    - cron: '30 4 * * *'
    # Afternoon Engagement — 2:00 PM IST (8:30 UTC)
    - cron: '30 8 * * *'
    # News Digest — 6:00 PM IST (12:30 UTC)
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to post: morning, lab_slot, afternoon, evening, quest, news, notes, practice_10, practice_12, lab, weekly_focus, all'
        required: false
        default: 'morning'
      platform:
        description: 'Platform: facebook, telegram, or both'
        required: false
        default: 'both'
      dry_run:
        description: 'Dry run (true/false) — preview without posting'
        required: false
        default: 'false'

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine post mode from schedule
        id: mode
        run: |
          VALID_MODES="morning lab_slot afternoon evening quest news notes practice_10 practice_12 lab weekly_focus all"
          INPUT_MODE="${{ github.event.inputs.mode }}"
          HOUR_UTC="$(date -u +%H)"

          if [ -n "$INPUT_MODE" ]; then
            # Validate the input mode
            if echo "$VALID_MODES" | grep -qw "$INPUT_MODE"; then
              echo "mode=$INPUT_MODE" >> $GITHUB_OUTPUT
            else
              echo "❌ Invalid mode: '$INPUT_MODE'"
              echo "   Valid modes: $VALID_MODES"
              exit 1
            fi
          elif [ "$HOUR_UTC" -lt "03" ]; then
            # Morning run (1:30 UTC = 7 AM IST)
            echo "mode=morning" >> $GITHUB_OUTPUT
          elif [ "$HOUR_UTC" -lt "07" ]; then
            # Lab Activity run (4:30 UTC = 10 AM IST)
            echo "mode=lab_slot" >> $GITHUB_OUTPUT
          elif [ "$HOUR_UTC" -lt "11" ]; then
            # Afternoon Engagement (8:30 UTC = 2 PM IST)
            echo "mode=afternoon" >> $GITHUB_OUTPUT
          else
            # Evening run (12:30 UTC = 6 PM IST): news only
            echo "mode=evening" >> $GITHUB_OUTPUT
          fi

      - name: Post to Facebook
        if: >
          github.event.inputs.platform == '' ||
          github.event.inputs.platform == 'facebook' ||
          github.event.inputs.platform == 'both'
        env:
          FB_PAGE_ID:           ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          MODE="${{ steps.mode.outputs.mode }}"
          if [ "$DRY" = "true" ]; then
            python3 post_facebook.py --mode "$MODE" --dry-run
          else
            python3 post_facebook.py --mode "$MODE"
          fi

      - name: Commit tracker CSV updates
        run: |
          git config user.name  "social-post-bot"
          git config user.email "bot@cbsemock.org.in"
          git add social-posting-tracker.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update social posting tracker [skip ci]"
          git push || true

      - name: Festival Greeting (Telegram — morning only)
        if: >
          steps.mode.outputs.mode == 'morning' &&
          (github.event.inputs.platform == '' ||
           github.event.inputs.platform == 'telegram' ||
           github.event.inputs.platform == 'both')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          if [ "$DRY" = "true" ]; then
            python3 post_festival.py --dry-run
          else
            python3 post_festival.py
          fi

      - name: Post to Telegram (morning / lab / evening)
        if: >
          steps.mode.outputs.mode != 'afternoon' &&
          (github.event.inputs.platform == '' ||
           github.event.inputs.platform == 'telegram' ||
           github.event.inputs.platform == 'both')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          MODE="${{ steps.mode.outputs.mode }}"
          if [ "$DRY" = "true" ]; then
            python3 post_telegram.py --mode "$MODE" --dry-run
          else
            python3 post_telegram.py --mode "$MODE"
          fi

      - name: Post Afternoon Engagement (Telegram only)
        if: >
          steps.mode.outputs.mode == 'afternoon' &&
          (github.event.inputs.platform == '' ||
           github.event.inputs.platform == 'telegram' ||
           github.event.inputs.platform == 'both')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          if [ "$DRY" = "true" ]; then
            python3 post_afternoon.py --dry-run
          else
            python3 post_afternoon.py
          fi

      - name: Commit afternoon tracker updates
        if: steps.mode.outputs.mode == 'afternoon'
        run: |
          git config user.name  "social-post-bot"
          git config user.email "bot@cbsemock.org.in"
          git add afternoon-tracker.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update afternoon tracker [skip ci]"
          git push || true
