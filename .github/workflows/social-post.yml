name: Daily Social Media Posts

on:
  # GitHub cron removed — scheduling is now handled by cronjobs.org
  # which calls the workflow_dispatch API endpoint at exact IST times.
  # This avoids GitHub's shared-runner queue delay (can be 5-7 hours late).
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to post: morning, lab_slot, afternoon, evening, festival, quest, news, notes, practice_10, practice_12, lab, weekly_focus, all, formula_flash, formula_reel | Promo: promo_quest, promo_mock, promo_lab, promo_notes | Mock papers: pyq_today (Mon/Wed/Fri, Class 10 + Class 12) | old: pyq_science10, pyq_maths10, pyq_physics12, pyq_maths12, pyq_chemistry12, pyq_biology12'
        required: false
        default: 'morning'
      platform:
        description: 'Platform: facebook, telegram, instagram, or both'
        required: false
        default: 'both'
      dry_run:
        description: 'Dry run (true/false) — preview without posting'
        required: false
        default: 'false'

jobs:
  post:
    runs-on: ubuntu-latest
    # Mock-paper runs wait for each other, so two triggers can never post the same paper twice
    concurrency:
      group: ${{ startsWith(github.event.inputs.mode, 'pyq_') && 'mock-papers' || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: write   # allow git push back to repo (queue→posted moves, tracker CSVs)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --quiet requests pillow numpy matplotlib ffmpeg-python reportlab 2>/dev/null || true
          # ffmpeg binary (for reel encoding)
          sudo apt-get install -y ffmpeg --quiet 2>/dev/null || true

      - name: Determine post mode from schedule
        id: mode
        run: |
          VALID_MODES="morning lab_slot afternoon evening festival quest news notes practice_10 practice_12 lab weekly_focus all formula_flash formula_flash_evening formula_reel promo_quest promo_mock promo_lab promo_notes pyq_today pyq_science10 pyq_maths10 pyq_physics12 pyq_maths12 pyq_chemistry12 pyq_biology12"
          INPUT_MODE="${{ github.event.inputs.mode }}"

          # Scheduling is done via cronjobs.org → workflow_dispatch API.
          # INPUT_MODE is always set (cronjobs.org passes it in the request body).
          echo "Input mode: '$INPUT_MODE'  (triggered at UTC: $(date -u +%H:%M))"

          if [ -n "$INPUT_MODE" ]; then
            if echo "$VALID_MODES" | grep -qw "$INPUT_MODE"; then
              echo "mode=$INPUT_MODE" >> $GITHUB_OUTPUT
            else
              echo "❌ Invalid mode: '$INPUT_MODE'"
              echo "   Valid modes: $VALID_MODES"
              exit 1
            fi
          else
            echo "⚠️  No mode supplied — defaulting to morning"
            echo "mode=morning" >> $GITHUB_OUTPUT
          fi

      - name: Post to Facebook
        if: >
          github.event.inputs.platform == '' ||
          github.event.inputs.platform == 'facebook' ||
          github.event.inputs.platform == 'both'
        env:
          FB_PAGE_ID:           ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          MODE="${{ steps.mode.outputs.mode }}"
          # formula_flash/formula_flash_evening/formula_reel/pyq_* handled by dedicated steps
          if [ "$MODE" = "formula_flash" ] || [ "$MODE" = "formula_flash_evening" ] || [ "$MODE" = "formula_reel" ]; then
            echo "[SKIP] mode=$MODE is handled by dedicated step"
          elif echo "$MODE" | grep -q "^pyq_"; then
            echo "[SKIP] mode=$MODE is handled by Post PYQ Practice Paper step"
          elif [ "$DRY" = "true" ]; then
            python3 post_facebook.py --mode "$MODE" --dry-run
          else
            python3 post_facebook.py --mode "$MODE"
          fi

      - name: Post to Instagram
        if: >
          github.event.inputs.platform == '' ||
          github.event.inputs.platform == 'instagram' ||
          github.event.inputs.platform == 'both'
        env:
          INSTAGRAM_ACCOUNT_ID:   ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          MODE="${{ steps.mode.outputs.mode }}"
          # Instagram: skip modes that have no image equivalent or use dedicated steps
          SKIP_MODES="afternoon festival evening formula_flash formula_flash_evening formula_reel"
          # Translate lab_slot → lab for post_instagram.py (which uses 'lab')
          IG_MODE="$MODE"
          [ "$MODE" = "lab_slot" ] && IG_MODE="lab"
          if echo "$SKIP_MODES" | grep -qw "$MODE"; then
            echo "[SKIP] Instagram not used for mode=$MODE (handled by dedicated step or not applicable)"
          elif echo "$MODE" | grep -q "^pyq_"; then
            echo "[SKIP] mode=$MODE is handled by Post PYQ Practice Paper step"
          elif [ "$DRY" = "true" ]; then
            python3 post_instagram.py --mode "$IG_MODE" --dry-run
          else
            python3 post_instagram.py --mode "$IG_MODE"
          fi

      - name: Post Formula Flash Image — Morning 8 AM IST (FB + Instagram)
        if: >
          steps.mode.outputs.mode == 'formula_flash' &&
          (github.event.inputs.platform == '' ||
           github.event.inputs.platform == 'facebook' ||
           github.event.inputs.platform == 'both')
        env:
          FB_PAGE_ID:            ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN:  ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID:  ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GITHUB_REPOSITORY:     ${{ github.repository }}
          GITHUB_REF_NAME:       ${{ github.ref_name }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          if [ "$DRY" = "true" ]; then
            python3 post_formula_image.py --slot morning --dry-run
          else
            python3 post_formula_image.py --slot morning
          fi

      - name: Post Formula Flash Image + Reel — Evening 8 PM IST (FB + Instagram)
        if: >
          steps.mode.outputs.mode == 'formula_flash_evening' &&
          (github.event.inputs.platform == '' ||
           github.event.inputs.platform == 'facebook' ||
           github.event.inputs.platform == 'both')
        env:
          FB_PAGE_ID:            ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN:  ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID:  ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GITHUB_REPOSITORY:     ${{ github.repository }}
          GITHUB_REF_NAME:       ${{ github.ref_name }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          # Formula Flash Image (evening slot)
          if [ "$DRY" = "true" ]; then
            python3 post_formula_image.py --slot evening --dry-run
          else
            python3 post_formula_image.py --slot evening
          fi
          # Formula Reel (FB + Instagram Reels)
          if [ "$DRY" = "true" ]; then
            python3 post_formula_reel.py --dry-run
          else
            python3 post_formula_reel.py
          fi

      - name: Post Formula Reel (manual / all trigger only)
        if: >
          (steps.mode.outputs.mode == 'formula_reel' ||
           steps.mode.outputs.mode == 'all') &&
          (github.event.inputs.platform == '' ||
           github.event.inputs.platform == 'facebook' ||
           github.event.inputs.platform == 'both')
        env:
          FB_PAGE_ID:            ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN:  ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID:  ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GITHUB_REPOSITORY:     ${{ github.repository }}
          GITHUB_REF_NAME:       ${{ github.ref_name }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          if [ "$DRY" = "true" ]; then
            python3 post_formula_reel.py --dry-run
          else
            python3 post_formula_reel.py
          fi

      - name: Post PYQ Practice Paper
        if: startsWith(steps.mode.outputs.mode, 'pyq_')
        env:
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_PAGE_ID:             ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN:   ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID:   ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GITHUB_REPOSITORY:      ${{ github.repository }}
          GITHUB_REF_NAME:        ${{ github.ref_name }}
          GH_TOKEN:               ${{ secrets.GITHUB_TOKEN }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          MODE="${{ steps.mode.outputs.mode }}"
          # Extract subject key: pyq_science10 → science10
          SUBJECT="${MODE#pyq_}"
          # Configure git for the commit inside post_pyq.py
          git config user.name  "social-post-bot"
          git config user.email "bot@cbsemock.org.in"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
          # Every pyq_* mode now posts today's planned papers (Class 10 + Class 12)
          # from the no-repeat pool. Use mode=pyq_today; the old per-subject modes
          # are kept only so existing schedules do not break.
          echo "Requested: $SUBJECT → posting today's planned papers"
          if [ "$DRY" = "true" ]; then
            python3 post_pyq.py --today --dry-run
          else
            python3 post_pyq.py --today
          fi

      - name: Save posting progress (after Facebook / Instagram / papers)
        if: always()
        run: |
          git config user.name  "social-post-bot"
          git config user.email "bot@cbsemock.org.in"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          # Refresh the Formula Board page so newly uploaded formula images appear on it.
          python3 formula_board_page.py || echo "::warning::Formula Board was not refreshed"
          # Add each path on its own: one missing folder must not stop the others
          # from being saved (that is what made the same lab / notes post repeat).
          for p in social-posting-tracker.csv afternoon-tracker.json \
                   formula-posts/post_log.csv formula-posts/reel_log.csv \
                   formula-posts/queue formula-posts/posted formula-board \
                   formula-posts/videos/queue formula-posts/videos/posted; do
            [ -e "$p" ] && git add -A -- "$p" || true
          done
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "chore: save posting progress [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
            git push origin "HEAD:${GITHUB_REF_NAME:-main}" || echo "::warning::Could not save posting progress — the same item may be posted again."
          fi

      - name: Festival Greeting (Telegram)
        if: >
          github.event.inputs.platform == '' ||
          github.event.inputs.platform == 'telegram' ||
          github.event.inputs.platform == 'both'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          MODE="${{ steps.mode.outputs.mode }}"
          # Always run festival check on morning/all/festival mode
          # On other explicit modes, only run if specifically requested
          if [ "$MODE" = "festival" ] || [ "$MODE" = "morning" ] || [ "$MODE" = "all" ]; then
            if [ "$DRY" = "true" ]; then
              python3 post_festival.py --dry-run
            else
              python3 post_festival.py
            fi
          else
            echo "[SKIP] Festival check skipped for mode=$MODE"
          fi

      - name: Post to Telegram (morning / lab / evening / promo)
        if: >
          steps.mode.outputs.mode != 'afternoon' &&
          steps.mode.outputs.mode != 'festival' &&
          (github.event.inputs.platform == '' ||
           github.event.inputs.platform == 'telegram' ||
           github.event.inputs.platform == 'both')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          MODE="${{ steps.mode.outputs.mode }}"
          # formula_flash/formula_flash_evening/formula_reel/pyq_* handled by dedicated steps
          if [ "$MODE" = "formula_flash" ] || [ "$MODE" = "formula_flash_evening" ] || [ "$MODE" = "formula_reel" ]; then
            echo "[SKIP] mode=$MODE is handled by dedicated step"
          elif echo "$MODE" | grep -q "^pyq_"; then
            echo "[SKIP] mode=$MODE is handled by Post PYQ Practice Paper step"
          elif [ "$DRY" = "true" ]; then
            python3 post_telegram.py --mode "$MODE" --dry-run
          else
            python3 post_telegram.py --mode "$MODE"
          fi

      - name: Post Afternoon Engagement (Telegram only)
        if: >
          steps.mode.outputs.mode == 'afternoon' &&
          (github.event.inputs.platform == '' ||
           github.event.inputs.platform == 'telegram' ||
           github.event.inputs.platform == 'both')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          if [ "$DRY" = "true" ]; then
            python3 post_afternoon.py --dry-run
          else
            python3 post_afternoon.py
          fi

      - name: Save posting progress (after Telegram)
        if: always()
        run: |
          git config user.name  "social-post-bot"
          git config user.email "bot@cbsemock.org.in"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          # Add each path on its own: one missing folder must not stop the others
          # from being saved (that is what made the same lab / notes post repeat).
          for p in social-posting-tracker.csv afternoon-tracker.json \
                   formula-posts/post_log.csv formula-posts/reel_log.csv \
                   formula-posts/queue formula-posts/posted formula-board \
                   formula-posts/videos/queue formula-posts/videos/posted; do
            [ -e "$p" ] && git add -A -- "$p" || true
          done
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "chore: save posting progress [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
            git push origin "HEAD:${GITHUB_REF_NAME:-main}" || echo "::warning::Could not save posting progress — the same item may be posted again."
          fi
