name: Daily Social Media Posts

on:
  schedule:
    # Quest of the Day — 7:00 AM IST (1:30 UTC)
    - cron: '30 1 * * *'
    # Formula Flash Morning — 8:00 AM IST (2:30 UTC)
    - cron: '30 2 * * *'
    # Lab Activity — 10:00 AM IST (4:30 UTC)
    - cron: '30 4 * * *'
    # Afternoon Engagement — 2:00 PM IST (8:30 UTC)
    - cron: '30 8 * * *'
    # News Digest — 6:00 PM IST (12:30 UTC)
    - cron: '30 12 * * *'
    # Formula Flash Evening — 8:00 PM IST (14:30 UTC)
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to post: morning, lab_slot, afternoon, evening, festival, quest, news, notes, practice_10, practice_12, lab, weekly_focus, all, formula_flash, formula_reel | Promo: promo_quest, promo_mock, promo_lab, promo_notes'
        required: false
        default: 'morning'
      platform:
        description: 'Platform: facebook, telegram, instagram, or both'
        required: false
        default: 'both'
      dry_run:
        description: 'Dry run (true/false) — preview without posting'
        required: false
        default: 'false'

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --quiet requests pillow numpy matplotlib ffmpeg-python 2>/dev/null || true
          # ffmpeg binary (for reel encoding)
          sudo apt-get install -y ffmpeg --quiet 2>/dev/null || true

      - name: Determine post mode from schedule
        id: mode
        run: |
          VALID_MODES="morning lab_slot afternoon evening festival quest news notes practice_10 practice_12 lab weekly_focus all formula_flash formula_flash_evening formula_reel promo_quest promo_mock promo_lab promo_notes"
          INPUT_MODE="${{ github.event.inputs.mode }}"

          # GitHub Actions cron can be delayed by several hours.
          # Use the SCHEDULED cron minute/hour from github.event.schedule instead of
          # the actual wall-clock time — this way the mode is always correct even
          # when the runner starts late.
          SCHEDULE="${{ github.event.schedule }}"
          echo "Scheduled cron: '$SCHEDULE'  (actual UTC: $(date -u +%H:%M))"

          if [ -n "$INPUT_MODE" ]; then
            # Manual dispatch — validate and use the given mode
            if echo "$VALID_MODES" | grep -qw "$INPUT_MODE"; then
              echo "mode=$INPUT_MODE" >> $GITHUB_OUTPUT
              echo "slot=manual" >> $GITHUB_OUTPUT
            else
              echo "❌ Invalid mode: '$INPUT_MODE'"
              echo "   Valid modes: $VALID_MODES"
              exit 1
            fi
          elif [ "$SCHEDULE" = "30 1 * * *" ]; then
            # 1:30 UTC = 7:00 AM IST — Quest / Morning
            echo "mode=morning" >> $GITHUB_OUTPUT
            echo "slot=1_30utc" >> $GITHUB_OUTPUT
          elif [ "$SCHEDULE" = "30 2 * * *" ]; then
            # 2:30 UTC = 8:00 AM IST — Formula Flash (morning)
            echo "mode=formula_flash" >> $GITHUB_OUTPUT
            echo "slot=2_30utc" >> $GITHUB_OUTPUT
          elif [ "$SCHEDULE" = "30 4 * * *" ]; then
            # 4:30 UTC = 10:00 AM IST — Lab Activity
            echo "mode=lab_slot" >> $GITHUB_OUTPUT
            echo "slot=4_30utc" >> $GITHUB_OUTPUT
          elif [ "$SCHEDULE" = "30 8 * * *" ]; then
            # 8:30 UTC = 2:00 PM IST — Afternoon Engagement
            echo "mode=afternoon" >> $GITHUB_OUTPUT
            echo "slot=8_30utc" >> $GITHUB_OUTPUT
          elif [ "$SCHEDULE" = "30 12 * * *" ]; then
            # 12:30 UTC = 6:00 PM IST — News Digest
            echo "mode=evening" >> $GITHUB_OUTPUT
            echo "slot=12_30utc" >> $GITHUB_OUTPUT
          elif [ "$SCHEDULE" = "30 14 * * *" ]; then
            # 14:30 UTC = 8:00 PM IST — Formula Flash (evening) + Formula Reel
            echo "mode=formula_flash_evening" >> $GITHUB_OUTPUT
            echo "slot=14_30utc" >> $GITHUB_OUTPUT
          else
            echo "⚠️  Unknown schedule '$SCHEDULE' — defaulting to morning"
            echo "mode=morning" >> $GITHUB_OUTPUT
            echo "slot=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Post to Facebook
        if: >
          github.event.inputs.platform == '' ||
          github.event.inputs.platform == 'facebook' ||
          github.event.inputs.platform == 'both'
        env:
          FB_PAGE_ID:           ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          MODE="${{ steps.mode.outputs.mode }}"
          # formula_flash/formula_flash_evening/formula_reel handled by dedicated steps
          if [ "$MODE" = "formula_flash" ] || [ "$MODE" = "formula_flash_evening" ] || [ "$MODE" = "formula_reel" ]; then
            echo "[SKIP] mode=$MODE is handled by dedicated step"
          elif [ "$DRY" = "true" ]; then
            python3 post_facebook.py --mode "$MODE" --dry-run
          else
            python3 post_facebook.py --mode "$MODE"
          fi

      - name: Post to Instagram
        if: >
          github.event.inputs.platform == '' ||
          github.event.inputs.platform == 'instagram' ||
          github.event.inputs.platform == 'both'
        env:
          INSTAGRAM_ACCOUNT_ID:   ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          MODE="${{ steps.mode.outputs.mode }}"
          # Instagram: skip modes that have no image equivalent or use dedicated steps
          SKIP_MODES="afternoon festival evening formula_flash formula_flash_evening formula_reel"
          # Translate lab_slot → lab for post_instagram.py (which uses 'lab')
          IG_MODE="$MODE"
          [ "$MODE" = "lab_slot" ] && IG_MODE="lab"
          if echo "$SKIP_MODES" | grep -qw "$MODE"; then
            echo "[SKIP] Instagram not used for mode=$MODE (handled by dedicated step or not applicable)"
          elif [ "$DRY" = "true" ]; then
            python3 post_instagram.py --mode "$IG_MODE" --dry-run
          else
            python3 post_instagram.py --mode "$IG_MODE"
          fi

      - name: Post Formula Flash Image — Morning 8 AM IST (FB + Instagram)
        if: >
          steps.mode.outputs.mode == 'formula_flash' &&
          (github.event.inputs.platform == '' ||
           github.event.inputs.platform == 'facebook' ||
           github.event.inputs.platform == 'both')
        env:
          FB_PAGE_ID:            ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN:  ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID:  ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GITHUB_REPOSITORY:     ${{ github.repository }}
          GITHUB_REF_NAME:       ${{ github.ref_name }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          if [ "$DRY" = "true" ]; then
            python3 post_formula_image.py --slot morning --dry-run
          else
            python3 post_formula_image.py --slot morning
          fi

      - name: Post Formula Flash Image + Reel — Evening 8 PM IST (FB + Instagram)
        if: >
          steps.mode.outputs.mode == 'formula_flash_evening' &&
          (github.event.inputs.platform == '' ||
           github.event.inputs.platform == 'facebook' ||
           github.event.inputs.platform == 'both')
        env:
          FB_PAGE_ID:            ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN:  ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID:  ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GITHUB_REPOSITORY:     ${{ github.repository }}
          GITHUB_REF_NAME:       ${{ github.ref_name }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          # Formula Flash Image (evening slot)
          if [ "$DRY" = "true" ]; then
            python3 post_formula_image.py --slot evening --dry-run
          else
            python3 post_formula_image.py --slot evening
          fi
          # Formula Reel (FB + Instagram Reels)
          if [ "$DRY" = "true" ]; then
            python3 post_formula_reel.py --dry-run
          else
            python3 post_formula_reel.py
          fi

      - name: Post Formula Reel (manual / all trigger only)
        if: >
          (steps.mode.outputs.mode == 'formula_reel' ||
           steps.mode.outputs.mode == 'all') &&
          (github.event.inputs.platform == '' ||
           github.event.inputs.platform == 'facebook' ||
           github.event.inputs.platform == 'both')
        env:
          FB_PAGE_ID:            ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN:  ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID:  ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GITHUB_REPOSITORY:     ${{ github.repository }}
          GITHUB_REF_NAME:       ${{ github.ref_name }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          if [ "$DRY" = "true" ]; then
            python3 post_formula_reel.py --dry-run
          else
            python3 post_formula_reel.py
          fi

      - name: Commit tracker CSV updates
        run: |
          git config user.name  "social-post-bot"
          git config user.email "bot@cbsemock.org.in"
          git add social-posting-tracker.csv \
                  formula-posts/post_log.csv \
                  formula-posts/reel_log.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update social posting tracker [skip ci]"
          git push || true

      - name: Festival Greeting (Telegram)
        if: >
          github.event.inputs.platform == '' ||
          github.event.inputs.platform == 'telegram' ||
          github.event.inputs.platform == 'both'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          MODE="${{ steps.mode.outputs.mode }}"
          # Always run festival check on morning/all/festival mode
          # On other explicit modes, only run if specifically requested
          if [ "$MODE" = "festival" ] || [ "$MODE" = "morning" ] || [ "$MODE" = "all" ]; then
            if [ "$DRY" = "true" ]; then
              python3 post_festival.py --dry-run
            else
              python3 post_festival.py
            fi
          else
            echo "[SKIP] Festival check skipped for mode=$MODE"
          fi

      - name: Post to Telegram (morning / lab / evening / promo)
        if: >
          steps.mode.outputs.mode != 'afternoon' &&
          steps.mode.outputs.mode != 'festival' &&
          (github.event.inputs.platform == '' ||
           github.event.inputs.platform == 'telegram' ||
           github.event.inputs.platform == 'both')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          MODE="${{ steps.mode.outputs.mode }}"
          # formula_flash/formula_flash_evening/formula_reel handled by dedicated steps
          if [ "$MODE" = "formula_flash" ] || [ "$MODE" = "formula_flash_evening" ] || [ "$MODE" = "formula_reel" ]; then
            echo "[SKIP] mode=$MODE is handled by dedicated step"
          elif [ "$DRY" = "true" ]; then
            python3 post_telegram.py --mode "$MODE" --dry-run
          else
            python3 post_telegram.py --mode "$MODE"
          fi

      - name: Post Afternoon Engagement (Telegram only)
        if: >
          steps.mode.outputs.mode == 'afternoon' &&
          (github.event.inputs.platform == '' ||
           github.event.inputs.platform == 'telegram' ||
           github.event.inputs.platform == 'both')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          if [ "$DRY" = "true" ]; then
            python3 post_afternoon.py --dry-run
          else
            python3 post_afternoon.py
          fi

      - name: Commit afternoon tracker updates
        if: steps.mode.outputs.mode == 'afternoon'
        run: |
          git config user.name  "social-post-bot"
          git config user.email "bot@cbsemock.org.in"
          git add afternoon-tracker.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update afternoon tracker [skip ci]"
          git push || true
