name: Daily Social Media Posts

on:
  schedule:
    # Quest of the Day — 7:00 AM IST (1:30 UTC)
    - cron: '30 1 * * *'
    # Formula Flash Morning — 8:00 AM IST (2:30 UTC)
    - cron: '30 2 * * *'
    # Lab Activity — 10:00 AM IST (4:30 UTC)
    - cron: '30 4 * * *'
    # Afternoon Engagement — 2:00 PM IST (8:30 UTC)
    - cron: '30 8 * * *'
    # News Digest — 6:00 PM IST (12:30 UTC)
    - cron: '30 12 * * *'
    # Formula Flash Evening — 8:00 PM IST (14:30 UTC)
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to post: morning, lab_slot, afternoon, evening, festival, quest, news, notes, practice_10, practice_12, lab, weekly_focus, all, formula_flash | Promo: promo_quest, promo_mock, promo_lab, promo_notes'
        required: false
        default: 'morning'
      platform:
        description: 'Platform: facebook, telegram, instagram, or both'
        required: false
        default: 'both'
      dry_run:
        description: 'Dry run (true/false) — preview without posting'
        required: false
        default: 'false'

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine post mode from schedule
        id: mode
        run: |
          VALID_MODES="morning lab_slot afternoon evening festival quest news notes practice_10 practice_12 lab weekly_focus all formula_flash promo_quest promo_mock promo_lab promo_notes"
          INPUT_MODE="${{ github.event.inputs.mode }}"
          HOUR_UTC="$(date -u +%H)"

          if [ -n "$INPUT_MODE" ]; then
            # Validate the input mode
            if echo "$VALID_MODES" | grep -qw "$INPUT_MODE"; then
              echo "mode=$INPUT_MODE" >> $GITHUB_OUTPUT
            else
              echo "❌ Invalid mode: '$INPUT_MODE'"
              echo "   Valid modes: $VALID_MODES"
              exit 1
            fi
          elif [ "$HOUR_UTC" -lt "03" ]; then
            # Morning run (1:30 UTC = 7 AM IST)
            echo "mode=morning" >> $GITHUB_OUTPUT
          elif [ "$HOUR_UTC" -lt "07" ]; then
            # Lab Activity run (4:30 UTC = 10 AM IST)
            echo "mode=lab_slot" >> $GITHUB_OUTPUT
          elif [ "$HOUR_UTC" -lt "11" ]; then
            # Afternoon Engagement (8:30 UTC = 2 PM IST)
            echo "mode=afternoon" >> $GITHUB_OUTPUT
          else
            # Evening run (12:30 UTC = 6 PM IST): news only
            echo "mode=evening" >> $GITHUB_OUTPUT
          fi

      - name: Post to Facebook
        if: >
          github.event.inputs.platform == '' ||
          github.event.inputs.platform == 'facebook' ||
          github.event.inputs.platform == 'both'
        env:
          FB_PAGE_ID:           ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          MODE="${{ steps.mode.outputs.mode }}"
          if [ "$DRY" = "true" ]; then
            python3 post_facebook.py --mode "$MODE" --dry-run
          else
            python3 post_facebook.py --mode "$MODE"
          fi

      - name: Post to Instagram
        if: >
          github.event.inputs.platform == '' ||
          github.event.inputs.platform == 'instagram' ||
          github.event.inputs.platform == 'both'
        env:
          INSTAGRAM_ACCOUNT_ID:   ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          MODE="${{ steps.mode.outputs.mode }}"
          # Instagram: skip afternoon/festival/news modes (no image equivalent)
          SKIP_MODES="afternoon festival evening"
          if echo "$SKIP_MODES" | grep -qw "$MODE"; then
            echo "[SKIP] Instagram not used for mode=$MODE"
          elif [ "$DRY" = "true" ]; then
            python3 post_instagram.py --mode "$MODE" --dry-run
          else
            python3 post_instagram.py --mode "$MODE"
          fi

      - name: Post Formula Flash Image (FB + Instagram)
        if: >
          github.event.inputs.mode == 'formula_flash' ||
          github.event.inputs.mode == '' ||
          github.event.inputs.mode == 'all'
        env:
          FB_PAGE_ID:            ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN:  ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID:  ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GITHUB_REPOSITORY:     ${{ github.repository }}
          GITHUB_REF_NAME:       ${{ github.ref_name }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          HOUR_UTC="$(date -u +%H)"
          # Only run at 8 AM IST (02:xx UTC) or 8 PM IST (14:xx UTC)
          # or when explicitly triggered with formula_flash mode
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "formula_flash" ] || \
             ( [ "$MODE" = "" ] && ( [ "$HOUR_UTC" = "02" ] || [ "$HOUR_UTC" = "14" ] ) ); then
            SLOT=$( [ "$HOUR_UTC" -lt "10" ] && echo "morning" || echo "evening" )
            if [ "$DRY" = "true" ]; then
              python3 post_formula_image.py --slot "$SLOT" --dry-run
            else
              python3 post_formula_image.py --slot "$SLOT"
            fi
          else
            echo "[SKIP] Formula Flash only runs at 8 AM / 8 PM IST (UTC 02:xx / 14:xx)"
          fi

      - name: Commit tracker CSV updates
        run: |
          git config user.name  "social-post-bot"
          git config user.email "bot@cbsemock.org.in"
          git add social-posting-tracker.csv formula-posts/post_log.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update social posting tracker [skip ci]"
          git push || true

      - name: Festival Greeting (Telegram)
        if: >
          github.event.inputs.platform == '' ||
          github.event.inputs.platform == 'telegram' ||
          github.event.inputs.platform == 'both'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          MODE="${{ steps.mode.outputs.mode }}"
          # Always run festival check on morning/all/festival mode
          # On other explicit modes, only run if specifically requested
          if [ "$MODE" = "festival" ] || [ "$MODE" = "morning" ] || [ "$MODE" = "all" ]; then
            if [ "$DRY" = "true" ]; then
              python3 post_festival.py --dry-run
            else
              python3 post_festival.py
            fi
          else
            echo "[SKIP] Festival check skipped for mode=$MODE"
          fi

      - name: Post to Telegram (morning / lab / evening / promo)
        if: >
          steps.mode.outputs.mode != 'afternoon' &&
          steps.mode.outputs.mode != 'festival' &&
          (github.event.inputs.platform == '' ||
           github.event.inputs.platform == 'telegram' ||
           github.event.inputs.platform == 'both')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          MODE="${{ steps.mode.outputs.mode }}"
          if [ "$DRY" = "true" ]; then
            python3 post_telegram.py --mode "$MODE" --dry-run
          else
            python3 post_telegram.py --mode "$MODE"
          fi

      - name: Post Afternoon Engagement (Telegram only)
        if: >
          steps.mode.outputs.mode == 'afternoon' &&
          (github.event.inputs.platform == '' ||
           github.event.inputs.platform == 'telegram' ||
           github.event.inputs.platform == 'both')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          if [ "$DRY" = "true" ]; then
            python3 post_afternoon.py --dry-run
          else
            python3 post_afternoon.py
          fi

      - name: Commit afternoon tracker updates
        if: steps.mode.outputs.mode == 'afternoon'
        run: |
          git config user.name  "social-post-bot"
          git config user.email "bot@cbsemock.org.in"
          git add afternoon-tracker.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update afternoon tracker [skip ci]"
          git push || true
