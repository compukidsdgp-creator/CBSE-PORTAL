name: Traffic check (diagnostic, read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/traffic-check.yml"]
permissions:
  contents: read
jobs:
  ga:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: GA4 top pages, landing pages and next pages from news
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID:          ${{ vars.GA4_PROPERTY_ID }}
          GSC_PROPERTY:             ${{ vars.GSC_PROPERTY }}
        run: |
          pip install --quiet google-auth requests cryptography
          python3 - <<'PY'
          import os, build_admin_data as B
          prop = os.environ["GA4_PROPERTY_ID"]
          tok = B.google_token("https://www.googleapis.com/auth/analytics.readonly")
          url = f"https://analyticsdata.googleapis.com/v1beta/properties/{prop}:runReport"
          def rep(body, label):
              r = B.post_json(url, body, tok)
              print(f"\n== {label}")
              for row in r.get("rows", []):
                  print("  ", " | ".join(v["value"] for v in row["dimensionValues"]), "→", " / ".join(m["value"] for m in row["metricValues"]))
          dr = [{"startDate": "7daysAgo", "endDate": "today"}]
          rep({"dateRanges": dr, "dimensions": [{"name": "pagePath"}], "metrics": [{"name": "screenPageViews"}, {"name": "activeUsers"}, {"name": "averageSessionDuration"}],
               "orderBys": [{"metric": {"metricName": "screenPageViews"}, "desc": True}], "limit": 15}, "top pages, 7 days (views / users / avg session s)")
          rep({"dateRanges": dr, "dimensions": [{"name": "landingPage"}], "metrics": [{"name": "sessions"}, {"name": "bounceRate"}, {"name": "screenPageViewsPerSession"}],
               "orderBys": [{"metric": {"metricName": "sessions"}, "desc": True}], "limit": 10}, "landing pages (sessions / bounce / pages per session)")
          rep({"dateRanges": dr, "dimensions": [{"name": "sessionSource"}], "metrics": [{"name": "sessions"}],
               "dimensionFilter": {"filter": {"fieldName": "landingPage", "stringFilter": {"matchType": "CONTAINS", "value": "news"}}},
               "orderBys": [{"metric": {"metricName": "sessions"}, "desc": True}], "limit": 8}, "where news-page visitors come from")
          rep({"dateRanges": dr, "dimensions": [{"name": "deviceCategory"}], "metrics": [{"name": "sessions"}],
               "dimensionFilter": {"filter": {"fieldName": "landingPage", "stringFilter": {"matchType": "CONTAINS", "value": "news"}}}}, "news visitors by device")
          rep({"dateRanges": [{"startDate": "28daysAgo", "endDate": "today"}], "dimensions": [{"name": "pagePath"}], "metrics": [{"name": "screenPageViews"}],
               "dimensionFilter": {"filter": {"fieldName": "pagePath", "stringFilter": {"matchType": "CONTAINS", "value": "news"}}}}, "news pages, 28 days")
          import urllib.parse
          from datetime import date, timedelta
          gt = B.google_token("https://www.googleapis.com/auth/webmasters.readonly")
          prop = os.environ.get("GSC_PROPERTY") or "https://cbsemock.org.in/"
          base = f"https://www.googleapis.com/webmasters/v3/sites/{urllib.parse.quote(prop, safe='')}/searchAnalytics/query"
          end = date.today() - timedelta(days=2); start = end - timedelta(days=27)
          r = B.post_json(base, {"startDate": str(start), "endDate": str(end), "dimensions": ["page"], "rowLimit": 15}, gt)
          print("\n== Search Console top pages, 28 days (clicks / impressions / position)")
          for row in sorted(r.get("rows", []), key=lambda x: -x["impressions"])[:15]:
              print("  ", row["keys"][0], "→", row["clicks"], "/", row["impressions"], "/", round(row["position"], 1))
          PY
