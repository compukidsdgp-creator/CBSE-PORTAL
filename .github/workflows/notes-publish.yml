name: Notes — publish approved chapters

# Runs when a chapter is approved (or changes are requested) in the admin panel's Content Tracker,
# or when the nightly run adds a new draft. Rebuilds the chapter pages, links live chapters from their
# subject notes pages, refreshes the sitemap and the tracker numbers.
on:
  push:
    branches: [main]
    paths:
      - "notes_content/**"
      - "notes_pages.py"
      - "hub_sync.py"
      - "syllabus.py"
  workflow_dispatch:

concurrency:
  group: notes-publish
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # always the latest main, not the commit that triggered the run (stale state files)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build chapter pages and link live chapters
        run: |
          pip install --quiet pillow && { pip install --quiet playwright && python -m playwright install --with-deps chromium >/dev/null || echo "::warning::playwright unavailable, simple posters"; }
          python3 notes_pages.py
          python3 hub_sync.py
          python3 favicon_tags.py || true
          python3 share_tags.py || true
          python3 gen_sitemap.py || true
          python3 reels_page.py || true
          python3 formula_board_page.py || true
          python3 go_page.py || true
          python3 announce_notes.py --render || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add notes notes_content resources chapters sitemap.xml why-reels formula-reels formula-board go
          git diff --cached --quiet && { echo "nothing to publish"; exit 0; }
          git commit -q -m "notes: publish approved chapters"
          for i in 1 2 3 4; do git pull -q --rebase -X theirs --autostash origin main && git push -q && break; git rebase --abort 2>/dev/null || true; sleep $((i * 5)); done; git fetch -q origin main; [ -z "$(git log origin/main..HEAD --oneline)" ] || { echo "::error::could not push the commit"; exit 1; }
      - name: Announce newly published chapters (Telegram channel, Facebook, Instagram)
        env:
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_PAGE_ACCESS_TOKEN:   ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY' || exit 0
          import announce_notes as A, sys
          sys.exit(0 if A.pending() else 1)
          PY
          sleep 25                      # let GitHub serve the freshly pushed poster
          python3 announce_notes.py --post
          git add notes_content/progress.json
          git diff --cached --quiet && exit 0
          git commit -q -m "notes: mark announced [skip ci]"
          for i in 1 2 3 4; do git pull -q --rebase -X theirs --autostash origin main && git push -q && break; git rebase --abort 2>/dev/null || true; sleep $((i * 5)); done; git fetch -q origin main; [ -z "$(git log origin/main..HEAD --oneline)" ] || { echo "::error::could not push the commit"; exit 1; }
      - name: Tell the owner a new draft is ready (private Telegram chat)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SEO_REPORT_CHAT_ID: ${{ secrets.SEO_REPORT_CHAT_ID }}
          MSG: ${{ github.event.head_commit.message }}
        run: python3 notify_draft.py || true
      - name: Refresh the admin dashboard numbers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run admin-dashboard.yml || true
